R_06_07-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/07/MA444_WPR_04_01-1920x1282.jpg"],"photographer":"Patryk Lewiński","url":"","industry":"Alkohole / FMCG","award":null,"description_paragraphs":["Spektakularna modernizacja biura Wyborowa Pernod Ricard w warszawskim Lumen - szklane cegły, falująca miedziana blacha i marmurowy bar 4m inspirowany kadziami destylacyjnymi. Wnętrze łączące elegancję, naturalne materiały i hybrydowy model pracy.","Pracownia: <strong>mode:lina<\/strong>. Lokalizacja: <strong>Lumen (11. piętro)<\/strong>. Powierzchnia: 2 400 m². Fotografia: <em>Patryk Lewiński<\/em>.","Branża najemcy: Alkohole / FMCG."],"source":"","officelist_url":"https://www.officelist.pl/oferta/lumen"},{"slug":"helio-s-a-wroclaw-2025","company":"Helio S.A.","city":"Wrocław","year":2025,"designer":"SAAN Architekci","area_m2":4088,"building":"Brochów","developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-9.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-7.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-13.jpg"],"photographer":"Tom Kurek","url":"","industry":null,"award":null,"description_paragraphs":["Siedziba producenta żywności Helio we wrocławskim Brochowie to projekt SAAN Architekci. Wnętrza łączą naturalne drewno z granatem i czernią.","W open space zastosowano miękkie przegrody, wykładziny pochłaniające dźwięk i panele sufitowe. Powtarzają się zaokrąglone formy, widoczne w niszach, łukowych obramieniach drzwi i podziałach posadzki, a kuchnia ma długą wyspę obłożoną fornirem. Projekt prowadziły Iga Sawicka i Aleksandra Niedużak.","Pracownia: <strong>SAAN Architekci<\/strong>. Powierzchnia: 4 088 m²."],"source":"","officelist_url":null},{"slug":"kruk-wroclaw-2025","company":"KRUK","city":"Wrocław","year":2025,"designer":"BIT Creative","area_m2":6000,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-4.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-3.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-4.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-5.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-6.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-7.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-8.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-9.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-10.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-11.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-13.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-14.jpg"],"photographer":"Fotomohito","url":"","industry":"Finanse","award":null,"description_paragraphs":["Wrocławska siedziba KRUK łączy cegłę, drewno, zieleń i czerwień. Każde piętro ma inny temat, od natury przez zjawiska pogodowe po sam Wrocław.","Na piętrze poświęconym miastu są grafiki studia Kolektyf z Kameleonem, Pergolą, Halą Stulecia i krasnalami, a w jednej ze stref wspólnych mozaika z panoramą Wrocławia. W recepcji umieszczono płaskorzeźbę Oskara Zięty. Biuro ma też strefę ćwiczeń, pokój z konsolą i pomieszczenia dostosowane do potrzeb osób neuroatypowych.","Pracownia: <strong>BIT Creative<\/strong>. Powierzchnia: 6 000 m². Branża: finanse."],"source":"","officelist_url":null},{"slug":"l-abo-by-l-uni-wroclaw-2025","company":"L'abo (by L'UNI)","city":"Wrocław","year":2025,"designer":"CUDO Studio","area_m2":null,"building":"Dawny Wydział Farmacji","developer":null,"hero":"https://pliki.propertydesign.pl/i/21/29/98/212998_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/21/29/83/212983_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/84/212984_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/87/212987_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/85/212985_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/86/212986_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/88/212988_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/89/212989_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/90/212990_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/91/212991_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/92/212992_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/93/212993_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/94/212994_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/95/212995_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/96/212996_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/97/212997_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/98/212998_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/99/212999_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/30/00/213000_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/30/01/213001_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/30/02/213002_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/30/03/213003_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/30/04/213004_r0_1140.jpg"],"photographer":"Migdał Studio","url":"","industry":"Coworking","award":null,"description_paragraphs":["W zabytkowym budynku dawnego Wydziału Farmacji we Wrocławiu powstała przestrzeń L'abo. To projekt wnętrz autorstwa pracowni CUDO, w którym elegancja, rzemiosło i lokalny kontekst spotykają się w harmonijnej kompozycji.","L'abo to wyjątkowa przestrzeń biurowa zlokalizowana w budynku dawnego Wydziału Farmacji w bliskim sąsiedztwie wrocławskiej starówki oraz Odry. Za projekt wnętrz odpowiada wrocławska pracownia CUDO.","## Coworking z duszą w sercu Wrocławia","Wnętrza są utrzymane w spokojnych, stonowanych i ciepłych kolorach, od złamanej bieli przez kolory piaskowe aż po kolor ugru, który pojawia się na elewacji budynku. W samym sercu przestrzeni biurowej zaprojektowano dominantę w postaci strefy coworkingowej, która sprzyja spotkaniom i wymianie pomysłów.","## Szklana instalacja jako interpretacja Odry","Centralnym elementem przestrzeni jest instalacja ze szkła farmaceutycznego, wykonana przez Villa Glass. Falująca tekstura szkła odzwierciedla formy pobliskiej Odry. Pod instalacjami znajdują się dwa stoły typu „common\", zaprojektowane do pracy indywidualnej, sesji burzy mózgów oraz wspólnych lunchów.","## Połączenie nowego ze starym","Aranżacja łączy nowoczesne materiały (stalowe regały, duże przeszklenia, designerskie meble) z klasycyzującą przestrzenią. Architekci uzupełnili wnętrza biur o autorsko opracowane kasetony, które dbają o akustykę i ukrywają technologię wentylacji."],"source":"","officelist_url":null},{"slug":"qair-wroclaw-2025","company":"Qair","city":"Wrocław","year":2025,"designer":"Workplace","area_m2":1600,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/08/qair-office-9.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/08/qair-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/qair-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/qair-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/qair-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/qair-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/qair-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/qair-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/qair-office-7.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/qair-office-8.jpg"],"photographer":"Adam Grzesik","url":"","industry":"Energia odnawialna","award":null,"description_paragraphs":["Nowa wrocławska siedziba Qair zebrała w jednym miejscu zespoły, które wcześniej pracowały osobno. Workplace przełożył na wnętrze wodę i wiatr, z którymi firma pracuje na co dzień.","Recepcję zdobi ściana wodna, sufit przecinają linie świetlne, a ruchoma instalacja oddaje rytm wiatru. Dużą kuchnię można połączyć z salą warsztatową. Przy projektowaniu uwzględniono neuroróżnorodność, stąd różne typy miejsc pracy, zielone ściany i filcowe panele akustyczne poruszające się z ruchem powietrza.","Pracownia: <strong>Workplace<\/strong>. Powierzchnia: 1 600 m². Branża: energia odnawialna."],"source":"","officelist_url":null},{"slug":"bayer-gdansk-2024","company":"Bayer","city":"Gdańsk","year":2024,"designer":"Design Anatomy","area_m2":null,"building":"Olivia Centre","developer":"Olivia Centre","hero":"https://pliki.propertydesign.pl/i/17/82/88/178288_1140.jpg","gallery":null,"photographer":"Tom Kurek","url":"","industry":"Pharma / Agro","award":null,"description_paragraphs":["Biuro jednego z najstarszych rezydentów Olivia Centre w Gdańsku przeszło niedawno metamorfozę. Dostosowane do najnowszych trendów biuro grupy Bayer powstało w duchu less waste, a opiera się na nowej strategii przestrzeni pracy, obowiązującej w całej grupie.","Za projekt odpowiada pracownia Design Anatomy, której portfolio obejmuje ponad 200 tys. m.kw. zaprojektowanych i wykończonych powierzchni biurowych.","Przestrzenie zyskały zupełnie nową stylistykę. Tematem przewodnim projektu są nawiązania do Oliwy, historycznej gdańskiej dzielnicy, w której położone jest Olivia Centre. Gama ciepłych rudości i zieleni nawiązuje do otaczającego krajobrazu. Oliwa to dzielnica, w której nie brak zieleni (na czele z Parkiem Oliwskim), a rudą kolorystykę w panoramę miejską wprowadzają dachy okolicznych budynków, elewacje biurowca Wave spod kreski Medusa Group i, przede wszystkim, Stocznia Gdańska."],"source":"","officelist_url":"https://www.officelist.pl/park-biurowy/olivia-centre"},{"slug":"dnv-gdynia-2024","company":"DNV","city":"Gdynia","year":2024,"designer":"Forbis Group","area_m2":null,"building":"Łużycka Office Park","developer":null,"hero":"https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3679-HDR-scaled.jpg","gallery":["https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3520-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3485-HDR-scaled-e1732281322677.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3497-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3530-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3631-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3574-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3590-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3670-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3725-HDR-scaled.jpg"],"photographer":null,"url":"","industry":"doradztwo / certyfikacja","award":null,"description_paragraphs":["Biuro DNV, firmy zajmującej się klasyfikacją i certyfikacją, mieści się w gdyńskim Łużycka Office Park. Projekt przygotowała pracownia Forbis Group.","Pracownia: <strong>Forbis Group<\/strong>. Budynek: <strong>Łużycka Office Park<\/strong>. Branża: klasyfikacja i certyfikacja."],"source":"","officelist_url":"https://www.officelist.pl/oferta/luzycka-office-park"},{"slug":"copernic-krakow-2024","company":"Copernic","city":"Kraków","year":2024,"designer":"Superpozycja Architekci (Dominika Trzcińska)","area_m2":750,"building":"Pascal (Korona Office Complex)","developer":null,"hero":"https://pliki.propertydesign.pl/i/19/60/80/196080_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/19/60/84/196084_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/60/82/196082_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/60/81/196081_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/60/83/196083_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/60/80/196080_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/60/85/196085_r0_1140.jpg"],"photographer":"mat. prasowe","url":"","industry":"Tech / Science","award":null,"description_paragraphs":["Siedziba Copernic w Krakowie zlokalizowana jest w prestiżowym budynku Pascal, będącym częścią Korona Office Complex. Biuro o powierzchni 750 mkw. to połączenie elegancji, funkcjonalności i ekologicznych rozwiązań.","Zaprojektowana przez Dominikę Trzcińską z pracowni Superpozycja Architekci przestrzeń nawiązuje do świata nauki, a inspiracją do jej aranżacji stała się postać Mikołaja Kopernika, patrona firmy. Elementy nawiązujące do astronomii, odkryć naukowych i nowoczesnej technologii są obecne w całym biurze.","Jednym z najciekawszych elementów jest rzeźba Mikołaja Kopernika, wydrukowana z biodegradowalnego PLA pochodzącego z recyklingu. To nie tylko symbol patrona, ale także manifest zaangażowania firmy w ekologiczną produkcję. Ważnym punktem biura są także stoły konferencyjne wykonane z paneli fotowoltaicznych, które symbolizują dążenie firmy do wykorzystywania energii odnawialnej w codziennej pracy.","Za realizację biura odpowiedzialny był Neo Świat."],"source":"","officelist_url":"https://www.officelist.pl/oferta/pascal"},{"slug":"jll-and-t-tris-krakow-2024","company":"JLL & Tétris","city":"Kraków","year":2024,"designer":"Tétris (in-house)","area_m2":200,"building":"Unity Centre","developer":null,"hero":"https://pliki.propertydesign.pl/i/19/55/81/195581_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/19/55/87/195587_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/55/83/195583_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/55/79/195579_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/55/78/195578_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/55/81/195581_r0_1140.jpg"],"photographer":"Szymon Polański","url":"","industry":"Real estate consulting","award":null,"description_paragraphs":["Projekt biura JLL i Tétris w krakowskim Unity Center obejmował adaptację 200 mkw, czyli jednego piętra, z podziałem na dwie strefy. Wprowadzono neutralną i szlachetną paletę kolorystyczną. Projekt charakteryzuje się dużą ilością zieleni, okładzinami ściennymi i szklanymi przegrodami.","Nowe biuro łączy udogodnienia z zakresu nowoczesnych technologii, z naturalną kolorystyką i przytulną atmosferą, sprzyjającą kreatywności i współpracy.","Zastosowano panele akustyczne i otwarte sufity. Grafiki nawiązujące do lokalnej architektury i motywów botanicznych podkreślają lokalny charakter biura. Wnętrze jest przytulne i nowoczesne, z wykorzystaniem filcu, drewna i zasłon akustycznych. Przestrzeń obejmuje strefę poczekalni, dużą kuchnię, salki konferencyjne i open space."],"source":"","officelist_url":"https://www.officelist.pl/oferta/unity-centre"},{"slug":"gambit-systems-polska-2024","company":"Gambit Systems","city":"Gliwice","year":2024,"designer":"Robert Konieczny + KWK Promes","area_m2":1285,"building":"Gambit Office (biuro + magazyn)","developer":null,"hero":"https://images.adsttc.com/media/images/6807/cba4/5bb0/0401/8564/7db6/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_17.jpg","gallery":["https://images.adsttc.com/media/images/6807/cba4/5bb0/0401/8564/7db6/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_17.jpg","https://images.adsttc.com/media/images/6807/cba4/9713/bf01/888b/e993/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_1.jpg","https://images.adsttc.com/media/images/6807/cba7/5bb0/04 /6807/cba5/5bb0/0401/8564/7db8/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_3.jpg"],"photographer":"Juliusz Sokołowski","url":"","industry":"Industrial / B2B Distribution","award":"World Building of the Week (World-Architects)","description_paragraphs":["Gambit, firma dystrybuująca specjalistyczne rury, zleciła zaprojektowanie budynku biurowo-magazynowego, który miał być jej unikalną wizytówką - przy najniższych możliwych kosztach. Wpadliśmy na pomysł użycia materiału, którym sama firma handluje i który mogła pozyskać po cenie kosztów. Jednocześnie chcieliśmy, by część biurowa i magazynowa tworzyły spójną całość. W rezultacie zaprojektowaliśmy budynek wyglądający jak stos rur - natychmiast komunikujący, czym zajmuje się firma. Na tej działce stała wcześniej prostokątna hala produkcyjna, ale najbliższe sąsiedztwo to domy mieszkalne ze stromymi dachami, często z długimi, kubicznymi zabudowaniami gospodarczymi - to zainspirowało ostateczną formę budynku."],"source":"","officelist_url":null},{"slug":"cms-poland-poznan-2024","company":"CMS Poland","city":"Poznań","year":2024,"designer":"Projektika.Interior","area_m2":420,"building":null,"developer":null,"hero":"https://pliki.propertydesign.pl/i/17/84/42/178442_1140.jpg","gallery":null,"photographer":"fotomohito","url":"","industry":"Legal","award":null,"description_paragraphs":["Siedziba CMS Poland w Poznaniu przeszła metamorfozę spod kreski pracowni Projektika.Interior. Powierzchnia ok. 420 mkw. przeszła kompleksową metamorfozę. Nadrzędnym celem było stworzenie miejsca, które zachęca do spędzania w nim czasu, sprzyjając integracji w zespole i budowaniu relacji z klientami.","Przestrzeń przepełniona jest lokalnymi akcentami - od fotografii poznańskiej architektury po mural z symbolami miasta. Znajdziemy na nim takie symbole Poznania, jak Bamberka, Koziołek, elementy gwary wielkopolskiej, schody z Okrąglaka, a także namalowany przez samego Noriakiego, Pan Peryskop.","Mural wykonali Dominik Dziedzina i Dorota Piechocińska z Grupy MUR.ALL oraz Noriaki, który domalował stworzoną przez siebie kultową już w Poznaniu postać."],"source":"","officelist_url":null},{"slug":"demiurg-poznan-2024","company":"Demiurg","city":"Poznań","year":2024,"designer":"mode:lina","area_m2":400,"building":"Siedziba własna Demiurg","developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2024/10/demiurg-office-4.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/10/demiurg-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/10/demiurg-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2024/10/demiurg-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2024/10/demiurg-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2024/10/demiurg-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2024/10/demiurg-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2024/10/demiurg-office-7.jpg","https://www.officelovin.com/wp-content/uploads/2024/10/demiurg-office-8.jpg","https://www.officelovin.com/wp-content/uploads/2024/10/demiurg-office-9.jpg"],"photographer":"Patryk Lewiński","url":"","industry":"Architecture","award":null,"description_paragraphs":["Poznańska siedziba firmy budowlanej Demiurg, z wnętrzami pracowni mode:lina, eksponuje surową konstrukcję budynku. Tuż obok stoi przedwojenny bunkier, odkryty podczas wykopów pod fundamenty.","Przez wszystkie kondygnacje biegną otwarte stalowe schody zakończone świetlikiem. Betonowe posadzki i stropy zestawiono ze sklejką o kolorowych krawędziach, z której wykonano półki, blaty i zabudowę kuchni. Są też budowlane detale, jak dwuteownik nad kuchnią, kaski nad recepcją czy taczki z roślinami.","Pracownia: <strong>mode:lina<\/strong>. Powierzchnia: 400 m². Branża: budownictwo."],"source":"","officelist_url":null},{"slug":"kws-polska-poznan-2024","company":"KWS Polska","city":"Poznań","year":2024,"designer":"Ktura Architekci (Katarzyna Buczkowska-Grobecka)","area_m2":470,"building":"Giant Office","developer":null,"hero":"https://pliki.propertydesign.pl/i/17/36/25/173625_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/17/36/17/173617_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/36/28/173628_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/36/27/173627_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/36/23/173623_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/36/21/173621_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/36/25/173625_r0_1140.jpg"],"photographer":"FOTOGRAFy","url":"","industry":"Agriculture","award":null,"description_paragraphs":["Firma z sektora rolniczego KWS Polska zajmuje biuro o powierzchni 470 mkw. w poznańskim biurowcu Giant Office. Za projektem wnętrz nowego biura stoi architekt Katarzyna Buczkowska-Grobecka z pracowni Ktura Architekci.","Jak podkreśla autorka projektu, priorytetem przy projektowaniu była możliwie maksymalna ergonomia. Architekt udało się ją osiągnąć poprzez czytelne strefowanie przestrzeni oraz wyposażenie, które zachęca do większego ruchu i mniej siedzącego trybu pracy.","Do dyspozycji pracowników jest przestrzeń do pracy w średnim i wysokim skupieniu, a także pomieszczenia sprzyjające zarówno wyciszeniu, jak i spotkaniom w większym gronie. Istotnym elementem aranżacji wnętrz jest kolor, w tym bogato zastosowana zieleń."],"source":"","officelist_url":"https://www.officelist.pl/oferta/giant-office"},{"slug":"mckinsey-poznan-2024","company":"McKinsey","city":"Poznań","year":2024,"designer":"Trzop Architekci","area_m2":8600,"building":null,"developer":null,"hero":"https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-1-1200x675-compact.jpg","gallery":["https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-1-1200x675-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-4-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-8-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-12-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-6-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-5-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-7-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-3-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-10-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-11-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-2-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/09/mckinsey--amp--company-offices-poznan-9-1200x800-compact.jpg"],"photographer":"Fotomohito","url":"","industry":null,"award":null,"description_paragraphs":["Biuro McKinsey zajmuje pięć najwyższych pięter nowego budynku w kompleksie Nowy Rynek w Poznaniu. Projekt Trzop Architekci oparto na biofilii, a wnętrza spełniają wymagania certyfikatów LEED i WELL.","Każde piętro ma własny motyw i kolorystykę: rafę koralową, plażę, łąkę, dżunglę albo las. Tematy wybrano razem z pracownikami, myśląc też o osobach neuroatypowych. Kondygnacje łączą wewnętrzne schody, a recepcję utrzymano w czerni i beżu, z drewnem i złotymi akcentami.","Pracownia: <strong>Trzop Architekci<\/strong>. Powierzchnia: 8 600 m². Branża: doradztwo."],"source":"","officelist_url":null},{"slug":"sennheiser-poznan-2024","company":"Sennheiser","city":"Poznań","year":2024,"designer":"mode:lina","area_m2":3900,"building":"Andersia Tower","developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2024/09/senheiser-office-modelina-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/09/senheiser-office-modelina-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/09/senheiser-office-modelina-3.jpg","https://www.officelovin.com/wp-content/uploads/2024/09/senheiser-office-modelina-6.jpg","https://www.officelovin.com/wp-content/uploads/2024/09/senheiser-office-modelina-8.jpg","https://www.officelovin.com/wp-content/uploads/2024/09/senheiser-office-modelina-9.jpg","https://www.officelovin.com/wp-content/uploads/2024/09/senheiser-office-modelina-10.jpg","https://www.officelovin.com/wp-content/uploads/2024/09/senheiser-office-modelina-11.jpg","https://www.officelovin.com/wp-content/uploads/2024/09/senheiser-office-modelina-12.jpg","https://www.officelovin.com/wp-content/uploads/2024/09/senheiser-office-modelina-13.jpg"],"photographer":"Patryk Lewiński","url":"","industry":"Technology","award":null,"description_paragraphs":["Poznańskie biuro Sennheisera w Andersia Tower zaprojektowała pracownia mode:lina. Równy układ stanowisk, przeplatanych częściami wspólnymi, odpowiada pracy w metodykach zwinnych.","Recepcja łączy marki Sennheiser i Neumann Berlin, a obok sal o nazwach gatunków muzycznych jest duża strefa wspólna z drewnianą trybuną i widokiem na Poznań. Studyjne panele akustyczne zastosowano w budkach, salach i nad audytorium, a płytki w kuchni nawiązują do kształtu dyfuzorów dźwięku.","Pracownia: <strong>mode:lina<\/strong>. Budynek: <strong>Andersia Tower<\/strong>. Powierzchnia: 3 900 m². Branża: sprzęt audio."],"source":"","officelist_url":"https://www.officelist.pl/oferta/andersia-tower"},{"slug":"volkswagen-poznan-2024","company":"Volkswagen","city":"Poznań","year":2024,"designer":"mode:lina","area_m2":500,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2024/11/volkgswagen-office-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/11/volkgswagen-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/11/volkgswagen-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2024/11/volkgswagen-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2024/11/volkgswagen-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2024/11/volkgswagen-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2024/11/volkgswagen-office-7.jpg","https://www.officelovin.com/wp-content/uploads/2024/11/volkgswagen-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2024/11/volkgswagen-office-10.jpg","https://www.officelovin.com/wp-content/uploads/2024/11/volkgswagen-office-11.jpg","https://www.officelovin.com/wp-content/uploads/2024/11/volkgswagen-office-12.jpg"],"photographer":"Patryk Lewiński","url":"","industry":"Transportation","award":null,"description_paragraphs":["Pracownia mode:lina zaprojektowała poznańskie biuro Volkswagena jako ciąg mniejszych „domów” o elewacjach przypominających współczesne budynki modernistyczne.","Pracownicy nie chcieli wracać do dużego open space, ale nie chcieli też zamykać się w zespołach, więc wnętrze zachowało otwarty charakter. W „elewacjach” domów ukryto dużo schowków, a materiały nawiązują do salonu Volkswagen Home w Warszawie.","Pracownia: <strong>mode:lina<\/strong>. Powierzchnia: 500 m². Branża: motoryzacja."],"source":"","officelist_url":null},{"slug":"amadeus-warszawa-2024","company":"AMADEUS","city":"Warszawa","year":2024,"designer":"HUKK.studio","area_m2":null,"building":null,"developer":null,"hero":null,"gallery":null,"photographer":null,"url":"","industry":"IT / travel-tech","award":null,"description_paragraphs":["Biuro polskiego oddziału Amadeus IT Group - globalnego dostawcy technologii dla turystyki.","Pracownia: <strong>HUKK.studio<\/strong>.","Branża najemcy: IT / travel-tech."],"source":"","officelist_url":null},{"slug":"bat-dbs-poland-wow-hub-warszawa-2024","company":"BAT DBS Poland (WOW!Hub)","city":"Warszawa","year":2024,"designer":"The Design Group","area_m2":4000,"building":"P180 (Górny Mokotów)","developer":"Skanska","hero":"https://pliki.propertydesign.pl/i/17/49/72/174972_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/17/49/70/174970_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/49/69/174969_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/49/65/174965_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/49/64/174964_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/49/63/174963_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/49/72/174972_r0_1140.jpg"],"photographer":"mat. prasowe","url":"","industry":"FMCG / Tobacco","award":null,"description_paragraphs":["Pracownia The Design Group zaprojektowała nową siedzibę BAT DBS Poland (WOW!Hub). Biuro jest usytuowane na Górnym Mokotowie w zaprojektowanym w oparciu o filozofię zrównoważonego rozwoju i zdrowego środowiska pracy budynku P180. Biuro zajmuje dwa piętra o powierzchni ponad 4 000 mkw. W projekcie biura WOW!Hub zrezygnowano z przypisywania stałych miejsc pracy.","Całe biuro zaprojektowane zostało w taki sposób, aby zachować równowagę pomiędzy tzw. strefami skupienia, w których pracownicy mogą się zanurzyć w pracy indywidualnej oraz tymi, w których jest miejsce dla interakcji zespołów. To biuro to harmonijne połączenie klasyki i nowoczesności, funkcjonalności i estetyki, które tworzą neuroróżnorodne środowisko sprzyjające kreatywności i współpracy.","Projekt wnętrza WOW!Hub emanuje ponadczasową wysokiej jakości klasyką. Przytulności dodaje nieprzypadkowy wybór barwy światła o ciepłej temperaturze 3000 K. W biurze BAT DBS szczególną rolę przypisuje się także zieleni - duża ilość roślin, zarówno w otwartych przestrzeniach, jak i w specjalnie zaprojektowanym jungle room."],"source":"","officelist_url":"https://www.officelist.pl/oferta/p180"},{"slug":"bouygues-immobilier-polska-warszawa-2024","company":"Bouygues Immobilier Polska","city":"Warszawa","year":2024,"designer":"Bit Creative","area_m2":1300,"building":"Rondo 1, Rondo ONZ, Warszawa (24 piętro)","developer":null,"hero":"https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-6.jpg","gallery":["https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-6.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-23.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-22.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-19.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-18.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-17.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-16.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-13.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-11.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-10.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-7.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-3.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-1.jpg"],"photographer":"Fotomohito","url":"","industry":"deweloper","award":null,"description_paragraphs":["W sercu Warszawy, w prestiżowym biurowcu Rondo 1 przy Rondzie ONZ, znajduje się siedziba Bouygues Immobilier Polska - lidera francuskiego rynku nieruchomości. Biuro o powierzchni ponad 1300 m² to nie tylko nowoczesne miejsce pracy, ale także manifest podejścia, w którym ekologia i zrównoważony rozwój odgrywają kluczową rolę. Za koncepcję odpowiadają architekci BIT CREATIVE pod kierownictwem Barnaby Grzeleckiego, którzy połączyli wartości marki w ergonomiczną przestrzeń. Projekt został dopasowany do identyfikacji wizualnej - flagowe odcienie niebieskiego i szarości wpleciono w wystrój. W całej przestrzeni zastosowano zrównoważone materiały z recyklingu o minimalnym śladzie węglowym oraz meble z upcyklingu. Wszechobecne rośliny doniczkowe i żywe ściany zieleni poprawiają jakość powietrza i samopoczucie. Wnętrze podzielono na strefy: reprezentacyjną recepcję, przestrzenie do pracy indywidualnej i zespołowej, sale konferencyjne z multimediami, kameralne salki spotkań oraz strefę socjalną z komfortową kuchnią i strefą relaksu. Zastosowano oświetlenie LED i systemy inteligentnego zarządzania budynkiem."],"source":"","officelist_url":"https://www.officelist.pl/oferta/rondo-1"},{"slug":"business-link-warszawa-2024","company":"Business Link","city":"Warszawa","year":2024,"designer":"Trzop Architekci","area_m2":null,"building":null,"developer":null,"hero":"https://www.trzoparchitekci.pl/storage/2025/01/B-HD-16-9.jpg","gallery":null,"photographer":null,"url":"","industry":"coworking","award":null,"description_paragraphs":["Kolejne przestrzenie coworkingowe sieci Business Link projektowane przez Trzop Architekci w Warszawie.","Pracownia: <strong>Trzop Architekci<\/strong>.","Branża najemcy: coworking."],"source":"","officelist_url":null},{"slug":"citi-handlowy-warszawa-2024","company":"Citi Handlowy","city":"Warszawa","year":2024,"designer":"SAAN Architekci","area_m2":null,"building":null,"developer":null,"hero":"https://officesnapshots.com/wp-content/uploads/2025/02/citi-handlowy-offices-warsaw-9-1200x800-compact.jpg","gallery":["https://officesnapshots.com/wp-content/uploads/2025/02/citi-handlowy-offices-warsaw-5-700x467-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/02/citi-handlowy-offices-warsaw-3-700x467-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/02/citi-handlowy-offices-war wp-content/uploads/2024/07/coca-cola-warsaw-office-13.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/coca-cola-warsaw-office-14.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/coca-cola-warsaw-office-11.jpg"],"photographer":"Fotomohito","url":"","industry":null,"award":null,"description_paragraphs":["Warszawska centrala Coca-Cola HBC zajmuje trzy piętra. BIT Creative użyło produktów firmy jako elementów wystroju, od lady recepcji w kształcie fali z wbudowanymi butelkami po ściany z kapsli.","Stanowiska pogrupowano maksymalnie po 12 osób i oddzielono wysokimi przegrodami. Sale konferencyjne urządzono według napojów z portfolio: w sali Monster stół zespawano z dwóch silników, a w Adez podwieszono go do sufitu. Pracownicy mają też huśtawki, budki w formie domków i kontenerów oraz taras.","Pracownia: <strong>BIT Creative<\/strong>. Powierzchnia: 5 500 m²."],"source":"","officelist_url":null},{"slug":"coface-warszawa-2024","company":"Coface","city":"Warszawa","year":2024,"designer":"Brookfield Partners","area_m2":4830,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2024/07/coface-warsaw-office-18.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/07/coface-warsaw-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/coface-warsaw-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/coface-warsaw-office-18.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/coface-warsaw-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/coface-warsaw-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/coface-warsaw-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/coface-warsaw-office-10.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/coface-warsaw-office-12-2.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/coface-warsaw-office-15.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/coface-warsaw-office-22.jpg"],"photographer":null,"url":"","industry":"Finance / Insurance","award":null,"description_paragraphs":["Warszawskie biuro ubezpieczyciela Coface łączy oszczędny wystrój z industrialnymi akcentami, takimi jak odsłonięte stropy.","Wykładzina przechodzi od zieleni do odcieni drewna, a szklane ściany wpuszczają światło do pomieszczeń. Kuchnia z jadalnią ma żywe kolory, a w biurze jest pokój dla dzieci, do którego pracownicy mogą je przyprowadzić. W sali konferencyjnej stoi drewniany stół w kształcie litery O.","Pracownia: <strong>Brookfield Partners<\/strong>. Powierzchnia: 4 830 m². Branża: ubezpieczenia."],"source":"","officelist_url":null},{"slug":"decerto-warszawa-2024","company":"Decerto","city":"Warszawa","year":2024,"designer":"BIT CREATIVE","area_m2":2137,"building":"Złote Tarasy (widok na kopułę)","developer":"Globalworth Poland","hero":"https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-7.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-14.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-16.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-17.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-21.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-23.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-24.jpg"],"photographer":"Fotomohito","url":"","industry":"Finance / Insurance","award":null,"description_paragraphs":["Biuro Decerto w Warszawie, z widokiem na kopułę Złotych Tarasów, zaprojektowało BIT Creative. Głównym motywem jest miedź zestawiona z szarym betonem.","Lada recepcji ma formę rzeźby ze stali corten i stalowej siatki, a ściany poczekalni pokrywa zieleń. Biuro ma dwie sale konferencyjne na 22 i 10 osób, sześć gabinetów zarządu i pięć pokoi do pracy zespołowej. Pokój socjalny o powierzchni 120 m² urządzono w klubowym stylu, z dużym stołem z litego drewna, bilardem i automatem do gier.","Pracownia: <strong>BIT Creative<\/strong>. Powierzchnia: 2 137 m². Branża: ubezpieczenia."],"source":"","officelist_url":"https://www.officelist.pl/oferta/lumen"},{"slug":"ewl-warszawa-2024","company":"EWL","city":"Warszawa","year":2024,"designer":"Brookfield Partners","area_m2":836,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2024/08/ewl-warsaw-office-9.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/08/ewl-warsaw-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2024/08/ewl-warsaw-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2024/08/ewl-warsaw-office-10.jpg","https://www.officelovin.com/wp-content/uploads/2024/08/ewl-warsaw-office-11.jpg","https://www.officelovin.com/wp-content/uploads/2024/08/ewl-warsaw-office-14.jpg","https://www.officelovin.com/wp-content/uploads/2024/08/ewl-warsaw-office-15.jpg","https://www.officelovin.com/wp-content/uploads/2024/08/ewl-warsaw-office-17.jpg","https://www.officelovin.com/wp-content/uploads/2024/08/ewl-warsaw-office-18.jpg","https://www.officelovin.com/wp-content/uploads/2024/08/ewl-warsaw-office-19.jpg"],"photographer":null,"url":"","industry":"HR","award":null,"description_paragraphs":["Warszawskie biuro agencji zatrudnienia EWL zaprojektowało Brookfield Partners. Ciemna, zaokrąglona lada recepcji kontrastuje z jasnymi ścianami i posadzką.","Obok recepcji jest strefa socjalna z długim drewnianym stołem, pomarańczowymi krzesłami i roślinami zawieszonymi nad blatem. W części do pracy szklane ściany oddzielają pomieszczenia, a środek zajmuje strefa coworkingowa z wysokimi stołami otoczonymi zielenią.","Pracownia: <strong>Brookfield Partners<\/strong>. Powierzchnia: 836 m². Branża: rynek pracy."],"source":"","officelist_url":null},{"slug":"fujifilm-warszawa-2024","company":"Fujifilm","city":"Warszawa","year":2024,"designer":"The Design Group","area_m2":null,"building":"The Park Warsaw","developer":"White Star Real Estate","hero":"https://pliki.propertydesign.pl/i/17/72/70/177270_1140.jpg","gallery":null,"photographer":"mat. prasowe","url":"","industry":"Imaging / Tech","award":null,"description_paragraphs":["Projekt wnętrz siedziby firmy Fujifilm w Warszawie stworzył zespół architektów The Design Group. Wnętrza biura, zdominowane przez styl japandi, emanują harmonią, zapewniając pracownikom inspirujące miejsce do pracy. Projekt odzwierciedla długoletnią historię i korzenie firmy, ale także integruje je z dynamicznym kontekstem nowoczesnego otoczenia.","Ze względu na fakt, że biurowiec The Park Warsaw sąsiaduje z lotniskiem, obowiązują tu rygorystyczne przepisy przeciwpożarowe, które mają znaczący wpływ na projektowanie wnętrz. Wymagania te obejmują m.in. konieczność korzystania wyłącznie z materiałów posiadających odpowiednie certyfikaty, spełniających wskazane normy i najwyższe standardy bezpieczeństwa. To z kolei prowadzi do ograniczenia wyboru dostępnych na rynku materiałów. Architekci z The Design Group stanęli zatem przed wyzwaniem wymagającym kreatywności i staranności w każdym szczególe."],"source":"","officelist_url":"https://www.officelist.pl/park-biurowy/the-park-warsaw"},{"slug":"good-morning-studio-dzien-dobry-tvn-warszawa-2024","company":"Good Morning Studio (Dzień Dobry TVN)","city":"Warszawa","year":2024,"designer":"Sikora Interiors","area_m2":350,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-8.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-10.jpg"],"photographer":"Tom Kurek","url":"","industry":"Film / TV","award":null,"description_paragraphs":["Studio programu Dzień Dobry TVN w Warszawie przeszło pełną przebudowę według projektu Sikora Interiors. Powstało jasne, loftowe wnętrze z nowym układem funkcjonalnym.","Studio podzielono na strefy, m.in. kącik informacyjny, kuchnię z zaokrągloną wyspą, część rozmów z dwiema łukowymi sofami, scenę dla artystów i oddzieloną akustycznie charakteryzatornię. Prawie wszystko jest mobilne, łącznie ze sceną i żółtym stołem z regulacją wysokości, więc wnętrze można przearanżować w dziesięć minut.","Pracownia: <strong>Sikora Interiors<\/strong>. Powierzchnia: 350 m². Branża: telewizja."],"source":"","officelist_url":null},{"slug":"hilti-polska-warszawa-2024","company":"Hilti Polska","city":"Warszawa","year":2024,"designer":"AKA Studio","area_m2":null,"building":"Royal Wilanów","developer":"Capital Park","hero":"https://pliki.propertydesign.pl/i/17/85/02/178502_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/17/85/04/178504_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/85/03/178503_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/85/01/178501_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/84/98/178498_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/85/02/178502_r0_1140.jpg"],"photographer":"Celestyna Król","url":"","industry":"Construction tech","award":null,"description_paragraphs":["Nowe biuro Hilti Polska zostało zaprojektowane jako otwarta przestrzeń, w której zastosowano ciekawy zabieg aranżacyjny, symbolicznie dzielący ją na dwie równoległe części. Efekt ten uzyskano dzięki przeniesieniu nieregularnego kształtu budynku na część sufitu i podłogi.","Sufit wraz z instalacjami, w otwartej jego części pomalowano w odcieniu antracytowym, zaczerpniętym z brandbooka. Natomiast biały sufit pełny, okala budynek od strony elewacji. Aby zaakcentować części wspólne np. strefę kawiarni czy recepcję, przełamano ten układ wprowadzając inne materiały na sufitach i podłogach.","Za projektem stoi pracownia AKA Studio. Wspólne przestrzenie do pracy zostały przedzielone miejscami na szybkie spotkania, gdzie znajdziemy m.in. siedzisko w kształcie okręgu. Tapicerowane na żółto, z dobranym kolorystycznie dywanem i stolikiem, stanowi kontrapunkt dla spokojnych szarości. Prywatność akustyczną zapewniają salki spotkań."],"source":"","officelist_url":"https://www.officelist.pl/oferta/royal-wilanow"},{"slug":"hoogwegt-warszawa-2024","company":"Hoogwegt","city":"Warszawa","year":2024,"designer":"BIT Creative","area_m2":767,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-8.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-10.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-13.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-16.jpg","h _1140.jpg","https://pliki.propertydesign.pl/i/17/37/57/173757_r0_1140.jpg"],"photographer":"fotomohito","url":"","industry":"Data analytics / IT","award":null,"description_paragraphs":["Architekci z pracowni projektowej Bit Creative stworzyli projekt funkcjonalnej i nietuzinkowej przestrzeni nowej siedziby Lingaro w Warszawie.","Przestrzeń biurowa nowej siedziby Lingaro w Warszawie to ponad 3000 mkw. na dwóch kondygnacjach. Pierwsza z nich to 1053,20 mkw., na których znajduje się pomieszczenie socjalne z aneksem kuchennym o powierzchni 68 mkw., 7 salek konferencyjnych (10-41 mkw.) oraz wydzielone przestrzenie do pracy typu open space. Druga liczy 2048,22 mkw. i obejmuje pomieszczenie socjalne z aneksem kuchennym o łącznej powierzchni 157,47 mkw., coffee point, game room z aneksem kuchennym (46 mkw.), 17 salek konferencyjnych od 10 do 100 mkw., pokój pracy kreatywnej (30 mkw.), 3 pomieszczenia do pracy indywidualnej oraz strefę chill outu.","Architekci postawili na klarowny, funkcjonalny i sprzyjający zarówno pracy indywidualnej, jak i zespołowej podział przestrzeni. Ideą przewodnią sal konferencyjnych są miasta, w których znajdują się główne oddziały spółki. Sale konferencyjne w strefie recepcji są zaprojektowane w stonowanych barwach, natomiast te dostępne dla pracowników wyróżniają się intensywną kolorystyką. Za najbarwniejszą można uznać salę Mexico City, gdzie na seledynowej ścianie dominuje postać Fridy Khalo."],"source":"","officelist_url":null},{"slug":"mattel-warszawa-2024","company":"Mattel","city":"Warszawa","year":2024,"designer":"BIT CREATIVE","area_m2":650,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-4.jpg","https://www.offi 07/msc-office-warsaw-12.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/msc-office-warsaw-16.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/msc-office-warsaw-17.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/msc-office-warsaw-19.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/msc-office-warsaw-25.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/msc-office-warsaw-21.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/msc-office-warsaw-7.jpg"],"photographer":null,"url":"","industry":"Logistyka","award":null,"description_paragraphs":["Warszawskie biuro armatora Mediterranean Shipping Company zaprojektowało Brookfield Partners. Ciepłe drewno zestawiono tu z surowym sufitem z odsłoniętymi instalacjami.","W recepcji duże logo MSC umieszczono na tle pionowych drewnianych listew, a podłogę ułożono w jodełkę z jasnego drewna. Pomieszczenia oddzielają szklane ściany, w sali konferencyjnej szarości przełamują żółte krzesła, a na ścianie wisi duży obraz statku.","Pracownia: <strong>Brookfield Partners<\/strong>. Powierzchnia: 2 045 m². Branża: logistyka."],"source":"","officelist_url":null},{"slug":"multilife-benefit-systems-warszawa-2024","company":"Multilife (Benefit Systems)","city":"Warszawa","year":2024,"designer":"Concept Space","area_m2":null,"building":null,"developer":null,"hero":"https://pliki.propertydesign.pl/i/19/51/20/195120_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/18/69/81/186981_r0_1140.jpg","https://pliki.propertydesign.pl/i/18/69/79/186979_r0_1140.jpg","https://pliki.propertydesign.pl/i/18/69/78/186978_r0_1140.jpg","https://pliki.propertydesign.pl/i/18/69/76/186976_r0_1140.jpg","https://pliki.propertydesign.pl/i/18/51/20/185120_r0_1140.jpg"],"photographer":"mat. prasowe","url":"","industry":"Benefits / HR-tech","award":null,"description_paragraphs":["Projekt dla działu MultiLife firmy Benefit Systems SA to nowoczesna przestrzeń biurowa łącząca funkcjonalność z inspirującym designem. Projektanci Concept Space stworzyli dwustrefową koncepcję obejmującą otwartą przestrzeń pracy oraz strefę kreatywną - nieformalną i sprzyjającą spontanicznym spotkaniom.","Przestrzeń zachęca do współpracy, pozwalając pracownikom na wybór miejsca najlepiej odpowiadającego ich stylowi pracy. Pastelowe kolory, styl loftowy i wszechobecna zieleń tworzą przyjemną atmosferę.","Sercem biura są profesjonalne studia nagrań i podcastownia, spełniające wysokie wymagania akustyczne i techniczne. Projekt wspiera kreatywność i elastyczność zespołu."],"source":"","officelist_url":null},{"slug":"natek-warszawa-2024","company":"Natek","city":"Warszawa","year":2024,"designer":"Brookfield Partners (doradztwo)","area_m2":520,"building":"Q22 (11. piętro)","developer":"Echo Investment","hero":"https://pliki.propertydesign.pl/i/17/52/18/175218_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/17/52/33/175233_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/52/15/175215_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/52/19/175219_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/52/23/175223_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/52/18/175218_r0_1140.jpg"],"photographer":"mat. prasowe","url":"","industry":"IT outsourcing","award":null,"description_paragraphs":["Na 11. piętrze warszawskiego biurowca Q22 swoją siedzibę ma firma Natek - dostarczyciel kompleksowych usług outsourcingu i specjalistów IT w regionie Europy Środkowo-Wschodniej. Nowoczesna przestrzeń biurowa liczy ponad 520 mkw.","„Najemcy zależało, aby siedziba mieściła się w nowoczesnym budynku w centralnej lokalizacji. Istotnym aspektem było również stworzenie miejsca, w którym pracownicy będą mogli się spełniać w przyjaznym i komfortowym otoczeniu\" - mówi Adriana Binkiewicz, Doradca w Brookfield Partners. „Głównym celem firmy było zwiększenie przestrzeni biurowej, ale również znalezienie miejsca, które będzie sprzyjało rozwojowi.\""],"source":"","officelist_url":"https://www.officelist.pl/oferta/q22"},{"slug":"netcompany-warszawa-2024","company":"Netcompany","city":"Warszawa","year":2024,"designer":"BIT Creative","area_m2":2137,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-4.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-8.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-13.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-20.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-21.jpg"],"photographer":"Fotomohito","url":"","industry":null,"award":null,"description_paragraphs":["Warszawskie biuro Netcompany zaprojektowało BIT Creative w duchu duńskiego hygge. Szarości ociepla drewno, a wnętrze miało zachęcić pracowników do powrotu do biura po pandemii.","Większość powierzchni to otwarte strefy, w których zespoły oddzielają szafki z zielenią i przegrody z paneli akustycznych i listew. Stołówka dla ponad 500 osób pracujących zmianowo zajmuje około jednej szóstej piętra i jest odizolowana akustycznie od reszty biura. Uzupełniają ją mniejsze punkty kawowe z drewnem i blatami we wzór marmuru.","Pracownia: <strong>BIT Creative<\/strong>. Powierzchnia: 2 137 m²."],"source":"","officelist_url":null},{"slug":"orsted-warszawa-2024","company":"Orsted","city":"Warszawa","year":2024,"designer":"Workplace","area_m2":2400,"building":"Varso II","developer":null,"hero":"https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-16-1200x800.jpg","gallery":["https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-16-1200x800.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-7-1200x798.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-5-1200x800.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-2-1200x734.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-24-1200x798-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-1200x734.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-22-1200x798-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-18-1200x812.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-9-1200x798.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-3-1200x798.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-20-798x1200.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-1-798x1200.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-6-1200x798.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-8-1200x798.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-4-1200x798.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-19-1200x798.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-11-1200x806.jpg","https://officesnapshots.com/wp-content/uploads/2024/12/Orsted-offices-warsaw-12-1200x800.jpg"],"photographer":"Zofia Kurczych, Tomasz Czuban, Martyna Rudnicka","url":"","industry":"Energy / Mining / Oil","award":null,"description_paragraphs":["Biuro Ørsted w Varso II przygotowano dla 200 osób na największej kondygnacji budynku. Pracownia Workplace zaprojektowała je zgodnie z firmowymi wytycznymi Love Your Workplace.","Przestrzeń podzielono według potrzeb współpracy, kontaktu i skupienia, bez rozległego open space. Dużą część mebli ruchomych przeniesiono z wcześniejszych projektów lub odnowiono, a materiały wykończeniowe pochodzą z recyklingu albo mają certyfikaty środowiskowe, np. cradle to cradle. To czwarta realizacja Workplace dla tej firmy.","Pracownia: <strong>Workplace<\/strong>. Budynek: <strong>Varso II<\/strong>. Powierzchnia: 2 400 m². Branża: energetyka."],"source":"","officelist_url":"https://www.officelist.pl/oferta/varso-2"},{"slug":"psibufet-warszawa-2024","company":"PsiBufet","city":"Warszawa","year":2024,"designer":"HUKK.studio","area_m2":null,"building":null,"developer":null,"hero":"https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/691e3e0d2146d7e74930f68f_psibufet-studio-hukk-12.jpg","gallery":null,"photographer":null,"url":"","industry":"e-commerce / petfood","award":null,"description_paragraphs":["Siedziba marki świeżej karmy dla psów. Funkcjonalne biuro z otwartą strefą społeczną dostosowaną do obecności zwierząt pracowników.","Pracownia: <strong>HUKK.studio<\/strong>.","Branża najemcy: e-commerce / petfood."],"source":"","officelist_url":null},{"slug":"saint-gobain-warszawa-2024","company":"Saint-Gobain","city":"Warszawa","year":2024,"designer":"Trzop Architekci","area_m2":null,"building":"Varso Tower (28. piętro)","developer":"HB Reavis","hero":"https://pliki.propertydesign.pl/i/19/14/82/191482_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/19/14/58/191458_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/14/55/191455_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/14/54/191454_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/14/61/191461_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/14/82/191482_r0_1140.jpg"],"photographer":"mat. prasowe","url":"","industry":"Building materials","award":null,"description_paragraphs":["Grupa Saint-Gobain przeniosła swoją warszawską centralę do nowoczesnego biura w Varso Tower, tworząc przestrzeń, gdzie technologie i zrównoważony rozwój idą w parze z dbałością o wellbeing pracowników. Nowe biuro na 28. piętrze najwyższego wieżowca w UE stawia na komfort, efektywność i zdrowe środowisko pracy.","Przestrzeń biurowa została zaprojektowana przez pracownię Trzop Architekci, a jej realizację powierzono generalnemu wykonawcy Decorator - Malewicz i Wspólnicy S.K.A. Biuro stanowi unikatowy showroom: ważną wytyczną było to, aby używane w projekcie materiały pochodziły z portfolio grupy Saint Gobain.","Nacisk postawiono na komfort akustyczny. W nowej siedzibie Saint-Gobain zastosowano specjalne panele sufitowe i ścienne, które skutecznie redukują poziom hałasu w pomieszczeniach, minimalizując tzw. echo trzepoczące, co zapewnia spokojne i sprzyjające koncentracji środowisko pracy. W celu utworzenia przestrzeni wolnej od hałasu, równoznacznej z poprawą izolacji akustycznej, posłużono się też systemami ścian działowych."],"source":"","officelist_url":"https://www.officelist.pl/oferta/varso-tower"},{"slug":"sanofi-warszawa-2024","company":"Sanofi","city":"Warszawa","year":2024,"designer":"The Design Group","area_m2":3400,"building":null,"developer":null,"hero":"https://officesnapshots.com/wp-content/uploads/2024/08/sanofi-offices-warsaw-7-1200x800-compact.jpg","gallery":["https://officesnapshots.com/wp-content/uploads/2024/08/sanofi-offices-warsaw-20-700x467-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/08/sanofi-offices-warsaw-19-700x467-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/08/sanofi-offices-warsaw-14-700x467-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/08/sanofi-offices-warsaw-9-700x467-compact.jpg","https://officesnapshots.com/wp-content/uploads/2024/08/sanofi-offices-warsaw-1-700x467-compact.j cztery poziomy: piętro 1 - przestrzeń podwodna, piętro 2 - poziom wody, piętro 3 i 4 - pokłady jednostek morskich. Ciekawą strefą jest 'void zone' - wolna przestrzeń integrująca piętra 2, 3 i 4 połączona przeszkleniem z piętrem 1. Zainstalowano tu złotą instalację z kilku tysięcy szklanych kulek zawieszonych na ~1000 linkach, symbolizującą Subsea Tree (flagowy produkt firmy). Void zone to także symboliczna integracja zespołów ze wszystkich pięter."],"source":"","officelist_url":null},{"slug":"nt-industry-orzesze-2021","company":"NT Industry","city":"Orzesze","year":2021,"designer":"GIGAARCHITEKCI / Artur Garbula","area_m2":1474,"building":"Dawny kompleks ciężkiego przemysłu z 1951 - adaptacja portierni i biurowca","developer":null,"hero":"https://images.adsttc.com/media/images/62c3/53a8/4f02/6109/8c1b/92b8/large_jpg/nt-industry-polish-headquarters-gigaarchitekci-artur-garbula_13.jpg?1656968156","gallery":["https://images.adsttc.com/media/images/62c3/5392/4f02/610f/ca57/ce0e/large_jpg/nt-industry-polish-headquarters-gigaarchitekci-artur-garbula_19.jpg?1656968134","https://images.adsttc.com/media/images/62c3/538d/4f02/6109/8c1b/92ae/large_jpg/nt-industry-polish-headquarters-gigaarchitekci-artur-garbula_2.jpg?1656968121","https://images.adsttc.com/media/images/62c3/5398/1395/5c1b/902d/843b/large_jpg/nt-industry-polish-headquarters-gigaarchitekci-artur-garbula_5.jpg?1656968193","https://images.adsttc.com/media/images/62c3/53ad/4f02/6101/66c2/0223/large_jpg/nt-industry-polish-headquarters-gigaarchitekci-artur-garbula_34.jpg?1656968210","https://images.adsttc.com/media/images/62c3/53a1/4f02/6109/8c1b/92b4/large_jpg/nt-industry-polish-headquarters-gigaarchitekci-artur-garbula_11.jpg?1656968151","https://images.adsttc.com/media/images/62c3/5389/1395/5c15/183a/8b2d/large_jpg/nt-industry-polish-headquarters-gigaarchitekci-artur-garbula_12.jpg?1656968122","https://images.adsttc.com/media/images/62c3/53b1/4f02/6101/66c2/0225/large_jpg/nt-industry-polish-headquarters-gigaarchite cią o akustykę i ekologię. Większość przestrzeni stanowi open space; działy oddzielają zabudowy meblowe z zielenią. 25 salek o różnych wielkościach, w tym cztery 8-osobowe łączone w jedną dużą, oraz 8 wbudowanych phone booth. Wyróżnia się 'akwarium' - przeszklona z trzech stron sala do pracy cichej, ad hoc, samodzielnej lub zespołowej. Niemal 100% biurek to hot deski (z aplikacją do rezerwacji); w open space lockery i 'clean desk policy'. Sala 'design thinking' z blatem do pisania markerem i ogromnym whiteboardem na ścianie. Kuchnia pełni rolę przestrzeni socjalnej, integracyjnej i all hands: trybuny, zielona ściana, sofy, fotele, duży ekran. Stół do ping-ponga i piłkarzyki w centrum. Kameralna siłownia z dużymi lustrami. Dom-jak klimat: dużo softów, drewnianych elementów, miękkich dywanów, grubych kotar, pastelowych kolorów i roślin. 200 ton laminowanych baffli na sufitach dla akustyki; certyfikowane materiały, naturalne drewno, włoskie lastryko, płytki ceramiczne. Doświetlenie dziennym światłem przez wymianę ścian na przeszklenia."],"source":"","officelist_url":null},{"slug":"mode-lina-poznan-2021","company":"mode:lina","city":"Poznań","year":2021,"designer":"mode:lina","area_m2":null,"building":"Suterena w eleganckim budynku z lat 60.","developer":null,"hero":"https://officesnapshots.com/wp-content/uploads/2021/06/modelina-offices-poznan-1.jpg","gallery":["https://officesnapshots.com/wp-content/uploads/2021/06/modelina-offices-poznan-1-1200x801-compact.jpg","https://officesnapshots.com/wp-content/uploads/2021/06/modelina-offices-poznan-2-1200x801-compact.jpg","https://officesnapshots.com/wp-content/uploads/2021/06/modelina-offices-poznan-3-1200x801-compact.jpg","https://officesnapshots.com/wp-content/uploads/2021/06/modelina-offices-poznan-8-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2021/06/modelina-offices-poznan-4-1200x801-compact.jpg","https://officesnapshots.com/wp-content/uploads/2021/06/modelina-offices-poznan-5-1200x801-compact. 17/04/tetris-db-jll-warszawa-2544-3.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-4.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-5.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-6.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-7.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-8.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-9.jpg"],"photographer":null,"url":"","industry":"nieruchomosci","award":null,"description_paragraphs":["Fit-out nowego biura JLL w Warszawie zrealizowany w pełnym modelu Design+Build. Biuro znajduje się w wieży budynku Warsaw Spire. Autorką projektu wnętrz jest Danuta Barańska, dyrektor kreatywna Tétris. Zadaniem było zaprojektowanie i dostarczenie kreatywnej przestrzeni, która pozytywnie stymuluje użytkowników i tworzy wartość dla firmy. Na każdym piętrze znajduje się od 15 do 20 sal różnej wielkości - od małych pokoi do pracy w skupieniu (jak biblioteka), przez przestrzenie kreatywne, po sale spotkań wewnętrznych. Głównym motywem biura są polskie krajobrazy (las, morze, plaża), surowce naturalne (węgiel, sól, bursztyn), elementy folkloru (polska koronka) oraz wybitni Polacy - m.in. biblioteka Kopernika i sala Marii Skłodowskiej-Curie zdobiona grafikami przedstawiającymi wyposażenie laboratoryjne. Biuro otrzymało pierwszy w Polsce certyfikat BREEAM dla fit-outu przestrzeni biurowej z oceną 'Very Good'."],"source":"","officelist_url":"https://www.officelist.pl/park-biurowy/warsaw-spire"},{"slug":"link4-warszawa-2020","company":"LINK4","city":"Warszawa","year":2020,"designer":"BIT Creative","area_m2":null,"building":null,"developer":null,"hero":"https://officesnapshots.com/wp-content/uploads/2020/02/link4-offices-warsaw-7-1200x800.jpg","gallery":null,"photographer":null,"url":"","industry":null,"award":null,"d ci.com/wp-content/uploads/2023/03/MA318_totalmoney_press-13-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA318_totalmoney_press-16-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA318_totalmoney_press-17-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA318_totalmoney_press-15-1920x1277.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA318_totalmoney_press-22-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA318_totalmoney_press-20-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA318_totalmoney_press-21-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA318_totalmoney_press-25-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA318_totalmoney_press-26-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA318_totalmoney_press-34-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA318_totalmoney_press-31-1920x1282.jpg"],"photographer":"Patryk Lewiński","url":"","industry":"fintech","award":null,"description_paragraphs":["Siła kolorów! Totalmoney.pl to zespół ambitnych analityków finansowych stojących za pierwszą kompleksową porównywarką produktów bankowych w Polsce. Postanawiając współpracować ze studiem mode:lina, chcieli stworzyć nowoczesne biuro we Wrocławiu, w którym energia marki i pracowników gra pierwsze skrzypce. Wrocławskie biuro to nietypowa aranżacja open space w nowej formule - pracownicy poszczególnych działów potrzebowali prywatnych stref, ale równie ważna była swobodna komunikacja. Proste funkcjonalne wybory, kolorowy metaloplastyk dekoracyjny i graficznie wyraziste oznakowania sal stworzyły czytelny i intuicyjny układ biura. Wszystkie kluczowe udogodnienia ulokowano centralnie; goście i pracownicy nawigowani są geometrycznymi kolorowymi grafikami i wyraźnymi budkami telefonicznymi. Tematy sal: ogromny sejf bankowy, charakterystyczne wrocławskie lokalizacje, postaci Monsters - elementy brandingu firmy."],"source":"","officelist_url":null},{"slug":"clariant-lodz-2020","company":"Clariant","city":"Łódź","year":2020,"designer":"The Design Group","area_m2":4317,"building":"Monopolis","developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2020/06/clariant-office-lodz-7.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2020/06/clariant-office-lodz-1.jpg","https://www.officelovin.com/wp-content/uploads/2020/06/clariant-office-lodz-2.jpg","https://www.officelovin.com/wp-content/uploads/2020/06/clariant-office-lodz-5.jpg","https://www.officelovin.com/wp-content/uploads/2020/06/clariant-office-lodz-8.jpg","https://www.officelovin.com/wp-content/uploads/2020/06/clariant-office-lodz-9.jpg","https://www.officelovin.com/wp-content/uploads/2020/06/clariant-office-lodz-11.jpg","https://www.officelovin.com/wp-content/uploads/2020/06/clariant-office-lodz-12.jpg","https://www.officelovin.com/wp-content/uploads/2020/06/clariant-office-lodz-13.jpg","https://www.officelovin.com/wp-content/uploads/2020/06/clariant-office-lodz-16.jpg","https://www.officelovin.com/wp-content/uploads/2020/06/clariant-office-lodz-17.jpg"],"photographer":"Fotomohito","url":"","industry":"chemia","award":null,"description_paragraphs":["To jedyne takie miejsce na mapie Polski, prawdopodobnie unikatowe w skali globalnej, gdzie współczesna architektura łączy się z historycznym, typowo alpejskim stylem. Biuro Clariant zajmuje dwa piętra o łącznej powierzchni ponad 4300 m². Jest przestronne, a przede wszystkim funkcjonalne. Oryginalne żeliwne schody z zachowanymi tłoczeniami prowadzą do siedziby firmy, wciąż przypominając czasy początków Gorzelni Wódek - podkreślają atmosferę miejsca i nadają jej klasę. Architekci The Design Group nie unikali nawiązań do fabrycznej estetyki. Cegła widoczna na wielu ścianach jest oryginalnym fragmentem ponad stuletniego budynku. W wielu miejscach biura ukryto lustra (od wysokości 2,7 m do sufitu, ok. 4 m), tworząc efekt niemal nieskończonej cegły i niesamowitej głębi. Sufit przypominający kolebkę wypełniają reflektory punktowe oraz specjalnie dostosowane systemy akustyczne w postaci wysp i baffli. Realizacja w industrialnym budynku Monopolis dla Shared Services Center Clariant, szwajcarskiego koncernu chemicznego."],"source":"","officelist_url":"https://www.officelist.pl/oferta/monopolis"},{"slug":"monopolis-i-lodz-2020","company":"Monopolis I","city":"Łódź","year":2020,"designer":"Grupa 5 Architekci","area_m2":28500,"building":"Monopolis (Virako)","developer":null,"hero":"https://images.ctfassets.net/jdl3rjzkhc9o/7IJ2SsGzCdwe9AOsRc8Kv6/585f741c515d302d3edc27bfa919fe23/683_Monopolis_I_01.jpg","gallery":["https://images.ctfassets.net/jdl3rjzkhc9o/7IJ2SsGzCdwe9AOsRc8Kv6/585f741c515d302d3edc27bfa919fe23/683_Monopolis_I_01.jpg","https://images.ctfassets.net/jdl3rjzkhc9o/zIeDTlT2jVuz0g6IVCoBk/672f3a123903bc86de9c20467cd1881f/683_Monopolis_I_02.jpg","https://images.ctfassets.net/jdl3rjzkhc9o/5d2HrdngTYha1r0XFf3WlQ/b3f57d1316a8c122ce9ca1e0cfc85671/683_Monopolis_I_03.jpg","https://images.ctfassets.net/jdl3rjzkhc9o/6uCGuftwUwuQk8xo0qurYC/34d4dc6dd657028d34bf618fe9505cab/683_Monopolis_I_04.jpg","https://images.ctfassets.net/jdl3rjzkhc9o/8mCr4C4w3zOzf3HVMjjGs/79cdd46f31c9cb3cf81d198aaeb3c464/683_Monopolis_I_05.JPG","https://images.ctfassets.net/jdl3rjzkhc9o/wBwaVsRQjTlhKMeQgiLYy/3018c0c010546933ca2d0201420c3ece/683_Monopolis_I_06.jpg"],"photographer":null,"url":"","industry":"Real estate / developer (Virako)","award":null,"description_paragraphs":["Rewitalizacja terenów pofabrycznych Polmosu w Łodzi - siedem budynków biurowo-usługowych z zachowanym zabytkowym kominem jako trzonem komunikacyjnym.","Pracownia: <strong>Grupa 5 Architekci<\/strong>. Lokalizacja: <strong>Monopolis (Virako)<\/strong>. Powierzchnia: 28 500 m².","Branża najemcy: Real estate / developer (Virako)."],"source":"","officelist_url":"https://www.officel const slug = (function (s) { return SB_DUP[s] || s; })(params.get('slug') || params.get('id'));

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function fmtM2(m2) {
  if (!m2) return null;
  return m2.toLocaleString('pl-PL').replace(/,/g, ' ') + ' m²';
}

function sourceLabel(source) {
  return {
    'officelovin': 'Officelovin',
    'officesnapshots': 'Office Snapshots',
    'dezeen': 'Dezeen',
    'polish-studios': 'portfolio pracowni',
    'polish-portals': 'PropertyDesign / portal branżowy',
    'existing-db': 'Officelovin / Office Snapshots',
  }[source] || 'publikacja zewnętrzna';
}

function citySlug(city) {
  return {
    'Warszawa': 'WAW', 'Wrocław': 'WRO', 'Kraków': 'KRK',
    'Poznań': 'POZ', 'Gdańsk': 'GDN', 'Łódź': 'LDZ',
    'Gdynia': 'GDY', 'Katowice': 'KAT', 'Piaseczno': 'PSC',
    'Toruń': 'TOR', 'Lublin': 'LUB', 'Sopot': 'SOP'
  }[city] || city.slice(0, 3).toUpperCase();
}


// Build descriptive alt text for AI image indexing (Wave 5 - Image SEO)
function buildAlt(p, kadr) {
  const parts = [`Biuro ${p.company}`];
  if (p.building) parts.push(`w budynku ${p.building}`);
  else if (p.city) parts.push(`w ${p.city}`);
  if (p.designer) parts.push(`projekt ${p.designer}`);
  if (p.year) parts.push(`rok ${p.year}`);
  if (p.photographer) parts.push(`fot. ${p.photographer}`);
  if (kadr) parts.push(`kadr ${kadr}`);
  return parts.join(', ');
}



function buildTags(p){
  const tags = [];
  if (p._industry_norm && p._industry_norm !== 'Inne' && p._industry_norm !== '?') {
    tags.push({label: p._industry_norm, type:'sector'});
  }
  if (p.city) tags.push({label: p.city, type:'city'});
  if (p.year) tags.push({label: String(p.year), type:'year'});
  if (p.area_m2) tags.push({label: (Math.round(p.area_m2/1)).toLocaleString('pl-PL') + ' m²', type:'area'});
  if (p.designer) tags.push({label: p.designer, type:'studio'});
  if (p.building) tags.push({label: p.building, type:'building', href: p.officelist_url || null});
  return tags.map(t => {
    if (t.href) {
      return `<a class="proj-tag proj-tag-building" href="${esc(t.href)}" target="_blank" rel="noopener" title="Zobacz biurowiec ${esc(t.label)} na officelist.pl"><span class="dot"></span>${esc(t.label)}<span class="proj-tag-ol">officelist.pl ↗</span></a>`;
    }
    return `<span class="proj-tag"><span class="dot"></span>${esc(t.label)}</span>`;
  }).join('');
}
