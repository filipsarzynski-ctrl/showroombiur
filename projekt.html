function buildCreditsExpanded(p){
  const credits = [];
  if (p.designer) credits.push({label:'Pracownia', value: p.designer, link: `pracownia.html?slug=${p.designer.toLowerCase().replace(/[^a-z0-9]+/g,'-')}`});
  if (p.photographer) credits.push({label:'Fotografia', value: p.photographer});
  if (p.developer) credits.push({label:'Inwestor', value: p.developer});
  if (p.building) credits.push({label:'Budynek', value: p.building, href: p.officelist_url || null, hrefTarget:'_blank'});
  if (p.year) credits.push({label:'Rok realizacji', value: p.year});
  if (p.city) credits.push({label:'Lokalizacja', value: p.city});
  if (p._industry_norm && p._industry_norm !== 'Inne' && p._industry_norm !== '?') credits.push({label:'Sektor', value: p._industry_norm});
  if (p.area_m2) credits.push({label:'Powierzchnia', value: `${Math.round(p.area_m2).toLocaleString('pl-PL')} m²`});
  if (p.award) credits.push({label:'Nagroda', value: p.award});

  if (!credits.length) return '';
  return `
    <div class="proj-credits-expanded">
      <div class="proj-credits-head">Dane projektu</div>
      <div class="proj-credits-grid">
        ${credits.map(c => `
          <div class="proj-credit-item">
            <div class="label">${esc(c.label)}</div>
            <div class="value">${c.href ? `<a href="${esc(c.href)}" target="${c.hrefTarget || '_self'}" rel="noopener" style="border-bottom:1px solid var(--accent);">${esc(c.value)} ${c.hrefTarget==='_blank'?'<span style=\"font-family:JetBrains Mono;font-size:10px;letter-spacing:0.12em;color:var(--accent);margin-left:8px;\">officelist.pl ↗</span>':''}</a>` : (c.link ? `<a href="${c.link}" style="border-bottom:1px solid var(--accent);">${esc(c.value)}</a>` : esc(c.value))}</div>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function pickRelated(p, allProjects) {
  const others = allProjects.filter(x => x.slug !== p.slug);
  const scored = others.map(x => {
    let score = 0;
    if (x.designer && p.designer && x.designer === p.designer) score += 12;
    if (x.building && p.building && x.building === p.building) score += 10;
    if (x._industry_norm && p._industry_norm && x._industry_norm === p._industry_norm) score += 6;
    if (x.city && p.city && x.city === p.city) score += 3;
    if (x.hero) score += 2;
    if (x.year && p.year && Math.abs(parseInt(x.year) - parseInt(p.year)) <= 1) score += 2;
    return {x, score};
  });
  scored.sort((a,b) => b.score - a.score);
  return scored.slice(0, 4).filter(r => r.score > 0).map(r => r.x);
}

function renderRelated(p, allProjects) {
  const related = pickRelated(p, allProjects);
  if (!related.length) return '';
  const reason = (rp) => {
    if (rp.designer === p.designer) return `Ta sama pracownia · ${rp.designer || ''}`;
    if (rp.building && rp.building === p.building) return `Ten sam budynek · ${rp.building}`;
    if (rp._industry_norm === p._industry_norm) return `Sektor · ${rp._industry_norm || ''}`;
    if (rp.city === p.city) return `Miasto · ${rp.city}`;
    return rp.city || '';
  };
  return `
    <section class="related-section">
      <div class="related-wrap">
        <div class="related-head">
          <div>
            <div class="related-eyebrow">Powiązane</div>
            <h2>Jeśli to Cię <em>zainteresowało</em>.</h2>
          </div>
        </div>
        <div class="related-grid">
          ${related.map(rp => `
            <a class="related-card" href="projekt.html?slug=${esc(rp.slug)}">
              <div class="related-photo">
                ${rp.hero ? `<img src="${esc(rp.hero)}" loading="lazy" alt="${esc(rp.company)} - ${esc(rp.city || '')}">` : ''}
                <span class="related-tag">${esc(reason(rp))}</span>
              </div>
              <div class="related-body">
                <h4>${esc(rp.company)}</h4>
                <div class="related-meta">${esc(rp.city || '')}${rp.year ? ' · ' + rp.year : ''}${rp.designer ? ' · ' + esc(rp.designer).substring(0,28) : ''}</div>
              </div>
            </a>
          `).join('')}
        </div>
      </div>
    </section>
  `;
}

function buildEditorNote(p) {
  const n = (window.SB_NOTES || {})[p.slug];
  if (!n || !n.tekst) return '';
  let when = '';
  if (n.data && /^\d{4}-\d{2}/.test(n.data)) { const [y, m] = n.data.split('-'); when = ' · ' + ['styczeń','luty','marzec','kwiecień','maj','czerwiec','lipiec','sierpień','wrzesień','październik','listopad','grudzień'][+m - 1] + ' ' + y; }
  const body = String(n.tekst).split(/\n\s*\n/).map(t => `<p>${esc(t.trim())}</p>`).join('');
  return `
    <aside class="editor-note" aria-label="Nota redakcji">
      <div class="en-label">Nota redakcji</div>
      ${body}
      <div class="en-sign">${esc(n.autor || 'Redakcja')}${when}</div>
    </aside>`;
}

function render(p, allProjects, idx) {
  const code = citySlug(p.city);
  const prev = allProjects[idx - 1];
  const next = allProjects[idx + 1];
  const heroBg = p.hero ? `style="background-image:url('${esc(p.hero)}')"` : '';
  const heroImg = p.hero ? '' :
    `<div class="hero-placeholder">
       <div class="ph-no">Nr ${String(idx+1).padStart(3,'0')}</div>
       <div class="ph-city">${esc(p.city)}</div>
       <div class="ph-year">${p.year || ''}</div>
     </div>`;

  // Hero meta
  const metaRows = [];
  if (p.year) metaRows.push(['Rok', p.year]);
  if (p.city) metaRows.push(['Miasto', p.city]);
  if (p.designer) metaRows.push(['Pracownia', p.designer]);
  if (p.area_m2) metaRows.push(['Powierzchnia', fmtM2(p.area_m2)]);
  if (p.building) metaRows.push(['Budynek', p.building]);
  if (p.industry) metaRows.push(['Branża', p.industry]);

  const metaHtml = metaRows.map(([k,v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('');

  // Description
  const paras = (p.description_paragraphs || []).map(t => `<p>${t}</p>`).join('');

  // Gallery - render ALL images, but hide beyond first 8 behind "show more"
  const galleryImages = (p.gallery && p.gallery.length >= 2) ? p.gallery : [];
  const SHOWN_BY_DEFAULT = 8;
  const hasMore = galleryImages.length > SHOWN_BY_DEFAULT;
  const gallery = galleryImages.length ? `
    <section class="gallery-section">
      <div class="gallery-head">
        <h2>Galeria <em>projektu</em></h2>
        <div class="meta">${galleryImages.length} kadrów ${p.photographer ? '- foto ' + esc(p.photographer) : ''}<br><span style="color:var(--muted-soft);font-size:10px;">Kliknij zdjęcie, aby otworzyć karuzelę</span></div>
      </div>
      <div class="gallery-grid" id="galleryGrid">
        ${galleryImages.map((url, i) =>
          `<div class="gallery-item${i >= SHOWN_BY_DEFAULT ? ' hidden' : ''}" data-idx="${i}"><img src="${esc(url)}" loading="lazy" decoding="async" alt="${esc(buildAlt(p, i+1))}"></div>`
        ).join('')}
      </div>
      ${hasMore ? `<button class="gallery-toggle" id="galleryToggle" data-shown="${SHOWN_BY_DEFAULT}">Pokaż wszystkie ${galleryImages.length} kadrów ↓</button>` : ''}
    </section>
  ` : '';

  // Info sidebar
  const infoBlocks = [];
  if (p.designer) {
    infoBlocks.push(`
      <div class="info-block">
        <h3>Architektura</h3>
        <p>${esc(p.designer)}</p>
        ${p.photographer ? `<div class="small">Fotografia: ${esc(p.photographer)}</div>` : ''}
      </div>`);
  }
  if (p.building) {
    infoBlocks.push(`
      <div class="info-block">
        <h3>Lokalizacja</h3>
        <p>${esc(p.building)}<br><em>${esc(p.city)}</em></p>
        ${p.developer ? `<div class="small">Deweloper: ${esc(p.developer)}</div>` : ''}
        ${p.officelist_url ? `<a class="officelist-link" href="${esc(p.officelist_url)}" target="_blank" rel="noopener" data-cursor="hover">
          <span class="ol-arrow">→</span>
          <span class="ol-text">Sprawdź biurowiec <em>w&nbsp;Officelist</em></span>
        </a>` : ''}
      </div>`);
  }

  // Title styled
  const coParts = p.company.split(' ');
  let titleHtml;
  if (coParts.length > 1) {
    titleHtml = `${esc(coParts[0])}<br><em>${esc(coParts.slice(1).join(' '))}</em>`;
  } else {
    titleHtml = esc(p.company);
  }

  return `
    <article class="project-page">
      <section class="hero">
        <div class="hero-image" ${heroBg}>
          ${heroImg}
        </div>
        <div class="hero-content">
          <div class="hero-eyebrow">
            Nr ${String(idx+1).padStart(3,'0')} <span class="accent">·</span> PL · ${code} · ${p.year || '-'}
          </div>
          <h1 class="hero-title">${titleHtml}</h1>
          ${p.description_paragraphs && p.description_paragraphs[0] ?
            `<p class="hero-tagline">${p.description_paragraphs[0].replace(/<[^>]+>/g,'')}</p>` : ''}
          <dl class="hero-meta">${metaHtml}</dl>
          <div class="proj-tags">${buildTags(p)}</div>
        </div>
      </section>

      <section class="body">
        <div class="body-chapter">Nr ${String(idx+1).padStart(3,'0')} - Opis projektu</div>
        <h2 class="body-h">${esc(p.company)} <em>${esc(p.city)}</em>${p.year ? `, <em>${p.year}</em>` : ''}.</h2>
        ${paras}
        ${buildEditorNote(p)}
      </section>

      ${gallery}

      ${infoBlocks.length ? `
        <section class="info-section">
          <div class="info-wrap">${infoBlocks.join('')}</div>
        </section>` : ''}

      ${buildShareButtons(p)}

      ${buildCreditsExpanded(p)}

      ${renderRelated(p, allProjects)}

      <nav class="footer-nav">
        ${prev ? `<a href="projekt.html?slug=${esc(prev.slug)}">← ${esc(prev.company)}</a>` : '<span></span>'}
        <a href="biurofilia.html">Biura</a>
        ${next ? `<a href="projekt.html?slug=${esc(next.slug)}">${esc(next.company)} →</a>` : '<span></span>'}
      </nav>
    </article>
  `;
}

function notFound() {
  return `
    <section class="notfound">
      <h1>Nie znaleziono.</h1>
      <p>Projekt o identyfikatorze <code>${esc(slug || '')}</code> nie istnieje w bazie.</p>
      <a class="nav-back" href="biurofilia.html">← Wróć do biur</a>
    </section>`;
}


  // Copy-link share button
  document.addEventListener('click', e => {
    const btn = e.target.closest('.proj-share-btn.copy');
    if (!btn) return;
    const url = btn.dataset.url;
    navigator.clipboard.writeText(url).then(() => {
      btn.classList.add('done');
      btn.querySelector('span').textContent = 'Skopiowano ✓';
      setTimeout(() => {
        btn.classList.remove('done');
        btn.querySelector('span').textContent = 'Kopiuj link';
      }, 1800);
    });
  });

function init() {
  const dbScript = document.getElementById('project-db');
  let projects = [];
  try {
    projects = JSON.parse(dbScript.textContent || '[]');
  } catch (e) {}

  // If embedded DB is empty, try loading from external JSON
  if (!projects.length) {
    fetch('_embed_db.json').then(r => r.json()).then(data => {
      mount(data);
    }).catch(() => {
      document.getElementById('root').innerHTML = notFound();
    });
  } else {
    mount(projects);
  }
}

function mount(projects) {
  const idx = projects.findIndex(p => p.slug === slug);
  const root = document.getElementById('root');
  if (idx < 0) {
    root.innerHTML = notFound();
    return;
  }
  const p = projects[idx];
  document.title = `${p.company} - ${p.city} ${p.year || ''} - Showroom Biur`;
  // Dynamic OG/meta update (helps social crawlers that execute JS + improves UX)
  try {
    const setMeta = (sel, attr, val) => {
      let m = document.querySelector(sel);
      if (!m && val) {
        m = document.createElement('meta');
        const parts = sel.match(/\[([^=]+)="([^"]+)"\]/);
        if (parts) m.setAttribute(parts[1], parts[2]);
        document.head.appendChild(m);
      }
      if (m && val) m.setAttribute(attr, val);
    };
    const heroImg = p.hero || (p.gallery && p.gallery[0]) || 'og-default.jpg';
    const desc = (p.description_paragraphs && p.description_paragraphs[0] || p.tagline ||
                 `${p.company} - biuro w ${p.city} (${p.year}). Projekt: ${p.designer || '-'}. ${p.area_m2 ? p.area_m2 + ' m²' : ''}`).substring(0, 200);
    setMeta('meta[property="og:title"]', 'content', `${p.company} - ${p.city} ${p.year || ''}`);
    setMeta('meta[property="og:description"]', 'content', desc);
    setMeta('meta[property="og:image"]', 'content', heroImg);
    setMeta('meta[property="og:url"]', 'content', `https://showroombiur.pl/projekt.html?slug=${p.slug}`);
    setMeta('meta[property="og:type"]', 'content', 'article');
    setMeta('meta[name="twitter:title"]', 'content', `${p.company} - ${p.city}`);
    setMeta('meta[name="twitter:description"]', 'content', desc);
    setMeta('meta[name="twitter:image"]', 'content', heroImg);
    setMeta('meta[name="description"]', 'content', desc);
    setMeta('link[rel="canonical"]', 'href', `https://showroombiur.pl/projekt.html?slug=${p.slug}`);

    // Dynamic JSON-LD Article schema
    const oldLd = document.getElementById('proj-jsonld');
    if (oldLd) oldLd.remove();
    const ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.id = 'proj-jsonld';
    ld.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Article",
      "headline": `${p.company} - biuro w ${p.city} ${p.year || ''}`.trim(),
      "description": desc,
      "image": heroImg,
      "datePublished": p.year ? `${p.year}-01-01` : undefined,
      "author": p.designer ? {"@type":"Organization","name":p.designer} : undefined,
      "publisher": {
        "@type": "Organization",
        "name": "Showroom Biur",
        "logo": {"@type":"ImageObject","url":"https://showroombiur.pl/og-default.jpg"}
      },
      "mainEntityOfPage": `https://showroombiur.pl/projekt.html?slug=${p.slug}`,
      "about": p.industry || p._industry_norm,
      "contentLocation": {"@type":"Place","name":p.city,"addressCountry":"PL"}
    });
    document.head.appendChild(ld);
  } catch (e) { console.warn('OG update failed', e); }
  root.innerHTML = render(p, projects, idx);

  // === Update SEO/AEO dynamic meta + JSON-LD ===
  updateSEO(p);

  // Wire up gallery toggle (show more)
  const toggle = document.getElementById('galleryToggle');
  if (toggle) {
    toggle.addEventListener('click', () => {
      document.querySelectorAll('.gallery-item.hidden').forEach(el => el.classList.remove('hidden'));
      toggle.remove();
    });
  }

  // Wire up lightbox triggers
  if (p.gallery && p.gallery.length) {
    initLightbox(p);
  }
}

// === Dynamic SEO/AEO injection per project ===
function updateSEO(p) {
  const BASE = 'https://showroombiur.pl';
  const url = `${BASE}/projekt.html?id=${p.slug}`;
  const title = `${p.company} - ${p.city} ${p.year || ''} | Polski projekt biurowy`;
  const descParts = [];
  if (p.designer) descParts.push(`Projekt pracowni ${p.designer}`);
  if (p.area_m2) descParts.push(`${p.area_m2.toLocaleString('pl-PL').replace(/,/g, ' ')} m²`);
  if (p.building) descParts.push(`budynek ${p.building}`);
  if (p.year) descParts.push(`rok ${p.year}`);
  const description = `${p.company}, ${p.city}. ${descParts.join(', ')}. Pełna dokumentacja w Showroom Biur.`;
  const image = p.hero || `${BASE}/og-default.jpg`;

  // Update meta tags
  const setMeta = (id, val) => { const el = document.getElementById(id); if (el) el.setAttribute('content', val); };
  document.getElementById('seoCanonical').setAttribute('href', url);
  setMeta('ogTitle', title);
  setMeta('ogDescription', description);
  setMeta('ogUrl', url);
  setMeta('ogImage', image);
  setMeta('twTitle', title);
  setMeta('twDescription', description);
  setMeta('twImage', image);

  // Update description meta
  let descMeta = document.querySelector('meta[name="description"]');
  if (descMeta) descMeta.setAttribute('content', description);

  // Add or update keywords
  let kwMeta = document.querySelector('meta[name="keywords"]');
  if (!kwMeta) {
    kwMeta = document.createElement('meta');
    kwMeta.setAttribute('name', 'keywords');
    document.head.appendChild(kwMeta);
  }
  const kws = [
    `biuro ${p.company}`,
    `${p.company} ${p.city}`,
    p.designer ? `${p.designer} ${p.company}` : '',
    p.building ? `biuro w ${p.building}` : '',
    `polski workplace ${p.year || ''}`,
    `${p.city} biura`,
    p.industry || ''
  ].filter(Boolean).join(', ');
  kwMeta.setAttribute('content', kws);

  // === Build JSON-LD ===
  const ORG = {"@type":"Organization","@id":`${BASE}/#organization`,"name":"Showroom Biur","url":BASE,
    "publisher": {"@type": "Organization", "name": "Showroom Biur", "url": "https://showroombiur.pl"}};
  const PERSON = {"@type":"Person","@id":`${BASE}/#filip-sarzynski`,"name":"Filip Sarzyński",
    "jobTitle":"Wydawca, Redaktor naczelny Showroom Biur",
    "worksFor":{"@type":"Organization","name":"Brookfield Partners"}};

  // Architecture studio as Organization
  const studio = p.designer ? {
    "@type":"Organization","@id":`${BASE}/pracownia.html?id=${slugifyForSchema(p.designer)}#org`,
    "name":p.designer,"areaServed":{"@type":"Country","name":"Polska"},
    "knowsAbout":["Workplace design","Interior architecture","Office fit-out"]
  } : null;

  // The office project itself as CreativeWork / Place
  const cw = {
    "@type":["Article","CreativeWork"],
    "@id":`${url}#project`,
    "headline":`${p.company} - biuro w ${p.city}, ${p.year || ''}`,
    "name":`${p.company} office`,
    "description":description,
    "url":url,
    "image":(p.gallery && p.gallery.length ? p.gallery : (p.hero ? [p.hero] : [])).slice(0, 10).map(u => ({
      "@type":"ImageObject", "url":u, "contentUrl":u,
      "creditText": p.photographer || `Materiały ${p.designer || 'pracowni'}`,
      "creator": p.photographer ? {"@type":"Person","name":p.photographer} : (studio || undefined),
      "copyrightHolder": p.photographer ? {"@type":"Person","name":p.photographer} : (studio || undefined),
      "license":"https://creativecommons.org/licenses/by-nc/4.0/"
    })),
    "datePublished": p.year ? `${p.year}-01-01` : "2026-01-01",
    "dateCreated": p.year ? `${p.year}-01-01` : null,
    "dateModified":"2026-05-31",
    "inLanguage":"pl-PL",
    "isPartOf":{"@id":`${BASE}/biurofilia.html#dataset`},
    "mainEntityOfPage":url,
    "author":PERSON,
    "publisher":{"@id":`${BASE}/#organization`},
    "creator": studio || undefined,
    "contentLocation": {
      "@type":"Place",
      "name": p.building ? `${p.building}, ${p.city}` : p.city,
      "address":{"@type":"PostalAddress","addressLocality":p.city,"addressCountry":"PL"}
    },
    "locationCreated":{
      "@type":"Place","name":p.city,
      "address":{"@type":"PostalAddress","addressLocality":p.city,"addressCountry":"PL"}
    },
    "about":[
      {"@type":"Thing","name":"Workplace design"},
      {"@type":"Thing","name":p.industry || "Polski rynek biurowy"},
      p.building ? {"@type":"Place","name":p.building} : null
    ].filter(Boolean),
    "keywords": kws,
    "isAccessibleForFree": true,
    "copyrightYear": p.year || 2026,
  };
  if (p.area_m2) {
    cw.size = `${p.area_m2} m²`;
    cw.additionalProperty = [
      {"@type":"PropertyValue","name":"Powierzchnia (m²)","value":p.area_m2,"unitCode":"MTK"},
      p.year ? {"@type":"PropertyValue","name":"Rok ukończenia","value":p.year} : null,
      p.building ? {"@type":"PropertyValue","name":"Budynek","value":p.building} : null
    ].filter(Boolean);
  }
  if (p.photographer) {
    cw.copyrightHolder = {"@type":"Person","name":p.photographer};
  }

  // BreadcrumbList
  const bc = {
    "@type":"BreadcrumbList",
    "@id":`${url}#breadcrumb`,
    "itemListElement":[
      {"@type":"ListItem","position":1,"name":"Strona główna","item":`${BASE}/biurofilia.html`},
      {"@type":"ListItem","position":2,"name":"Archiwum","item":`${BASE}/biurofilia.html#archive`},
      {"@type":"ListItem","position":3,"name":p.company,"item":url}
    ]
  };

  // WebPage container
  const webpage = {
    "@type":"WebPage","@id":url,"url":url,
    "name":title,"description":description,
    "isPartOf":{"@id":`${BASE}/#website`},
    "inLanguage":"pl-PL",
    "primaryImageOfPage": p.hero ? {"@type":"ImageObject","url":p.hero} : undefined,
    "mainEntity":{"@id":`${url}#project`},
    "breadcrumb":{"@id":`${url}#breadcrumb`}
  };

  const graph = [ORG, PERSON, webpage, cw, bc];
  if (studio) graph.push(studio);

  // Inject
  const ldEl = document.getElementById('schemaOrgJsonLd');
  if (ldEl) {
    ldEl.textContent = JSON.stringify({"@context":"https://schema.org","@graph":graph}, null, 2);
  }
}

function slugifyForSchema(s) {
  if (!s) return '';
  const pl = {'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z'};
  return s.toLowerCase().split('').map(c => pl[c] || c).join('')
    .replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '');
}

// === LIGHTBOX ===
let lbState = { images: [], idx: 0, project: null };

function initLightbox(p) {
  lbState.project = p;
  lbState.images = p.gallery;
  // Bind click on all gallery items
  document.querySelectorAll('.gallery-item').forEach(el => {
    el.addEventListener('click', e => {
      const i = parseInt(el.getAttribute('data-idx'), 10) || 0;
      openLightbox(i);
    });
  });
  // Also bind the hero image if it's clickable
  const heroImage = document.querySelector('.hero-image');
  if (heroImage && p.hero) {
    heroImage.style.cursor = 'zoom-in';
    heroImage.addEventListener('click', e => {
      // If clicked on the image area, open lightbox starting at hero
      const heroIdx = lbState.images.indexOf(p.hero);
      openLightbox(heroIdx >= 0 ? heroIdx : 0);
    });
  }
  // Build thumbnail strip once
  const thumbs = document.getElementById('lbThumbs');
  thumbs.innerHTML = lbState.images.map((url, i) =>
    `<div class="lb-thumb" data-idx="${i}"><img src="${esc(url)}" loading="lazy" alt="kadr ${i+1}"></div>`
  ).join('');
  thumbs.querySelectorAll('.lb-thumb').forEach(t => {
    t.addEventListener('click', () => {
      const i = parseInt(t.getAttribute('data-idx'), 10) || 0;
      showLbImage(i);
    });
  });

  // Lightbox controls
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  document.getElementById('lbPrev').addEventListener('click', () => navLb(-1));
  document.getElementById('lbNext').addEventListener('click', () => navLb(1));
  document.getElementById('lbThumbsToggle').addEventListener('click', () => {
    document.getElementById('lightbox').classList.toggle('thumbs-on');
    document.getElementById('lbThumbs').classList.toggle('show');
  });

  // Keyboard
  document.addEventListener('keydown', e => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') navLb(-1);
    else if (e.key === 'ArrowRight') navLb(1);
  });

  // Touch swipe
  let touchStartX = 0;
  const stage = document.querySelector('.lb-stage');
  stage.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
  stage.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) navLb(dx < 0 ? 1 : -1);
  });

  // Click on overlay (outside image) closes
  document.getElementById('lightbox').addEventListener('click', e => {
    if (e.target.id === 'lightbox' || e.target.classList.contains('lb-stage')) closeLightbox();
  });

  // Preload neighbouring images for snappy navigation
  window.addEventListener('load', () => {
    lbState.images.slice(0, 4).forEach(url => { const i = new Image(); i.src = url; });
  });
}

function openLightbox(idx) {
  document.body.classList.add('lb-open');
  document.getElementById('lightbox').classList.add('open');
  document.getElementById('lightbox').setAttribute('aria-hidden', 'false');
  showLbImage(idx);
}

function closeLightbox() {
  document.body.classList.remove('lb-open');
  const lb = document.getElementById('lightbox');
  lb.classList.remove('open', 'thumbs-on');
  lb.setAttribute('aria-hidden', 'true');
  document.getElementById('lbThumbs').classList.remove('show');
}

function navLb(delta) {
  const n = lbState.images.length;
  showLbImage((lbState.idx + delta + n) % n);
}

function showLbImage(idx) {
  lbState.idx = idx;
  const img = document.getElementById('lbImg');
  const loading = document.getElementById('lbLoading');
  const url = lbState.images[idx];
  loading.classList.add('show');
  img.style.opacity = '0';
  const tmp = new Image();
  tmp.onload = () => {
    img.src = url;
    img.style.opacity = '1';
    loading.classList.remove('show');
    // Preload neighbours
    const n = lbState.images.length;
    [(idx+1)%n, (idx-1+n)%n].forEach(i => { const x = new Image(); x.src = lbState.images[i]; });
  };
  tmp.onerror = () => {
    loading.classList.remove('show');
    img.alt = 'Nie udało się załadować zdjęcia';
  };
  tmp.src = url;

  document.getElementById('lbIdx').textContent = idx + 1;
  document.getElementById('lbTotal').textContent = lbState.images.length;
  const p = lbState.project;
  document.getElementById('lbTitle').innerHTML = `${esc(p.company)}<span class="small">${esc(p.city)} · ${p.year || ''}${p.designer ? ' · ' + esc(p.designer) : ''}</span>`;

  // Update active thumbnail
  document.querySelectorAll('.lb-thumb').forEach((t, i) => {
    t.classList.toggle('active', i === idx);
    if (i === idx) t.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
  });
}

// Scroll-state nav
window.addEventListener('scroll', () => {
  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 20);
});

init();
</script>

/* Zdjęcia, które się nie wczytają, znikają zamiast pokazywać pustą ramkę */
document.addEventListener('error', function (e) {
  var el = e.target;
  if (!el || el.tagName !== 'IMG') return;
  var g = el.closest('.gallery-item'); if (g) { g.remove(); return; }
  el.style.display = 'none';
}, true);
(function () {
  function checkHero() {
    var h = document.querySelector('.hero-image[style*="background-image"]');
    if (!h) return;
    var m = /url\(['"]?([^'")]+)/.exec(h.getAttribute('style')); if (!m) return;
    var i = new Image(); i.referrerPolicy = 'no-referrer';
    i.onerror = function () { h.style.backgroundImage = 'none'; h.classList.add('hero-missing'); };
    i.src = m[1];
  }
  window.addEventListener('load', function () { setTimeout(checkHero, 50); });
})();
</script>
