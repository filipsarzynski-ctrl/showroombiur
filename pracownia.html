kilku lokalizacjach. Projekt FOURTH poprzedziły badania potrzeb pracowników.","Przeprowadzono ponad 50 wywiadów i warsztatów. Biuro ma 114 sal spotkań, ponad dwa razy więcej niż wcześniej, a na każdym piętrze strefy socjalne z widokiem na park i jezioro. W recepcji wisi tryptyk Tomasza Opalińskiego, namalowany dla tego wnętrza.","Pracownia: <strong>FOURTH<\/strong>. Budynek: <strong>Lakeside<\/strong>. Powierzchnia: 1 208 m². Branża: opieka zdrowotna."],"source":"","officelist_url":"https://www.officelist.pl/oferta/lakeside"},{"slug":"mattel-warszawa-2024","company":"Mattel","city":"Warszawa","year":2024,"designer":"BIT CREATIVE","area_m2":650,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-12.jpg","https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-16.jpg","https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-18.jpg","https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-22.jpg","https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-25.jpg","https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-27.jpg","https://www.officelovin.com/wp-content/uploads/2024/04/mattel-warsaw-office-30.jpg"],"photographer":"Fotomohito","url":"","industry":"Fashion / Toys","award":null,"description_paragraphs":["Warszawskie biuro Mattel zaprojektowało BIT Creative. Strefy wspólne i stanowiska pracy utrzymano w bieli i szarości, a kolory marek zabawek przeniesiono do sal spotkań.","Dwie największe sale, Barbie i Fisher-Price, można połączyć, a ich wystrój jest lustrzanym odbiciem. W salach Hot Wheels i Matchbox stoją stoły na fragmentach silnika i fotele z samochodowych siedzeń, a w mniejszych pokojach stół w formie planszy do scrabble i ściana z klocków Mega Bloks. W biurze stoi też sofa w kształcie autobusu Barbie.","Pracownia: <strong>BIT Creative<\/strong>. Powierzchnia: 650 m². Branża: zabawki."],"source":"","officelist_url":null},{"slug":"mediterranean-shipping-co-warszawa-2024","company":"MSC Poland","city":"Warszawa","year":2024,"designer":"Brookfield Partners","area_m2":840,"building":"Postępu 14","developer":null,"hero":"foto/mediterranean-shipping-co-warszawa-2024/01.jpg","gallery":["foto/mediterranean-shipping-co-warszawa-2024/01.jpg","foto/mediterranean-shipping-co-warszawa-2024/02.jpg","foto/mediterranean-shipping-co-warszawa-2024/03.jpg","foto/mediterranean-shipping-co-warszawa-2024/04.jpg","foto/mediterranean-shipping-co-warszawa-2024/05.jpg","foto/mediterranean-shipping-co-warszawa-2024/06.jpg","foto/mediterranean-shipping-co-warszawa-2024/07.jpg","foto/mediterranean-shipping-co-warszawa-2024/08.jpg","foto/mediterranean-shipping-co-warszawa-2024/09.jpg","foto/mediterranean-shipping-co-warszawa-2024/10.jpg","foto/mediterranean-shipping-co-warszawa-2024/11.jpg","foto/mediterranean-shipping-co-warszawa-2024/12.jpg"],"photographer":null,"url":"https://www.brookfield.pl/realizacje/msc-poland","industry":"Logistyka","award":null,"description_paragraphs":["MSC Poland, oddział największego armatora kontenerowego na świecie, działa w Polsce od 1998 roku. Kiedy firma zaczęła szybko zatrudniać, potrzebowała większego biura z dużą kuchnią i miejscem do odpoczynku. Wybrała Postępu 14, w dużej mierze ze względu na taras.","Taras z drewnianą podłogą i ciemnymi sofami ogrodowymi to najczęściej używane miejsce w ciepłe miesiące. W środku logo MSC zawieszono na tle pionowych drewnianych listew, podłogę ułożono w jodełkę, a sufit zostawiono otwarty. Między strefami są szerokie drewniane stopnie do siedzenia, w sali konferencyjnej stoją żółte krzesła, a na ścianach wiszą zdjęcia kontenerowców.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>Postępu 14<\/strong>. Powierzchnia: 840 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."],"source":"bp-sharepoint-2026-11-06","officelist_url":null},{"slug":"multilife-benefit-systems-warszawa-2024","company":"Multilife (Benefit Systems)","city":"Warszawa","year":2024,"designer":"Concept Space","area_m2":null,"building":null,"developer":null,"hero":"https://pliki.propertydesign.pl/i/19/51/20/195120_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/18/69/81/186981_r0_1140.jpg","https://pliki.propertydesign.pl/i/18/69/79/186979_r0_1140.jpg","https://pliki.propertydesign.pl/i/18/69/78/186978_r0_1140.jpg","https://pliki.propertydesign.pl/i/18/69/76/186976_r0_1140.jpg","https://pliki.propertydesign.pl/i/18/51/20/185120_r0_1140.jpg"],"photographer":"mat. prasowe","url":"","industry":"Benefits / HR-tech","award":null,"description_paragraphs":["Projekt dla działu MultiLife firmy Benefit Systems SA to nowoczesna przestrzeń biurowa łącząca funkcjonalność z inspirującym designem. Projektanci Concept Space stworzyli dwustrefową koncepcję obejmującą otwartą przestrzeń pracy oraz strefę kreatywną - nieformalną i sprzyjającą spontanicznym spotkaniom.","Przestrzeń zachęca do współpracy, pozwalając pracownikom na wybór miejsca najlepiej odpowiadającego ich stylowi pracy. Pastelowe kolory, styl loftowy i wszechobecna zieleń tworzą przyjemną atmosferę.","Sercem biura są profesjonalne studia nagrań i podcastownia, spełniające wysokie wymagania akustyczne i techniczne. Projekt wspiera kreatywność i elastyczność zespołu."],"source":"","officelist_url":null},{"slug":"natek-warszawa-2024","company":"Natek","city":"Warszawa","year":2024,"designer":"Brookfield Partners","area_m2":524,"building":"Q22","developer":"Echo Investment","hero":"foto/natek-warszawa-2024/01.jpg","gallery":["foto/natek-warszawa-2024/01.jpg","foto/natek-warszawa-2024/02.jpg","foto/natek-warszawa-2024/03.jpg","foto/natek-warszawa-2024/04.jpg","foto/natek-warszawa-2024/05.jpg","foto/natek-warszawa-2024/06.jpg","foto/natek-warszawa-2024/07.jpg","foto/natek-warszawa-2024/08.jpg","foto/natek-warszawa-2024/09.jpg","foto/natek-warszawa-2024/10.jpg","foto/natek-warszawa-2024/11.jpg","foto/natek-warszawa-2024/12.jpg"],"photographer":null,"url":"https://www.brookfield.pl/realizacje/natek-poland","industry":"Tech / IT","award":null,"description_paragraphs":["Natek, firma z outsourcingu IT działająca od 2004 roku, potrzebowała większego biura blisko poprzedniego. Zajęła 524 m² w biurowcu Q22 w Warszawie. Otwarte później biuro we Wrocławiu urządzono w tym samym stylu.","Za recepcją stoi ściana z mchu z pomarańczowym logo. Pomarańcz wraca w siedziskach, sześciokątnych panelach akustycznych i neonie w jednej z sal, a jasny dąb w lamelach i w budce do rozmów z napisem take a break. Na białej ścianie namalowano mapę świata, przed nią wisi fotel-kokon.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>Q22<\/strong>. Powierzchnia: 524 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."],"source":"bp-sharepoint-2026-11-06","officelist_url":"https://www.officelist.pl/oferta/q22"},{"slug":"netcompany-warszawa-2024","company":"Netcompany","city":"Warszawa","year":2024,"designer":"BIT Creative","area_m2":2137,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-4.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-8.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-13.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-20.jpg","https://www.officelovin.com/wp-content/uploads/2024/06/net-company-office-21.jpg"],"photographer":"Fotomohito","url":"","industry":null,"award":null,"description_paragraphs":["Warszawskie biuro Netcompany zaprojektowało BIT Creative w duchu duńskiego hygge. Szarości ociepla drewno, a wnętrze miało zachęcić pracowników do powrotu do biura po pandemii.","Większość powierzchni to otwarte strefy, w których zespoły oddzielają szafki z zielenią i przegrody z paneli akustycznych i listew. Stołówka dla ponad 500 osób pracujących zmianowo zajmuje około jednej szóstej piętra i jest odizolowana akustycznie od reszty biura. Uzupełniają ją mniejsze punkty kawowe z drewnem i blatami we wzór marmuru.","Pracownia: <strong>BIT Creative<\/strong>. Powierzchnia: 2 137 m²."],"source":"","officelist_url":null},{"slug":"orsted-warszawa-2024","company":"Orsted","city":"Warszawa","year":2024,"designer":"FOURTH","area_m2":2400,"building":"Varso II","developer":null,"hero":"foto/orsted-warszawa-2024/01.jpg","gallery":["foto/orsted-warszawa-2024/01.jpg","foto/orsted-warszawa-2024/02.jpg","foto/orsted-warszawa-2024/03.jpg","foto/orsted-warszawa-2024/04.jpg","foto/orsted-warszawa-2024/05.jpg","foto/orsted-warszawa-2024/06.jpg","foto/orsted-warszawa-2024/07.jpg","foto/orsted-warszawa-2024/08.jpg","foto/orsted-warszawa-2024/09.jpg","foto/orsted-warszawa-2024/10.jpg"],"photographer":"Zofia Kurczych, Tomasz Czuban, Martyna Rudnicka","url":"","industry":"Energy / Mining / Oil","award":null,"description_paragraphs":["Biuro Ørsted w Varso II przygotowano dla 200 osób na największej kondygnacji budynku. Pracownia FOURTH zaprojektowała je zgodnie z firmowymi wytycznymi Love Your Workplace.","Przestrzeń podzielono według potrzeb współpracy, kontaktu i skupienia, bez rozległego open space. Dużą część mebli ruchomych przeniesiono z wcześniejszych projektów lub odnowiono, a materiały wykończeniowe pochodzą z recyklingu albo mają certyfikaty środowiskowe, np. cradle to cradle. To czwarta realizacja FOURTH dla tej firmy.","Pracownia: <strong>FOURTH<\/strong>. Budynek: <strong>Varso II<\/strong>. Powierzchnia: 2 400 m². Branża: energetyka."],"source":"","officelist_url":"https://www.officelist.pl/oferta/varso-2"},{"slug":"psibufet-warszawa-2024","company":"PsiBufet","city":"Warszawa","year":2024,"designer":"HUKK.studio","area_m2":400,"building":null,"developer":null,"hero":"https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/691e3e0d2146d7e74930f68f_psibufet-studio-hukk-12.jpg","gallery":["https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/691e3e0d2146d7e74930f68f_psibufet-studio-hukk-12.jpg","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/691e482f4dab0ae4d16734d1_psibufet-studio-hukk-14.jpg","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/691e45046e3b42600a7d58cd_psibufet-studio-hukk-13.jpg","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/691e450b78c48390baed7fa8_psibufet-studio-hukk-3.jpg","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/691e4514cf0f5761dbb55ac5_psibufet-studio-hukk-6.jpg","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/691e4528fa22be9b41a52a14_psibufet-studio-hukk-2.jpg","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/6924d2ff762434f1e8dcb939_psibufet-studio-hukk-7.png","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/6924d2f5312449c5da257fd1_psibufet-studio-hukk-9.png","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/6924d4499bf4b746f1a3e3b5_psibufet-studio-hukk-11.png","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/6924d2d8d26736f277dc1157_psibufet-studio-hukk-8.png","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/691e44b740925cc9278046fa_psibufet-studio-hukk-4.jpg"],"photographer":null,"url":"","industry":"e-commerce / petfood","award":null,"description_paragraphs":["Siedziba marki świeżej karmy dla psów. Funkcjonalne biuro z otwartą strefą społeczną dostosowaną do obecności zwierząt pracowników.","Pracownia: <strong>HUKK.studio<\/strong>.","Branża najemcy: e-commerce / petfood."],"source":"","officelist_url":null},{"slug":"saint-gobain-warszawa-2024","company":"Saint-Gobain","city":"Warszawa","year":2024,"designer":"Trzop Architekci","area_m2":null,"building":"Varso Tower (28. piętro)","developer":"HB Reavis","hero":"https://www.trzoparchitekci.pl/storage/2025/01/Fot.-1.jpg","gallery":["https://www.trzoparchitekci.pl/storage/2025/01/Fot.-10.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-11.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-13.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-12.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-9.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-6.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-8.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-7.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-5.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-4.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-3.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-2.jpg"],"photographer":"mat. prasowe","url":"","industry":"Building materials","award":null,"description_paragraphs":["Grupa Saint-Gobain przeniosła swoją warszawską centralę do nowoczesnego biura w Varso Tower, tworząc przestrzeń, gdzie technologie i zrównoważony rozwój idą w parze z dbałością o wellbeing pracowników. Nowe biuro na 28. piętrze najwyższego wieżowca w UE stawia na komfort, efektywność i zdrowe środowisko pracy.","Przestrzeń biurowa została zaprojektowana przez pracownię Trzop Architekci, a jej realizację powierzono generalnemu wykonawcy Decorator - Malewicz i Wspólnicy S.K.A. Biuro stanowi unikatowy showroom: ważną wytyczną było to, aby używane w projekcie materiały pochodziły z portfolio grupy Saint Gobain.","Nacisk postawiono na komfort akustyczny. W nowej siedzibie Saint-Gobain zastosowano specjalne panele sufitowe i ścienne, które skutecznie redukują poziom hałasu w pomieszczeniach, minimalizując tzw. echo trzepoczące, co zapewnia spokojne i sprzyjające koncentracji środowisko pracy. W celu utworzenia przestrzeni wolnej od hałasu, równoznacznej z poprawą izolacji akustycznej, posłużono się też systemami ścian działowych."],"source":"","officelist_url":"https://www.officelist.pl/oferta/varso-tower"},{"slug":"sanofi-warszawa-2024","company":"Sanofi","city":"Warszawa","year":2024,"designer":"The Design Group","area_m2":3400,"building":"Lixa E","developer":null,"hero":"https://thedesigngroup.pl/wp-content/uploads/2026/03/14_sanofi-3.jpg","gallery":["https://thedesigngroup.pl/wp-content/uploads/2026/03/14_sanofi-3.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/03/16_sanofi-29.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/03/20_sanofi-50.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/03/21_sanofi-20.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/03/22_sanofi-18.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/03/24_sanofi-16.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/03/25_sanofi-40.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/03/26_sanofi-46.jpg"],"photographer":null,"url":"","industry":"Healthcare","award":null,"description_paragraphs":["Biuro Sanofi w budynku Lixa E ma 3400 m². Recepcja przypomina bardziej hotelowe lobby niż biurową ladę, a obok jest strefa Warm Up Cool Down do wyciszenia się przed spotkaniem.","Organiczne formy, naturalne materiały i spokojna paleta łączą się z nowoczesną technologią. Sercem biura jest Work Cafe, kawiarnia, w której się pracuje, spotyka i prowadzi warsztaty. The Design Group zadbała też o pełną dostępność dla osób z niepełnosprawnościami.","Pracownia: <strong>The Design Group<\/strong>. Budynek: <strong>Lixa E<\/strong>. Powierzchnia: 3 400 m²."],"source":"tdg-zgoda-2026-11-05","officelist_url":null},{"slug":"savills-warszawa-2024","company":"Savills","city":"Warszawa","year":2024,"designer":"Trzop Architekci","area_m2":null,"building":"Q22","developer":null,"hero":"https://www.trzoparchitekci.pl/storage/2025/05/1.jpg","gallery":["https://www.trzoparchitekci.pl/storage/2025/05/2.jpg","https://www.trzoparchitekci.pl/storage/2025/05/3.jpg","https://www.trzoparchitekci.pl/storage/2025/05/4.jpg","https://www.trzoparchitekci.pl/storage/2025/05/5.jpg","https://www.trzoparchitekci.pl/storage/2025/05/6.jpg"],"photographer":null,"url":"","industry":"doradztwo / real estate","award":null,"description_paragraphs":["Nowa siedziba doradcy nieruchomości Savills w wieżowcu Q22. Projekt wnętrz biurowych z 2024 roku.","Pracownia: <strong>Trzop Architekci<\/strong>. Lokalizacja: <strong>Q22<\/strong>.","Branża najemcy: doradztwo / real estate."],"source":"","officelist_url":"https://www.officelist.pl/oferta/q22"},{"slug":"the-heart-warszawa-2024","company":"The Heart","city":"Warszawa","year":2024,"designer":"Massive Design","area_m2":null,"building":null,"developer":null,"hero":"https://massivedesign.pl/wp-content/uploads/2024/04/The-Heart-zm-1.jpg","gallery":["https://massivedesign.pl/wp-content/uploads/2024/04/The-Heart-zm-2.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/The-Heart-zm-3.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/The-Heart-zm-4.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/The-Heart-zm-6.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/The-Heart-zm-7.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/The-Heart-zm-8.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/The-Heart-zm-9.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/The-Heart-zm-11.jpg"],"photographer":null,"url":"","industry":"venture builder / innowacje","award":null,"description_paragraphs":["Redesign przestrzeni venture-buildera The Heart. Przeniesienie środka ciężkości z dużej przestrzeni eventowej w stronę pracy, spotkań i wielofunkcyjnej socjalówki z aneksem kuchennym.","Pracownia: <strong>Massive Design<\/strong>.","Branża najemcy: venture builder / innowacje."],"source":"","officelist_url":null},{"slug":"the-park-warsaw-warszawa-2024","company":"The Park Warsaw","city":"Warszawa","year":2024,"designer":"APA Wojciechowski Architekci","area_m2":130000,"building":"The Park Warsaw (AIG, White Star Real Estate)","developer":null,"hero":"foto/the-park-warsaw-warszawa-2024/01.jpg","gallery":["foto/the-park-warsaw-warszawa-2024/01.jpg","foto/the-park-warsaw-warszawa-2024/02.jpg","foto/the-park-warsaw-warszawa-2024/03.jpg","foto/the-park-warsaw-warszawa-2024/04.jpg","foto/the-park-warsaw-warszawa-2024/05.jpg","foto/the-park-warsaw-warszawa-2024/06.jpg","foto/the-park-warsaw-warszawa-2024/07.jpg","foto/the-park-warsaw-warszawa-2024/08.jpg","foto/the-park-warsaw-warszawa-2024/09.jpg","foto/the-park-warsaw-warszawa-2024/10.jpg","foto/the-park-warsaw-warszawa-2024/11.jpg","foto/the-park-warsaw-warszawa-2024/12.jpg","foto/the-park-warsaw-warszawa-2024/13.jpg","foto/the-park-warsaw-warszawa-2024/14.jpg","foto/the-park-warsaw-warszawa-2024/15.jpg","foto/the-park-warsaw-warszawa-2024/16.jpg"],"photographer":"mat. APA Wojciechowski","url":"","industry":"Real estate / developer (AIG, White Star)","award":null,"description_paragraphs":["The Park Warsaw to kampus biurowy w warszawskich Włochach, niedaleko lotniska, który od lat budują White Star Real Estate i AIG. Docelowo ma tu stanąć 12 budynków i 130 000 m² biur.","Między biurowcami nie ma samochodów, jest za to ogród z trawami ozdobnymi, rzeźby i ścieżki. Fasady mają ciemne ramy i dużo szkła, w lobby są kamienne posadzki, drewno, wyspy z roślinami i ekrany przy recepcji, a na parterze restauracje z drewnianymi stołami i taras pod zadaszeniem.","Pracownia: <strong>APA Wojciechowski Architekci<\/strong>. Deweloper: <strong>White Star Real Estate, AIG<\/strong>. Certyfikaty BREEAM Excellent i Very Good. Powierzchnia: 130 000 m² docelowo. Zdjęcia: materiały APA Wojciechowski."],"source":"apa-zgoda-2026-11-06","officelist_url":"https://www.officelist.pl/park-biurowy/the-park-warsaw"},{"slug":"the-shire-beyond-coworking-warszawa-2024","company":"The Shire - Beyond Coworking","city":"Warszawa","year":2024,"designer":null,"area_m2":9400,"building":"5 lokalizacji w Warszawie","developer":"The Shire","hero":"https://pliki.propertydesign.pl/i/17/87/83/178783_r0_1140.jpg","gallery":null,"photographer":null,"url":"","industry":"Coworking / Flex","award":null,"description_paragraphs":["Coworking The Shire - Beyond Coworking otworzył kolejną lokalizację w Warszawie. The Shire był najbardziej aktywnym graczem na rynku biur flex w 2024 r. - w 5 lokalizacjach udało się wynająć ponad 9400 m kw.","W Warszawie The Shire oferuje przestrzenie coworkingowe w atrakcyjnych lokalizacjach. Coworking dynamicznie rozwija się jako alternatywa dla tradycyjnego najmu długoterminowego, przyciągając zarówno małe firmy, jak i korporacje poszukujące elastycznych modeli najmu.","Na koniec 2024 r. stolica oferowała blisko 205 000 m kw. powierzchni coworkingowej w 85 lokalizacjach, a 72% powierzchni elastycznych rozwiązań znajdowało się w centrum."],"source":"","officelist_url":null},{"slug":"venture-cafe-warsaw-district-hall-trendhouse-warszawa-2024","company":"Venture Cafe Warsaw (District Hall / TrendHouse)","city":"Warszawa","year":2021,"designer":"mode:lina","area_m2":1300,"building":null,"developer":null,"hero":"https://modelina-architekci.com/wp-content/uploads/2023/03/MA300_Venture-Cafa-Warsaw_web-23-1-1920x1282.jpg","gallery":["https://modelina-architekci.com/wp-content/uploads/2023/03/MA300_Venture-Cafa-Warsaw_web-23-1-1920x1282.jpg","https://modelina-architekci.com/wp-content ektów ze studia Trzop. Od wejścia urzeka prostota form i kolorów; biuro utrzymano w lekkich, stonowanych odcieniach bieli i kaszmiru, w grze światła, cienia i tekstur. Wyróżnia się prosta recepcja z nietypową ladą w kolorze surowego srebra, kontrastującą z ciepłą bielą wapieni i mikrocementu. Sale konferencyjne otwierają widok dzięki przeszkleniom z loftowymi podziałami i stalowymi profilami. Open space z dębowymi blatami bez podziałów. Bielone ściany, sufity z pianą akustyczną, dywany o wzorze plecionki w biało-beżowo-szarej palecie. Aneksy kuchenne zachwycają instagramową prostotą bieli."],"source":"","officelist_url":"https://www.officelist.pl/oferta/x20"},{"slug":"lakeside-cavatina-holding-tenant-complex-warszawa-2023","company":"Lakeside (Cavatina Holding tenant complex)","city":"Warszawa","year":2023,"designer":"Grupa 5 Architekci","area_m2":43771,"building":"Lakeside Offices nad Strumieniem Służewieckim","developer":null,"hero":"https://images.adsttc.com/media/images/6565/02c6/0ca0/c303/1e22/c825/large_jpg/lakeside-grupa-5-architekci_3.jpg","gallery":["https://images.adsttc.com/media/images/6565/02c6/0ca0/c303/1e22/c825/large_jpg/lakeside-grupa-5-architekci_3.jpg","https://images.adsttc.com/media/images/6565/02c2/ad68/bf7c/b740/162f/large_jpg/lakeside-grupa-5-architekci_2.jpg","https://images.adsttc.com/media/images/6565/02c2/0ca0/c36d/0a12/36ae/large_jpg/lakeside-grupa-5-architekci_4.jpg","https://images.adsttc.com/media/images/6565/02c1/ad68/bf7c/b740/162e/large_jpg/lakeside-grupa-5-architekci_10.jpg","https://images.adsttc.com/media/images/6565/02c3/0ca0/c36d/0a12/36af/large_jpg/lakeside-grupa-5-architekci_8.jpg","https://images.adsttc.com/media/images/6565/02c0/ad68/bf7c/b740/162d/large_jpg/lakeside-grupa-5-architekci_1.jpg","https://images.adsttc.com/media/images/6565/02c4/0ca0/c36d/0a12/36b1/large_jpg/lakeside-grupa-5-architekci_11.jpg","https://images.adsttc.com/media/images/6565/02c9/0ca0/c36d/0a12/36b5/large_jpg/lakeside-grupa-5-architekci_5.jpg","ht żą ruchome schody i biegnie pasaż z restauracjami, na placu przed głównym budynkiem wieczorem świecą fontanny, a z dachów widać most Świętokrzyski i centrum miasta.","Pracownia: <strong>APA Wojciechowski Architekci<\/strong>. Inwestor: <strong>Tristan Capital Partners, White Star Real Estate<\/strong>. Powierzchnia: 100 000 m². Zdjęcia: materiały APA Wojciechowski."],"source":"apa-zgoda-2026-11-06","officelist_url":"https://www.officelist.pl/park-biurowy/elektrownia-powisle"},{"slug":"jll-warszawa-2020","company":"JLL","city":"Warszawa","year":2020,"designer":"Tetris Design + Build Polska","area_m2":13700,"building":"Warsaw Spire","developer":null,"hero":"https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-1.jpg","gallery":["https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-1.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-2.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-3.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-4.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-5.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-6.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-7.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-8.jpg","https://www.tetris-db.com/wp-content/uploads/2017/04/tetris-db-jll-warszawa-2544-9.jpg"],"photographer":null,"url":"","industry":"nieruchomosci","award":null,"description_paragraphs":["Fit-out nowego biura JLL w Warszawie zrealizowany w pełnym modelu Design+Build. Biuro znajduje się w wieży budynku Warsaw Spire. Autorką projektu wnętrz jest Danuta Barańska, dyrektor kreatywna Tétris. Zadaniem było zaprojektowanie i dostarczenie kreatywnej przestrzeni, która pozytywnie stymuluje użytkowników i tworzy wartość dla firmy. Na każdym piętrze znajduje się od 15 do 20 sal różnej wielkości - od małych pokoi do pracy w skupieniu (jak biblioteka), przez przestrzenie kreatywne, po sale spotkań wewnętrznych. Głównym motywem biura są polskie krajobrazy (las, morze, plaża), surowce naturalne (węgiel, sól, bursztyn), elementy folkloru (polska koronka) oraz wybitni Polacy - m.in. biblioteka Kopernika i sala Marii Skłodowskiej-Curie zdobiona grafikami przedstawiającymi wyposażenie laboratoryjne. Biuro otrzymało pierwszy w Polsce certyfikat BREEAM dla fit-outu przestrzeni biurowej z oceną 'Very Good'."],"source":"","officelist_url":"https://www.officelist.pl/park-biurowy/warsaw-spire"},{"slug":"link4-warszawa-2020","company":"LINK4","city":"Warszawa","year":2020,"designer":"BIT Creative","area_m2":6000,"building":null,"developer":null,"hero":"https://media.officesnapshots.com/wp-content/uploads/2020/02/link4-offices-warsaw-7-1200x800.jpg","gallery":["https://media.officesnapshots.com/wp-content/uploads/2020/02/link4-offices-warsaw-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2020/02/link4-offices-warsaw-8-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2020/02/link4-offices-warsaw-1-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2020/02/link4-offices-warsaw-2-1200x799.jpg","https://media.officesnapshots.com/wp-content/uploads/2020/02/link4-offices-warsaw-3-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2020/02/link4-offices-warsaw-4-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2020/02/link4-offices-warsaw-5-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2020/02/link4-offices-warsaw-6-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2020/02/link4-offices-warsaw-9-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2020/02/link4-offices-warsaw-10-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2020/02/link4-offices-wars lanski-0978.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/CARGILL-realizacja-MASSIVE-DESIGN-fot-Szymon-Polanski-1306.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/CARGILL-realizacja-MASSIVE-DESIGN-fot-Szymon-Polanski-1404.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/CARGILL-realizacja-MASSIVE-DESIGN-fot-Szymon-Polanski-1378-scaled.jpg"],"photographer":"Szymon Polański","url":"","industry":"FMCG / Retail","award":null,"description_paragraphs":["Massive Design zaprojektowało warszawskie biuro Cargill w 2010 roku. Gdy firma przedłużyła najem, wróciła do tej samej pracowni, by odświeżyć niemal całe wnętrze dla 150-osobowego zespołu.","Z połączenia kuchni, sąsiednich sal konferencyjnych i strefy chilloutu powstała przestrzeń socjalna o powierzchni ponad 120 m² Nowy kształt dostały też miejsca spotkań. Firma chciała ciepłego wnętrza z różnymi strefami do pracy, odpoczynku i wspólnego spędzania czasu.","Pracownia: <strong>Massive Design<\/strong>."],"source":"","officelist_url":null},{"slug":"rekeep-lodz-2026","company":"Rekeep","city":"Łódź","year":2026,"designer":"mode:lina","area_m2":1500,"building":"Kantor Poznańskiego, ul. Ogrodowa 15A","developer":null,"hero":"https://modelina-architekci.com/wp-content/uploads/2026/07/MA460_Rekeep_web-02.jpg","gallery":["https://modelina-architekci.com/wp-content/uploads/2026/07/MA460_Rekeep_web-31-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2026/07/MA460_Rekeep_web-46-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2026/07/MA460_Rekeep_web-55-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2026/07/MA460_Rekeep_web-44-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2026/07/MA460_Rekeep_web-62-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2026/07/MA460_Rekeep_web-42-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2026/07/MA460_Rekeep_web-27-1-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2026/07/MA460_Rekeep_web-48-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2026/07/MA460_Rekeep_web-57-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2026/07/MA460_Rekeep_web-36-1-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2026/07/MA460_Rekeep_web-38-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2026/07/MA460_Rekeep_web-08-1-1920x1282.jpg"],"photographer":"Patryk Lewiński","url":"","industry":"Usługi biznesowe","award":null,"description_paragraphs":["Kantor Poznańskiego powstał w drugiej połowie lat 80. XIX wieku jako część fabryczno-rezydencjonalnego zespołu Izraela Poznańskiego w Łodzi. Od stycznia 2026 roku pracuje tu Rekeep. Budynek jest pod opieką konserwatora, więc nowe salki i szklane podziały nie dotykają sufitów ani historycznych sztukaterii, a nowe drewno jest celowo ciemniejsze od odrestaurowanej stolarki.","Motyw łuku przyszedł z okien kantoru i wraca w zaokrąglonych narożnikach sal, meblach, oświetleniu i rysunku wykładzin, które prowadzą przez biuro zamiast ścian. W przyziemiu odsłonięto ceglane stropy, pierwsze piętro ma recepcję z ciemnego drewna i brązowego lustra, a na trzecim, pod świetlikami, działa kantyna z antresolą i widokiem na Pałac Poznańskiego i Manufakturę.","Pracownia: <strong>mode:lina<\/strong>. Budynek: <strong>Kantor Poznańskiego, ul. Ogrodowa 15A<\/strong>. Powierzchnia: 1 500 m²."],"source":"","officelist_url":null},{"slug":"demiurg-budynek-g2-poznan-2022","company":"Demiurg (budynek G2)","city":"Poznań","year":2022,"designer":"mode:lina","area_m2":null,"building":"ul. Górnicza, Poznań","developer":null,"hero":"https://modelina-architekci.com/wp-content/uploads/2024/03/MA371_Demiurg_press-02.jpg","gallery":["https://modelina-architekci.com/wp-content/uploads/2024/03/MA371_Demiurg_press-07-1282x1920.jpg","https://modelina-architekci.com/wp-content/uploads/2024/03/MA371_Demiurg_press-01-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2024/03/MA371_Demiurg_press-10-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2024/03/MA371_Demiurg_press-12-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2024/03/MA371_Demiurg_press-18-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2024/03/MA371_Demiurg_press-24-1282x1920.jpg","https://modelina-architekci.com/wp-content/uploads/2024/03/MA371_Demiurg_press-28-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2024/03/MA371_Demiurg_press-23-1282x1920.jpg","https://modelina-architekci.com/wp-content/uploads/2024/03/MA371_Demiurg_press-21-1282x1920.jpg","https://modelina-architekci.com/wp-content/uploads/2024/03/MA371_Demiurg_press-09-1920x1282.jpg"],"photographer":"Patryk Lewiński","url":"","industry":"Architektura / Design","award":null,"description_paragraphs":["Na poznańskim Górczynie, tuż obok biura z przedwojennym bunkrem, Demiurg postawił drugi budynek: prostą bryłę z drewnianą elewacją i dużymi przeszkleniami. Wnętrza znów zaprojektowała mode:lina, a deski z elewacji weszły do środka jako listwy na ścianach, które poprawiają akustykę.","Na parterze są wejście, sala konferencyjna i kuchnia, na antresoli budki telefoniczne. Czoło antresoli, spiralne schody i balustrada tworzą jedną plamę w kolorze indygo, a pomarańczowe okręgi przechodzą z betonowych stropów na ściany i do wnętrza budek. Geometria kolorów nawiązuje do programów CAD, w których pracuje firma. Meble pochodzą od polskich producentów: Bejot, Noti i MDD.","Pracownia: <strong>mode:lina<\/strong>. Budynek: <strong>ul. Górnicza, Poznań<\/strong>."],"source":"","officelist_url":null},{"slug":"brain-embassy-czackiego-warszawa-2022","company":"Brain Embassy Czackiego","city":"Warszawa","year":2022,"designer":"mode:lina","area_m2":null,"building":"ul. Czackiego 15/17","developer":null,"hero":"https://modelina-architekci.com/wp-content/uploads/2023/04/MA307_BE_Czackiego_press-01.jpg","gallery":["https: ci wspólnych.","Punktem wyjścia dla mode:lina był ludzki mózg, jego neurony i synapsy, przełożone na identyfikację marki i układ wnętrza. Sale konferencyjne przypominają o malarzach, konstruktorach i odkrywcach. Projekt powstał we współpracy z Pracownią Architektoniczną Poznań Projekt i został ukończony w październiku 2018 roku.","Pracownia: <strong>mode:lina<\/strong>. Budynek: <strong>Adgar BIT, ul. Konstruktorska<\/strong>."],"source":"","officelist_url":null},{"slug":"droids-on-roids-wroclaw-2017","company":"Droids On Roids","city":"Wrocław","year":2017,"designer":"mode:lina","area_m2":650,"building":"Zabytkowa kamienica w centrum Wrocławia","developer":null,"hero":"https://modelina-architekci.com/wp-content/uploads/2023/03/MA232_Droids_On_Roids_press-32.jpg","gallery":["https://modelina-architekci.com/wp-content/uploads/2023/03/MA232_Droids_On_Roids_press-06_02-1920x1256.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA232_Droids_On_Roids_press-26-1920x1272.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA232_Droids_On_Roids_press-02-1920x1272.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA232_Droids_On_Roids_press-10-1920x1289.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA232_Droids_On_Roids_press-01-1920x1281.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA232_Droids_On_Roids_press-17-1920x1266.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA232_Droids_On_Roids_press-13-1920x1292.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA232_Droids_On_Roids_press-33-1920x1252.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA232_Droids_On_Roids_press-11-1920x1267.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA232_Droids_On_Roids_press-16-1920x1272.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA232_Droids_On_Roids_press-30-1920x1288.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA232_Droids_On_Roids_press-20-1920x1308.jpg"],"photographer":"Patryk Lewiński","url":"","industry":"Tech / IT","award":null,"description_paragraphs":["Droids On Roids to wrocławski software house, który robi aplikacje mobilne dla klientów z całego świata. W 2017 roku zespół przeniósł się do zabytkowej kamienicy w centrum miasta, na 650 m² zaprojektowanych przez mode:lina.","Pod sufitem wszystkich pomieszczeń biegnie czarny pas, który udaje pasek stanu ze smartfona. Żółte detale i lampy w kształcie zygzaka odsyłają do błyskawicy z logo, a ta sama błyskawica wraca na drzwiach, biurkach i uchwytach budek telefonicznych. Kuchnia i playroom to jedno pomieszczenie, bo zespół lubi świętować premiery i oglądać razem filmy. Jest też pokój do drzemki z żółtym hamakiem.","Pracownia: <strong>mode:lina<\/strong>. Budynek: <strong>Zabytkowa kamienica w centrum Wrocławia<\/strong>. Powierzchnia: 650 m²."],"source":"","officelist_url":null},{"slug":"kohlman-cieplewo-2019","company":"Kohlman","city":"Cieplewo","year":2019,"designer":"mode:lina","area_m2":null,"building":null,"developer":null,"hero":"https://modelina-architekci.com/wp-content/uploads/2023/03/MA247_KOHLMAN_press-04.jpg","gallery":["https://modelina-architekci.com/wp-content/uploads/2023/03/MA247_KOHLMAN_press-23-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA247_KOHLMAN_press-21-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA247_KOHLMAN_press-16-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA247_KOHLMAN_press-08-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA247_KOHLMAN_press-20-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA247_KOHLMAN_press-09-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA247_KOHLMAN_press-10-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA247_KOHLMAN_press-05-1920x1282.jpg","ht -00.jpg","https://www.tetris-db.com/wp-content/uploads/2022/07/tetris-db-poland-wella-company-29830-03.jpg","https://www.tetris-db.com/wp-content/uploads/2022/07/tetris-db-poland-wella-company-29830-23.jpg","https://www.tetris-db.com/wp-content/uploads/2022/07/tetris-db-poland-wella-company-29830-25.jpg"],"photographer":null,"url":"","industry":"FMCG / Retail","award":null,"description_paragraphs":["Wella Company, producent kosmetyków do włosów, otworzyła drugą polską siedzibę w łódzkiej Bramie Miasta. Biuro ma prawie 1500 metrów kwadratowych i powstało w dziewięć tygodni. Koncepcję przygotowano w dziesięć dni, a projekt wykonawczy i budowa szły równolegle.","Wnętrze opiera się na dwóch kolorach rzadko spotykanych w biurach: butelkowej zieleni i żywej czerwieni. Na ścianach są ich pastelowe wersje, a pełne odcienie pojawiają się na meblach, lockersach i w detalach.","Pracownia: <strong>Tetris Design + Build Polska<\/strong>. Budynek: <strong>Brama Miasta<\/strong>. Powierzchnia: 1 500 m²."],"source":"","officelist_url":null},{"slug":"cms-warszawa-2022","company":"CMS","city":"Warszawa","year":2022,"designer":"Trzop Architekci","area_m2":null,"building":"Varso Tower","developer":null,"hero":"https://www.trzoparchitekci.pl/storage/2024/11/fotomohito_trzop_cms_080_6870-1.jpg","gallery":["https://www.trzoparchitekci.pl/storage/2024/11/fotomohito_trzop_cms_049_6828-1.jpg","https://www.trzoparchitekci.pl/storage/2024/11/fotomohito_trzop_cms_078_7438-1.jpg","https://www.trzoparchitekci.pl/storage/2024/11/2a4870a5a6509c06e71768822771e5cb-1.jpg","https://www.trzoparchitekci.pl/storage/2024/11/2d03dd6abab8c730d7582d4b1445ec8e-1.jpg","https://www.trzoparchitekci.pl/storage/2024/11/3c30e102972513ae5ff2330047fea640-1.jpg","https://www.trzoparchitekci.pl/storage/2024/11/6cfeec2e754b4c4f2e1a212e5c948b75-1.jpg","https://www.trzoparchitekci.pl/storage/2024/11/7df06a15acbd79a75dc5d9e2773f1dd2-1.jpg","https://www.trzoparchitekci.pl/storage/2024/11/40a7a92fbd69fe3ae3feb956e8bfdcc9-1.jp ka, a współpracowały Eliza Swół i Joanna Chwała. Pracownia pokazuje projekt jako biuro firmy konsultingowej, na zdjęciach i bez dłuższego opisu.","Pracownia: <strong>Trzop Architekci<\/strong>. Budynek: <strong>Silesia Business Park<\/strong>."],"source":"","officelist_url":null},{"slug":"douglas-warszawa-2026","company":"Douglas","city":"Warszawa","year":2026,"designer":"FOURTH","area_m2":2000,"building":null,"developer":null,"hero":"foto/douglas-warszawa-2026/01.jpg","gallery":["foto/douglas-warszawa-2026/01.jpg","foto/douglas-warszawa-2026/02.jpg","foto/douglas-warszawa-2026/03.jpg","foto/douglas-warszawa-2026/04.jpg","foto/douglas-warszawa-2026/05.jpg","foto/douglas-warszawa-2026/06.jpg","foto/douglas-warszawa-2026/07.jpg","foto/douglas-warszawa-2026/08.jpg","foto/douglas-warszawa-2026/09.jpg","foto/douglas-warszawa-2026/10.jpg"],"photographer":"Bianka Gajdzińska","url":"","industry":"FMCG / Retail","award":null,"description_paragraphs":["Douglas przejął w Warszawie biuro, które wcześniej zajmował ING, z wnętrzem zaprojektowanym przez mode:lina. Układ funkcjonalny wymagał tylko drobnych poprawek, więc zadaniem FOURTH była nowa koncepcja wnętrza, a nie przebudowa od zera. Po inwentaryzacji okazało się, że biuro jest w bardzo dobrym stanie technicznym: zostały sufity, przeszklone ściany, większość stolarki i część zabudów. Wymieniono wykładzinę, część opraw oświetleniowych i kuchnie.","Cały projekt prowadzono według zasady less waste, z jak najmniejszą ilością rozbiórek i odpadów. W biurze pracują głównie kobiety i to ich codzienna praca wyznaczała kierunek wnętrza. Wartości marki, od pasji do piękna po etykę i zrównoważony rozwój, stały się zasadami projektowymi, a nie tylko grafiką na ścianach.","Pracownia: <strong>FOURTH<\/strong>. Powierzchnia: 2 000 m²."],"source":"","officelist_url":null},{"slug":"sopra-steria-katowice-2026","company":"Sopra Steria","city":"Katowice","year":2026,"designer":"FOURTH","area_m2":4000,"building":"Grundmanna Office Park","developer":null,"hero":"foto/sopra-steria-katowice-2026/01.jpg","gallery":["foto/sopra-steria-katowice-2026/01.jpg","foto/sopra-steria-katowice-2026/02.jpg","foto/sopra-steria-katowice-2026/03.jpg","foto/sopra-steria-katowice-2026/04.jpg","foto/sopra-steria-katowice-2026/05.jpg","foto/sopra-steria-katowice-2026/06.jpg","foto/sopra-steria-katowice-2026/07.jpg","foto/sopra-steria-katowice-2026/08.jpg","foto/sopra-steria-katowice-2026/09.jpg","foto/sopra-steria-katowice-2026/10.jpg"],"photographer":"Bianka Gajdzińska","url":"","industry":"Tech / IT","award":null,"description_paragraphs":["Sopra Steria Polska przez lata pracowała w starszym biurze w Katowicach. Nowa siedziba miała przekonać do przyjazdów zespół IT, który w większości pracuje zdalnie. FOURTH zaczął od doradztwa przy wyborze lokalizacji, padło na Grundmanna Office Park, a potem przeprowadził badania: ankietę wśród 693 pracowników, 14 wywiadów z kadrą zarządzającą i warsztaty z przedstawicielami 22 działów. Ponad 90% osób wolało pracę z domu.","Pracownicy odrzucili ciemne, scenograficzne wnętrza kojarzone z firmami technologicznymi i poprosili o jasne, ciepłe przestrzenie z zielenią. Projektanci sięgnęli po katowicki modernizm, geologię i kulturę Śląska. Biuro ma 300 stanowisk dla ponad tysiąca osób pracujących hybrydowo, a jego środkiem jest duża strefa społeczna z ruchomymi ściankami.","Pracownia: <strong>FOURTH<\/strong>. Budynek: <strong>Grundmanna Office Park<\/strong>. Powierzchnia: 4 000 m²."],"source":"","officelist_url":null},{"slug":"nordea-baltic-sea-office-warszawa-2022","company":"Nordea Baltic Sea Office","city":"Warszawa","year":2022,"designer":"FOURTH","area_m2":4300,"building":"Libra, Al. Jerozolimskie","developer":null,"hero":"foto/nordea-baltic-sea-office-warszawa-2022/01.jpg","gallery":["foto/nordea-baltic-sea-office-warszawa-2022/01.jpg","foto/nordea-baltic-sea-office-warszawa-2022/02.jpg","foto/nordea-baltic-sea-office-warszawa-2022/03.jpg","foto/nordea-baltic-sea-office-warszawa-2022/04.jpg","foto/nordea-baltic-sea-office-warszawa-2022/05.jpg","foto/nordea-baltic-sea-office-warszawa-2022/06.jpg","foto/nordea-baltic-sea-office-warszawa-2022/07.jpg","foto/nordea-baltic-sea-office-warszawa-2022/08.jpg"],"photographer":"Adam Grzesik","url":"","industry":"Finanse","award":null,"description_paragraphs":["W kompleksie Libra przy Alejach Jerozolimskich Nordea zajmuje kilka kondygnacji. Najwyższe piętra mieszczą centrum IT Nordea Horizon, a niżej pracują międzynarodowe zespoły w Baltic Sea Office o powierzchni 4300 m². Projekt ukończono tuż przed pandemią, w 2020 roku, ale ludzie wrócili do biura dopiero dwa lata później.","Koncepcja łączy wątki z wcześniejszych biur Nordea projektowanych przez FOURTH, zwłaszcza z gdyńskiego działu IT. W strefie wspólnej stanęła pierwsza w polskim biurze ściana z otwartą, szumiącą wodą. Są tu też wirtualny świetlik i podwieszane schody.","Pracownia: <strong>FOURTH<\/strong>. Budynek: <strong>Libra, Al. Jerozolimskie<\/strong>. Powierzchnia: 4 300 m²."],"source":"","officelist_url":null},{"slug":"nordea-horizon-warszawa-2019","company":"Nordea Horizon","city":"Warszawa","year":2019,"designer":"FOURTH","area_m2":2500,"building":"Libra, Al. Jerozolimskie","developer":null,"hero":"foto/nordea-horizon-warszawa-2019/01.jpg","gallery":["foto/nordea-horizon-warszawa-2019/01.jpg","foto/nordea-horizon-warszawa-2019/02.jpg","foto/nordea-horizon-warszawa-2019/03.jpg","foto/nordea-horizon-warszawa-2019/04.jpg","foto/nordea-horizon-warszawa-2019/05.jpg","foto/nordea-horizon-warszawa-2019/06.jpg","foto/nordea-horizon-warszawa-2019/07.jpg","foto/nordea-horizon-warszawa-2019/08.jpg","foto/nordea-horizon-warszawa-2019/09.jpg","foto/nordea-horizon-warszawa-2019/10.jpg"],"photographer":"Adam Grzesik","url":"","industry":"Finanse","award":null,"description_paragraphs":["Horizon to globalne centrum dowodzenia IT banku Nordea, z ponad 2500 m² w Warszawie. Specjaliści pracują tu całą dobę nad rozwojem oprogramowania, jego utrzymaniem i cyberbezpieczeństwem dla całej grupy, więc wnętrze musiało spełniać najwyższe standardy bezpieczeństwa danych.","Architekci FOURTH połączyli dwa najwyższe piętra nowego budynku w jedną dwukondygnacyjną przestrzeń i dodali wewnętrzne schody łączące trzy piętra biura. Wystrój nawiązuje do Odysei kosmicznej Kubricka i hollywoodzkiego science fiction, a geometryczne formy i monochromatyczne kolory podkreśla zaprogramowane oświetlenie.","Pracownia: <strong>FOURTH<\/strong>. Budynek: <strong>Libra, Al. Jerozolimskie<\/strong>. Powierzchnia: 2 500 m²."],"source":"","officelist_url":null},{"slug":"nordea-less-waste-office-gdynia-2019","company":"Nordea Less Waste Office","city":"Gdynia","year":2019,"designer":"FOURTH","area_m2":1100,"building":null,"developer":null,"hero":"foto/nordea-less-waste-office-gdynia-2019/01.jpg","gallery":["foto/nordea-less-waste-office-gdynia-2019/01.jpg","foto/nordea-less-waste-office-gdynia-2019/02.jpg","foto/nordea-less-waste-office-gdynia-2019/03.jpg","foto/nordea-less-waste-office-gdynia-2019/04.jpg","foto/nordea-less-waste-office-gdynia-2019/05.jpg","foto/nordea-less-waste-office-gdynia-2019/06.jpg","foto/nordea-less-waste-office-gdynia-2019/07.jpg","foto/nordea-less-waste-office-gdynia-2019/08.jpg","foto/nordea-less-waste-office-gdynia-2019/09.jpg","foto/nordea-less-waste-office-gdynia-2019/10.jpg"],"photographer":"Adam Grzesik","url":"","industry":"Finanse","award":null,"description_paragraphs":["Less Waste Office Nordea w Gdyni to pierwsze w Polsce biuro zaprojektowane według zasady less waste. Około 80% materiałów pochodzi z odzysku lub jest ekologicznych. Architekci FOURTH wyszli od prostej obserwacji: biuro żyje zwykle 5-10 lat, a potem większość wyposażenia staje się odpadem.","Nordea przyjęła ryzyko takiego podejścia, bo odpowiedzialność za środowisko jest częścią jej wartości. Biuro miało też wzmocnić identyfikację pracowników z firmą i pokazać, że ekologiczne projektowanie da się zastosować w komercyjnej skali.","Pracownia: <strong>FOURTH<\/strong>. Powierzchnia: 1 100 m²."],"source":"","officelist_url":null},{"slug":"ceetrus-warszawa-2019","company":"Ceetrus","city":"Warszawa","year":2019,"designer":"FOURTH","area_m2":1200,"building":null,"developer":null,"hero":"foto/ceetrus-warszawa-2019/01.jpg","gallery":["foto/ceetrus-warszawa-2019/01.jpg","foto/ceetrus-warszawa-2019/02.jpg","foto/ceetrus-warszawa-2019/03.jpg","foto/ceetrus-warszawa-2019/04.jpg","foto/ceetrus-warszawa-2019/05.jpg","foto/ceetrus-warszawa-2019/06.jpg","foto/ceetrus-warszawa-2019/07.jpg","foto/ceetrus-warszawa-2019/08.jpg","foto/ceetrus-warszawa-2019/09.jpg","foto/ceetrus-warszawa-2019/10.jpg"],"photographer":"Adam Grzesik","url":"","industry":"Real estate","award":null,"description_paragraphs":["Ceetrus, deweloper i zarządca centrów handlowych Auchan, zamówił nowe biuro tuż po rebrandingu. Przestrzeń miała pokazać zmianę w kulturze firmy, nie tylko w identyfikacji wizualnej, i dobrze obsługiwać częste spotkania z klientami.","FOURTH zaprojektował biuro jak elegancki, przytulny salon w duchu modernizmu połowy XX wieku. Strefy społeczne przypominają domowy pokój dzienny, w którym zespół przyjmuje gości, prowadzi poważne rozmowy i po prostu się śmieje.","Pracownia: <strong>FOURTH<\/strong>. Powierzchnia: 1 200 m²."],"source":"","officelist_url":null},{"slug":"nordea-scandinavia-office-gdynia-2018","company":"Nordea Scandinavia Office","city":"Gdynia","year":2018,"designer":"FOURTH","area_m2":5500,"building":null,"developer":null,"hero":"foto/nordea-scandinavia-office-gdynia-2018/01.jpg","gallery":["foto/nordea-scandinavia-office-gdynia-2018/01.jpg","foto/nordea-scandinavia-office-gdynia-2018/02.jpg","foto/nordea-scandinavia-office-gdynia-2018/03.jpg","foto/nordea-scandinavia-office-gdynia-2018/04.jpg","foto/nordea-scandinavia-office-gdynia-2018/05.jpg","foto/nordea-scandinavia-office-gdynia-2018/06.jpg","foto/nordea-scandinavia-office-gdynia-2018/07.jpg","foto/nordea-scandinavia-office-gdynia-2018/08.jpg","foto/nordea-scandinavia-office-gdynia-2018/09.jpg","foto/nordea-scandinavia-office-gdynia-2018/10.jpg"],"photographer":"Adam Grzesik","url":"","industry":"Finanse","award":null,"description_paragraphs":["Scandinavia Office zajmuje pięć pięter i 5500 m² w siedzibie Nordea w Gdyni. Projektanci FOURTH sięgnęli po architekturę miast, z których wywodzi się bank: ścieżki rowerowe, kopenhaski plac Superkilen, operę w Oslo i kościół Temppeliaukio w Helsinkach.","Zarząd chciał biura, które przyciągnie i zatrzyma najlepszych pracowników. Projekt kontynuuje lokalne i nadmorskie wątki z wcześniejszego Seaport Office, a jego wzorem jest wielofunkcyjny plac miejski, na którym ludzie budują relacje.","Pracownia: <strong>FOURTH<\/strong>. Powierzchnia: 5 500 m²."],"source":"","officelist_url":null},{"slug":"nordea-seaport-office-gdynia-2018","company":"Nordea Seaport Office","city":"Gdynia","year":2018,"designer":"FOURTH","area_m2":10000,"building":null,"developer":null,"hero":"https://media.officesnapshots.com/wp-content/uploads/2018/09/nordea-seaport-offices-gdynia-1-1200x800.jpg","gallery":["https://media.officesnapshots.com/wp-content/uploads/2018/09/nordea-seaport-offices-gdynia-1-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2018/09/nordea-seaport-offices-gdynia-10-1200x802.jpg","https://media.officesnapshots.com/wp-content/uploads/2018/09/nordea-seaport-offices-gdynia-5-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2018/09/nordea-seaport-offices-gdynia-4-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2018/09/nordea-seaport-offices-gdynia-14-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2018/09/nordea-seaport-offices-gdynia-17-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2018/09/nordea-seaport-offices-gdynia-15-800x1200.jpg","https://media.officesnapshots.com/wp-content/uploads/2018/09/nordea-seaport-offices-gdynia-11-1200x800.jpg","https://media.officesnapshots.com/wp-content/uploads/2018/09/nordea- year":2021,"designer":"FOURTH","area_m2":4510,"building":"Warsaw Trade Tower","developer":null,"hero":"foto/msd-polska-warszawa-2021/01.jpg","gallery":["foto/msd-polska-warszawa-2021/01.jpg","foto/msd-polska-warszawa-2021/02.jpg","foto/msd-polska-warszawa-2021/03.jpg","foto/msd-polska-warszawa-2021/04.jpg","foto/msd-polska-warszawa-2021/05.jpg","foto/msd-polska-warszawa-2021/06.jpg","foto/msd-polska-warszawa-2021/07.jpg","foto/msd-polska-warszawa-2021/08.jpg","foto/msd-polska-warszawa-2021/09.jpg","foto/msd-polska-warszawa-2021/10.jpg"],"photographer":"Adam Grzesik","url":"","industry":"Healthcare / Pharma","award":null,"description_paragraphs":["MSD Polska zajmuje cztery piętra Warsaw Trade Tower, reprezentacyjne jest szesnaste. Koncepcja FOURTH nosi nazwę Green Industrial Pharmacy i łączy naukową precyzję z klimatem dawnej apteki.","Biuro zmniejszyło się o jedną trzecią, z sześciu pięter do czterech, a stanowisk jest o 60 procent mniej. Przypisane biurka zastąpiły pokoje do pracy w skupieniu, pokoje dla dwóch osób i sale na cztery i sześć osób. Drewniane podłogi, przeszklenia ze szprosami, czarny metal i cegła spotykają się z szafkami z opalanego drewna, półkami z książkami medycznymi i laboratoryjnym szkłem. Dotychczasowe biurka zostały, krzesła odnowiono, a blaty w salach konferencyjnych zrobiono z tworzywa z recyklingu.","Pracownia: <strong>FOURTH<\/strong>. Budynek: <strong>Warsaw Trade Tower<\/strong>. Powierzchnia: 4 510 m². Branża: farmacja."],"source":"","officelist_url":null},{"slug":"oceanic-warszawa-2019","company":"Oceanic","city":"Warszawa","year":2019,"designer":"FOURTH","area_m2":470,"building":null,"developer":null,"hero":"foto/oceanic-warszawa-2019/01.jpg","gallery":["foto/oceanic-warszawa-2019/01.jpg","foto/oceanic-warszawa-2019/02.jpg","foto/oceanic-warszawa-2019/03.jpg","foto/oceanic-warszawa-2019/04.jpg","foto/oceanic-warszawa-2019/05.jpg","foto/oceanic-warszawa-2019/06.jpg","foto/oceanic-warszawa-2019/07.jpg","foto/oceanic-warszawa-2019/08.jpg","foto/oceanic-warszawa-2019/09.jpg","foto/oceanic-warszawa-2019/10.jpg"],"photographer":"Adam Grzesik","url":"","industry":"Cosmetics / FMCG","award":null,"description_paragraphs":["Warszawska siedziba producenta kosmetyków Oceanic ma 470 m² i kameralny charakter rodzinnej firmy. FOURTH projektował ją razem z właścicielami, a punktem wyjścia była laboratoryjna klarowność: proste formy, precyzyjna geometria, białe tła i dużo dziennego światła.","Recepcja jest minimalistyczna, a poczekalnia działa jak galeria. Ażurowy regał pokazuje nagrody i produkty, a przy okazji oddziela strefę pracy. Miejsca pracy są stonowane, opowieść o marce wypełnia przestrzenie wspólne. Ekspres i zaplecze chowa przesuwana ściana za recepcją, a pamiątki z podróży wybrane przez właścicieli dodają wnętrzu ciepła.","Pracownia: <strong>FOURTH<\/strong>. Powierzchnia: 470 m². Branża: kosmetyki."],"source":"","officelist_url":null},{"slug":"miedzynarodowa-firma-doradcza-wroclaw-2023","company":"Międzynarodowa firma doradcza","city":"Wrocław","year":2023,"designer":"FOURTH","area_m2":650,"building":null,"developer":null,"hero":"foto/miedzynarodowa-firma-doradcza-wroclaw-2023/01.jpg","gallery":["foto/miedzynarodowa-firma-doradcza-wroclaw-2023/01.jpg","foto/miedzynarodowa-firma-doradcza-wroclaw-2023/02.jpg","foto/miedzynarodowa-firma-doradcza-wroclaw-2023/03.jpg","foto/miedzynarodowa-firma-doradcza-wroclaw-2023/04.jpg","foto/miedzynarodowa-firma-doradcza-wroclaw-2023/05.jpg","foto/miedzynarodowa-firma-doradcza-wroclaw-2023/06.jpg","foto/miedzynarodowa-firma-doradcza-wroclaw-2023/07.jpg","foto/miedzynarodowa-firma-doradcza-wroclaw-2023/08.jpg","foto/miedzynarodowa-firma-doradcza-wroclaw-2023/09.jpg","foto/miedzynarodowa-firma-doradcza-wroclaw-2023/10.jpg"],"photographer":"Adam Grzesik","url":"","industry":"Konsulting","award":null,"description_paragraphs":["Wrocławskie biuro globalnej firmy z branży audytu, podatków i doradztwa prawnego było pilotażem jej programu biura przyszłości. FOURTH zaprojektował 650 m² dla 60 osób, stawiając na współpracę, poczucie przynależności i możliwość ciągłych zmian.","Przestrzeń dzieli się mniej więcej po połowie na strefę pracowników i strefę gości. Zamiast pełnych ścian jest siatka nadproży i wysp sufitowych, więc trzy moduły pracownicze można połączyć w jedną salę, a kuchnię z dwiema salami spotkań w miejsce na zebranie całego zespołu. Wnętrze ma domowy charakter: stonowane szarości, ziemiste kolory, drewno, ciężkie zasłony akustyczne, pokój relaksu i taras z widokiem na miasto.","Pracownia: <strong>FOURTH<\/strong>. Powierzchnia: 650 m². Branża: doradztwo."],"source":"","officelist_url":null},{"slug":"trilux-swidnik-2025","company":"Trilux","city":"Świdnik","year":2025,"designer":"FOURTH","area_m2":3000,"building":null,"developer":null,"hero":"foto/trilux-swidnik-2025/01.jpg","gallery":["foto/trilux-swidnik-2025/01.jpg","foto/trilux-swidnik-2025/02.jpg","foto/trilux-swidnik-2025/03.jpg","foto/trilux-swidnik-2025/04.jpg","foto/trilux-swidnik-2025/05.jpg","foto/trilux-swidnik-2025/06.jpg","foto/trilux-swidnik-2025/07.jpg","foto/trilux-swidnik-2025/08.jpg","foto/trilux-swidnik-2025/09.jpg","foto/trilux-swidnik-2025/10.jpg"],"photographer":null,"url":"","industry":"Przemysł","award":null,"description_paragraphs":["Nowe biuro producenta oświetlenia Trilux w Świdniku zaprojektowała pracownia FOURTH. Ma około 3000 m², a jego centrum jest stołówka pod drewnianym sufitem.","Ściany mają fakturowe wykończenia i wzorzyste tapety, panele akustyczne zrobiono z naturalnych materiałów, m.in. z wełny drzewnej i biokompozytów. Światło to oprawy Trilux, w tym Parelia, Arimo Fit i Finea, sterowane tak, by równoważyć światło dzienne i sztuczne.","Pracownia: <strong>FOURTH<\/strong>. Powierzchnia: ok. 3 000 m². Branża: przemysł."],"source":"","officelist_url":null},{"slug":"olx-group-warszawa-2017","company":"OLX Group","city":"Warszawa","year":2017,"designer":"FOURTH","area_m2":500,"building":"Q22","developer":null,"hero":"foto/olx-group-warszawa-2017/01.jpg","gallery":["foto/olx-group-warszawa-2017/01.jpg","foto/olx-group-warszawa-2017/02.jpg","foto/olx-group-warszawa-2017/03.jpg","foto/olx-group-warszawa-2017/04.jpg","foto/olx-group-warszawa-2017/05.jpg","foto/olx-group-warszawa-2017/06.jpg","foto/olx-group-warszawa-2017/07.jpg","foto/olx-group-warszawa-2017/08.jpg","foto/olx-group-warszawa-2017/09.jpg","foto/olx-group-warszawa-2017/10.jpg"],"photographer":null,"url":"","industry":"E-commerce / Technology","award":null,"description_paragraphs":["Warszawskie biuro OLX Group zajmuje 500 m² na jedenastym piętrze Q22. Powstało, gdy grupa Naspers po sprzedaży Allegro i Ceneo rozwijała w Polsce OLX, i od początku miało być osobną koncepcją dla tej marki.","Pracownia FOURTH, wtedy jeszcze Workplace, postawiła na kolor, zieleń i ciepłe materiały. Biuro dzieli się na strefy tematyczne, sale spotkań mają różne kolory i charakter, a z okien widać centrum Warszawy z Pałacem Kultury.","Pracownia: <strong>FOURTH<\/strong>. Budynek: <strong>Q22<\/strong>. Powierzchnia: 500 m². Branża: e-commerce."],"source":"","officelist_url":null},{"slug":"allegro-fabryka-norblina-warszawa-2022","company":"Allegro (Fabryka Norblina)","city":"Warszawa","year":2022,"designer":"The Design Group","area_m2":24000,"building":"Fabryka Norblina","developer":null,"hero":"https://thedesigngroup.pl/wp-content/uploads/2026/06/10_Allegro-10.jpg","gallery":["https://thedesigngroup.pl/wp-content/uploads/2026/06/10_Allegro-10.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/12_Allegro-12.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/13_Allegro-13.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/17_Allegro-18.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/20_Allegro-21.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/25_Allegro-26.jpg"],"photographer":null,"url":"https://thedesigngroup.pl/portfolio/","industry":"E-commerce / Technology","award":null,"description_paragraphs":["Warszawskie biuro Allegro zajmuje siedem pięter w budynkach Plater i Galwan na terenie Fabryki Norblina, prawie 24 000 m². The Design Group wyszła od miejsca: szkło, cegła i konstrukcja dawnej fabryki wyznaczyły nastrój wnętrz, a industrialny charakter złagodziły ciepłe wykończenia, jasne kolory i drewno.","Biuro jest otwarte i przejrzyste. Podwójne przeszklenia mają szprosy w fornirze, a gdy ktoś potrzebuje się odciąć, zasuwa kotarę akustyczną. Jest centrum konferencyjne z dwoma amfiteatrami, sale do spotkań bez rezerwacji, zielone jungle roomy i trzy tarasy. Część mebli przyjechała z poprzedniej siedziby i dostała drugie życie.","Pracownia: <strong>The Design Group<\/strong>. Budynek: <strong>Fabryka Norblina<\/strong>. Powierzchnia: 24 000 m²."],"source":"tdg-zgoda-2026-11-05","officelist_url":null},{"slug":"exact-sciences-warszawa-2025","company":"Exact Sciences","city":"Warszawa","year":2025,"designer":"The Design Group","area_m2":1600,"building":"Lixa D","developer":null,"hero":"https://thedesigngroup.pl/wp-content/uploads/2026/06/02_Exact-Sciences-19.jpg","gallery":["https://thedesigngroup.pl/wp-content/uploads/2026/06/02_Exact-Sciences-19.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/08_Exact-Sciences-5.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/10_Exact-Sciences-6.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/12_Exact-Sciences-4.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/13_Exact-Sciences-29.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/14_Exact-Sciences-20.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/16_Exact-Sciences-13.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/17_Exact-Sciences-14.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/19_Exact-Sciences-32.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/20_Exact-Sciences-31.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/21_Exact-Sciences-30.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/0 Modern Twist: wejście przypomina elegancki apartament albo kameralne lobby hotelowe, z dębowym parkietem w jodełkę, naturalnym kamieniem i ladą recepcji ze stali nierdzewnej.","Przeszklona ściana wpuszcza światło dzienne z recepcji do kuchni, a kuchnię można połączyć z salą konferencyjną na większe spotkania. W strefie pracy jest dobra akustyka, zieleń i miękkie formy, a część mebli przeniesiono z poprzedniego biura.","Pracownia: <strong>The Design Group<\/strong>. Budynek: <strong>Lixa C<\/strong>. Powierzchnia: 750 m²."],"source":"tdg-zgoda-2026-11-05","officelist_url":null},{"slug":"the-magnum-ice-cream-company-warszawa-2026","company":"The Magnum Ice Cream Company","city":"Warszawa","year":2026,"designer":"The Design Group","area_m2":550,"building":"Studio A","developer":null,"hero":"https://thedesigngroup.pl/wp-content/uploads/2026/09/15_Magnum-meeting-room.jpg","gallery":["https://thedesigngroup.pl/wp-content/uploads/2026/09/15_Magnum-meeting-room.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/09/17_Magnum-dining2.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/09/19_Magnum-dining3.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/09/20_Magnum-dining.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/09/21_Magnum-web1.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/09/22_Magnum-kitchen.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/09/01_Magnum-web7.jpg"],"photographer":null,"url":"https://thedesigngroup.pl/portfolio/","industry":"Food / Beverage","award":null,"description_paragraphs":["Warszawskie biuro The Magnum Ice Cream Company ma koncepcję o nazwie Serious Playfulness. Od kremowej recepcji, przez wyraziste sale spotkań, po kuchnię i open space wnętrze prowadzi jak smak loda: od spokoju do koloru.","Całość spina Lick Line, miękka, falująca linia, która raz jest zabudową, raz grafiką, a nad komunikacją zamienia się w świetlną instalację pod sufitem w odcieniu kakao. Kolory to wanilia, pistacja, róż i czekolada. /11.jpg","foto/abakus-logistics-warszawa-2024/12.jpg"],"photographer":null,"url":"https://www.brookfield.pl/realizacje/abakus-logistics","industry":"Logistyka","award":null,"source":"bp-sharepoint-2026-11-06","officelist_url":null,"description_paragraphs":["Abakus Logistics, firma spedycyjna działająca od 2014 roku, potrzebowała więcej miejsca dla rosnącego zespołu i chciała zostać w tej samej części miasta. Przeniosła się do biurowca Equator II, na 1 700 m².","Najwięcej dzieje się w kuchni. Fronty szafek mają kolor petrolu, dębowa podłoga ułożona jest w jodełkę, a odsłonięty sufit z instalacjami pomalowano na oliwkowo. Obok stoi stół bilardowy z zielonym suknem. Sale spotkań oddzielają szklane ściany z mlecznym wzorem w kółka, w strefie wypoczynku jedną ścianę zajmuje fototapeta z lasem we mgle, a recepcję obłożono jasnym drewnem.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>Equator II<\/strong>. Powierzchnia: 1 700 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."]},{"slug":"revolut-krakow-2020","company":"Revolut","city":"Kraków","year":2020,"designer":"Brookfield Partners","area_m2":5320,"building":"Podium Park","developer":null,"hero":"foto/revolut-krakow-2020/01.jpg","gallery":["foto/revolut-krakow-2020/01.jpg","foto/revolut-krakow-2020/02.jpg","foto/revolut-krakow-2020/03.jpg","foto/revolut-krakow-2020/04.jpg","foto/revolut-krakow-2020/05.jpg","foto/revolut-krakow-2020/06.jpg","foto/revolut-krakow-2020/07.jpg","foto/revolut-krakow-2020/08.jpg","foto/revolut-krakow-2020/09.jpg","foto/revolut-krakow-2020/10.jpg","foto/revolut-krakow-2020/11.jpg","foto/revolut-krakow-2020/12.jpg"],"photographer":null,"url":"https://www.brookfield.pl/realizacje/revolut","industry":"Finanse","award":null,"source":"bp-sharepoint-2026-11-06","officelist_url":null,"description_paragraphs":["Revolut zebrał w Podium Park dwa dotychczasowe krakowskie biura. Na 5 320 m² pracuje centrum usługowe fintechu, które w czasie przeprowadzki szybko zatrudniało nowych ludzi.","Sufity zostawiono otwarte, z widocznymi kanałami wentylacji, a przestrzeń porządkują rośliny: palmy w donicach, skrzynie z zielenią nad blatami i stalowe regały, z których zwieszają się pnącza. Przy oknach stoją rzędy biurek, bliżej środka rude sofy, długie blaty barowe z wysokimi stołkami i ściana z czerwonej cegły w jednej ze stref odpoczynku.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>Podium Park<\/strong>. Powierzchnia: 5 320 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."]},{"slug":"bonprix-lodz-2026","company":"Bonprix","city":"Łódź","year":2026,"designer":"Brookfield Partners","area_m2":2392,"building":"Nowa Fabryczna","developer":null,"hero":"foto/bonprix-lodz-2026/01.jpg","gallery":["foto/bonprix-lodz-2026/01.jpg","foto/bonprix-lodz-2026/02.jpg","foto/bonprix-lodz-2026/03.jpg","foto/bonprix-lodz-2026/04.jpg","foto/bonprix-lodz-2026/05.jpg","foto/bonprix-lodz-2026/06.jpg","foto/bonprix-lodz-2026/07.jpg","foto/bonprix-lodz-2026/08.jpg","foto/bonprix-lodz-2026/09.jpg","foto/bonprix-lodz-2026/10.jpg","foto/bonprix-lodz-2026/11.jpg","foto/bonprix-lodz-2026/12.jpg"],"photographer":null,"url":"https://www.brookfield.pl/realizacje/bonprix","industry":"E-commerce / Technology","award":null,"source":"bp-sharepoint-2026-11-06","officelist_url":null,"description_paragraphs":["Polska centrala bonprix, marki odzieżowej z grupy Otto, mieści się w Łodzi. Firma szukała biura, które pomoże jej przyciągać ludzi, i jednocześnie chciała obniżyć koszty. Wybrała piąte piętro Nowej Fabrycznej, 2 392 m².","Recepcja to czarna, zaokrąglona lada z logo, nad którą wiszą duże świetlne obręcze, a sufit wykończono drewnianymi lamelami. Tuż obok stoją wieszaki z ubraniami z bieżących kolekcji. Dalej są długie ławy obite pudroworóżowym materiałem, wyspa kuchenna i podłoga z jasnego dębu. W jednej ze stref zamiast krzeseł zawieszono huśtawki.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>Nowa Fabryczna<\/strong>. Powierzchnia: 2 392 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."]},{"slug":"bureau-veritas-warszawa-2026","company":"Bureau Veritas","city":"Warszawa","year":2025,"designer":"Brookfield Partners","area_m2":1000,"building":"Platinium Business Park","developer":null,"hero":"foto/bureau-veritas-warszawa-2026/01.jpg","gallery":["foto/bureau-veritas-warszawa-2026/01.jpg","foto/bureau-veritas-warszawa-2026/02.jpg","foto/bureau-veritas-warszawa-2026/03.jpg","foto/bureau-veritas-warszawa-2026/04.jpg","foto/bureau-veritas-warszawa-2026/05.jpg","foto/bureau-veritas-warszawa-2026/06.jpg"],"photographer":null,"url":"https://www.brookfield.pl/realizacje/bureau-veritas","industry":"Konsulting","award":null,"source":"bp-sharepoint-2026-11-06","officelist_url":null,"description_paragraphs":["Bureau Veritas, firma zajmująca się testami, inspekcjami i certyfikacją, założona w 1828 roku, przeniosła warszawski zespół do Platinium Business Park, na 1 000 m². Miało być miejsce i na wspólną pracę, i na zadania, które wymagają ciszy.","W recepcji drewniane donice z roślinami prowadzą do granatowej ściany z logo. Szare wykładziny przechodzą w drewno w kuchni, gdzie długi blat z jasnego forniru biegnie wzdłuż przeszklonej ściany. Fotele mają kolor morskiej zieleni, a w największej sali stoły ustawiono w prostokąt przed ciemnoniebieską ścianą.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>Platinium Business Park<\/strong>. Powierzchnia: 1 000 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."]},{"slug":"alorica-lodz-2023","company":"Alorica","city":"Łódź","year":2023,"designer":"Brookfield Partners","area_m2":4950,"building":"React","developer":null,"hero":"foto/alorica-lodz-2023/01.jpg","gallery":["foto/alorica-lodz-2023/01.jpg","foto/alorica-lodz-2023/02.jpg","foto/alorica-lodz-2023/03.jpg","foto/alorica-lodz-2023/04.jpg","foto/alorica-lodz-2023/05.jpg","foto/alorica-lodz-2023/06.jpg","foto/alorica-lodz-2023/07.jpg","foto/alorica-lodz-2023/08.jpg","foto/alorica-lodz-2023/09.jpg","foto/alorica-lodz-2023/10.jpg","foto/alorica-lodz-2023/11.jpg","foto/alorica-lodz-2023/12.jpg"],"photographer":null,"url":"https://www.brookfield.pl/realizacje/alorica","industry":"Konsulting","award":null,"source":"bp-sharepoint-2026-11-06","officelist_url":null,"description_paragraphs":["Alorica, amerykańska firma obsługi klienta zatrudniająca 100 000 osób w 15 krajach, wybrała Łódź na swoje pierwsze biuro w Polsce. Zajęła dwa piętra, 4 950 m², w budynku React przy Piłsudskiego 24.","Wnętrze trzyma się dwóch kolorów. Pomarańczowe są ściana przy wejściu, fotele w strefie wypoczynku i krzesła w salach szkoleniowych, morskie są wykładziny, kanapy i wysokie fotele z osłonami do rozmów telefonicznych. W kuchni na grafitowej ścianie wypisano zaproszenie do wspólnego jedzenia, nad stołami wiszą okrągłe lampy, a szare boksy akustyczne pozwalają odciąć się od reszty sali.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>React<\/strong>. Powierzchnia: 4 950 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."]},{"slug":"grand-parade-krakow-2023","company":"Grand Parade","city":"Kraków","year":2023,"designer":"Brookfield Partners","area_m2":4824,"building":null,"developer":null,"hero":"foto/grand-parade-krakow-2023/01.jpg","gallery":["foto/grand-parade-krakow-2023/01.jpg","foto/grand-parade-krakow-2023/02.jpg","foto/grand-parade-krakow-2023/03.jpg","foto/grand-parade-krakow-2023/04.jpg","foto/grand-parade-krakow-2023/05.jpg","foto/grand-parade-krakow-2023/06.jpg","foto/grand-parade-krakow-2023/07.jpg","foto/grand-parade-krakow-2023/08.jpg","foto/grand-parade-krakow-2023/09.jpg","foto/grand-parade-krakow-2023/10.jpg","foto/grand-parade-krakow-2023/11.jpg","foto/grand-parade-krakow-2023/12.jpg"],"photographer":null,"url":"https://www.brookfield.pl/realizacje/grand-parade","industry":"Tech / IT","award":null,"source":"bp-sharepoint-2026-11-06","officelist_url":null,"description_paragraphs":["Grand Parade, krakowski hub technologiczny William Hill, przez kilka miesięcy oglądał inne biurowce, a ostatecznie został przy Kotlarskiej 11. Zamiast zmiany adresu przebudowano 4 824 m² pod pracę hybrydową. Układ powstał po warsztatach z kierownikami zespołów, którzy opowiedzieli, jak pracują ich ludzie.","Recepcję obłożono jasnymi lamelami z logo, a w głębi stoją sale spotkań przypominające kontenery, obite granatową blachą falistą. Podłoga w kuchni ułożona jest w szachownicę z szarych płytek. Są wiszące fotele-kokony przed fototapetą z lasem, sala na wystąpienia z rzędami krzeseł i żółto pomalowane rury instalacji, których nikt nie próbował ukryć.","Pracownia: <strong>Brookfield Partners<\/strong>. Powierzchnia: 4 824 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."]},{"slug":"blik-warszawa-2023","company":"BLIK","city":"Warszawa","year":2023,"designer":"Brookfield Partners","area_m2":1450,"building":"X20","developer":null,"hero":"foto/blik-warszawa-2023/01.jpg","gallery":["foto/blik-warszawa-2023/01.jpg","foto/blik-warszawa-2023/02.jpg","foto/blik-warszawa-2023/03.jpg","foto/blik-warszawa-2023/04.jpg","foto/blik-warszawa-2023/05.jpg","foto/blik-warszawa-2023/06.jpg","foto/blik-warszawa-2023/07.jpg"],"photographer":null,"url":"https://www.brookfield.pl/realizacje/blik","industry":"Finanse","award":null,"source":"bp-sharepoint-2026-11-06","officelist_url":null,"description_paragraphs":["BLIK, czyli Polski Standard Płatności, szukał kameralnego budynku z miejscem na dalszy rozwój. Wybrał warszawski X20, gdzie zajmuje 1 450 m².","Wnętrze jest spokojne: jasnoszare wykładziny, otwarte sufity i długie dębowe stoły na czarnych nogach w strefie biurek. Ciepła dodają przegrody z pionowych drewnianych listew i obudowy słupów z tego samego drewna. Mocny kolor pojawia się tylko raz, w butelkowozielonej kuchni z zielonymi płytkami na ścianie.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>X20<\/strong>. Powierzchnia: 1 450 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."]},{"slug":"four-suits-technology-krakow-2023","company":"Four Suits Technology","city":"Kraków","year":2023,"designer":"Brookfield Partners","area_m2":922,"building":"Brain Park","developer":null,"hero":"foto/four-suits-technology-krakow-2023/01.jpg","gallery":["foto/four-suits-technology-krakow-2023/01.jpg","foto/four-suits-technology-krakow-2023/02.jpg","foto/four-suits-technology-krakow-2023/03.jpg","foto/four-suits-technology-krakow-2023/04.jpg","foto/four-suits-technology-krakow-2023/05.jpg","foto/four-suits-technology-krakow-2023/06.jpg","foto/four-suits-technology-krakow-2023/07.jpg","foto/four-suits-technology-krakow-2023/08.jpg","foto/four-suits-technology-krakow-2023/09.jpg","foto/four-suits-technology-krakow-2023/10.jpg","foto/four-suits-technology-krakow-2023/11.jpg","foto/four-suits-technology-krakow-2023/12.jpg"],"photographer":null,"url":"https://www.brookfield.pl/realizacje/four-suits-technology","industry":"Gaming / Tech","award":null,"source":"bp-sharepoint-2026-11-06","officelist_url":null,"description_paragraphs":["Four Suits Technology, krakowski zespół Caesars Entertainment pracujący nad zakładami sportowymi i grami online, planował potroić liczbę pracowników w kilka miesięcy. Wybrał piąte piętro Brain Parku, 922 m².","Przy wejściu wisi ściana z żywych roślin z nazwą firmy, a przed nią stoją pomarańczowe fotele. Sercem biura są drewniane schody do siedzenia pod półokrągłym, butelkowozielonym oparciem, na których zbiera się cały zespół. Podłogi są z dębu w jodełkę, przy barze stoją zielone hokery, a jedną z sal spotkań pomalowano w całości na musztardowo.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>Brain Park<\/strong>. Powierzchnia: 922 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."]},{"slug":"travelist-warszawa-2023","company":"Travelist","city":"Warszawa","year":2023,"designer":"Brookfield Partners","area_m2":838,"building":"Focus","developer":null,"hero":"foto/travelist-warszawa-2023/01.jpg","gallery":["foto/travelist-warszawa-2023/01.jpg
