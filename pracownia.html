 / FMCG","award":null,"description_paragraphs":["Siedziba HDRÈY Group (do niedawna Estetyczna Grupa) pod Warszawą to projekt Piotra Łucyana z Art'Up Interiors. Wnętrza odwołują się do modernizmu i stylu lat 60., z fornirami, kamieniem i skórą.","Lobby wyłożono boazerią z wędzonego dębu, a niska, zaokrąglona lada recepcji nawiązuje do przedwojennego modernizmu. Na ścianie wiszą zegary Star George'a Nelsona, pokazujące czas na głównych rynkach firmy. Część dla pracowników ma jaśniejsze kolory, oszczędne meble, sztukę i rośliny, a gabinet prezesa urządzono według osobistych upodobań inwestora.","Pracownia: <strong>Art'Up Interiors<\/strong>. Zdjęcia: ŁAD Studio."],"source":"artup-zgoda-2026-11-06","officelist_url":null},{"slug":"greenberg-traurig-warszawa-2025","company":"Greenberg Traurig","city":"Warszawa","year":2025,"designer":"BIT Creative","area_m2":4459,"building":"Varso Tower","developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-7.jpg","https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-11.jpg","https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-13.jpg"],"photographer":"Fotomohito","url":"","industry":"Prawo","award":null,"description_paragraphs":["Kancelaria Greenberg Traurig zajmuje biuro w Varso Tower zaprojektowane przez BIT Creative. Wnętrza łączą kamień, drewno i miedź ze sztuką współczesną.","Strefa wejściowa łączy recepcję, sale konferencyjne i punkt kawowy, a dzięki mobilnemu wyposażeniu służy też do organizacji wydarzeń. Z okien widać panoramę Warszawy z iglicą Pałacu Kultury. W części biurowej przeważają zamknięte gabinety jedno- i dwuosobowe, uzupełnione miejscami do wspólnej pracy.","Pracownia: <strong>BIT Creative<\/strong>. Budynek: <strong>Varso Tower<\/strong>. Powierzchnia: 4 459 m². Branża: prawo."],"source":"","officelist_url":"https://www.officelist.pl/oferta/varso-tower"},{"slug":"kraft-heinz-warszawa-2025","company":"Kraft Heinz","city":"Warszawa","year":2025,"designer":"FOURTH","area_m2":1027,"building":"Harmony Office Park","developer":null,"hero":"foto/kraft-heinz-warszawa-2025/01.jpg","gallery":["foto/kraft-heinz-warszawa-2025/01.jpg","foto/kraft-heinz-warszawa-2025/02.jpg","foto/kraft-heinz-warszawa-2025/03.jpg","foto/kraft-heinz-warszawa-2025/04.jpg","foto/kraft-heinz-warszawa-2025/05.jpg","foto/kraft-heinz-warszawa-2025/06.jpg","foto/kraft-heinz-warszawa-2025/07.jpg","foto/kraft-heinz-warszawa-2025/08.jpg","foto/kraft-heinz-warszawa-2025/09.jpg","foto/kraft-heinz-warszawa-2025/10.jpg"],"photographer":"Adam Grzesik","url":"","industry":"Food & Beverage","award":null,"description_paragraphs":["Warszawskie biuro Kraft Heinz zajmuje półtora piętra w Harmony Office Park. Pracownia FOURTH oparła projekt na identyfikacji marki i ponownie wykorzystała część wyposażenia z poprzedniej siedziby.","Czwarte piętro przeznaczono na stanowiska pracy, a piąte na funkcje wspólne, m.in. sale spotkań, kuchnię pokazową, studio fotograficzne i salę wydarzeń z ruchomymi ścianami. Paleta opiera się na jasnym beżu z akcentami w kolorach marki, a w recepcji ustawiono gabloty z butelkami ketchupu.","Pracownia: <strong>FOURTH<\/strong>. Budynek: <strong>Harmony Office Park<\/strong>. Powierzchnia: 1 027 m². Branża: przemysł spożywczy."],"source":"","officelist_url":"https://www.officelist.pl/oferta/harmony-office-park"},{"slug":"lawsome-warszawa-2025","company":"Lawsome","city":"Warszawa","year":2025,"designer":"HUKK.studio","area_m2":null,"building":null,"developer":null,"hero":null,"gallery":null,"photographer":null,"url":"","industry":"usługi prawne","award":null,"description_paragraphs":["Biuro butikowej kancelarii Lawsome w Warszawie.","Pracownia: <strong>HUKK.studio<\/strong>.","Branża najemcy: usługi prawne."],"source":"","officelist_url":null},{"slug":"msa-safety-warszawa-2025","company":"MSA Safety","city":"Warszawa","year":2025,"designer":"HUKK.studio","area_m2":null,"building":null,"developer":null,"hero":null,"gallery":null,"photographer":null,"url":"","industry":"BHP / produkcja","award":null,"description_paragraphs":["Biuro producenta sprzętu ochronnego i bezpieczeństwa MSA Safety w Warszawie.","Pracownia: <strong>HUKK.studio<\/strong>.","Branża najemcy: BHP / produkcja."],"source":"","officelist_url":null},{"slug":"marsh-mclennan-marsh-mercer-guy-carpenter-oliver-wyman-warszawa-2025","company":"Marsh McLennan (Marsh, Mercer, Guy Carpenter, Oliver Wyman)","city":"Warszawa","year":2025,"designer":"Neo Świat (design & build)","area_m2":5300,"building":"Nimbus, Al. Jerozolimskie 98","developer":"CPI Property Group","hero":"https://pliki.propertydesign.pl/i/21/46/60/214660_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/21/46/50/214650_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/46/52/214652_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/46/53/214653_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/46/55/214655_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/46/54/214654_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/46/51/214651_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/46/57/214657_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/46/59/214659_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/46/60/214660_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/46/65/214665_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/46/66/214666_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/46/67/214667_r0_1140.jpg"],"photographer":"Neo Świat (mat. prasowe)","url":"","industry":"Insurance / Consulting","award":null,"description_paragraphs":["Biuro Grupy Marsh McLennan w warszawskim budynku Nimbus jest jak nowe. Projekt objął pięć kondygnacji o pow. 5,3 tys. mkw., wprowadzając nowoczesne rozwiązania funkcjonalne, poprawę akustyki i przestrzenie sprzyjające integracji.","Firma Neo Świat zakończyła kompleksową renowację biura dla spółek grupy Marsh McLennan (Marsh, Mercer, Guy Carpenter, Oliver Wyman) w budynku Nimbus przy Al. Jerozolimskich 98 w Warszawie. Prace objęły modernizację pięciu kondygnacji biurowych na poziomach 1-5, o łącznej powierzchni ok. 5 300 mkw. Inwestorem jest właściciel biurowca - CPI Property Group.","## Odmienione biuro grupy Marsh McLennan w Nimbusie","Projekt, zrealizowany w okresie od maja do września 2025 roku, obejmował kompleksową renowację powierzchni biurowych na piętrach o powierzchni około 1 060 mkw. każde. Zakres prac dotyczył wymiany okładzin ściennych i wykładzin dywanowych, a także dostosowania instalacji elektrycznych i HVAC.","Filcowe okładziny ścienne w zróżnicowanych kolorach nadały przestrzeniom nowoczesny, przyjazny ton i poprawiły komfort akustyczny.","## Strefa integracji na 5. piętrze","Największe zmiany wprowadzono na 5. piętrze, gdzie część przestrzeni open space została przekształcona w strefę wspólną z dużą kuchnią i centralną wyspą. Wydzielono nową salę konferencyjną, pomieszczenie magazynowe oraz dodatkowe budki telefoniczne.","Zakres prac obejmował również wkomponowanie nowych słupków instalacyjnych w salach konferencyjnych, na które przeniesiono osprzęt elektryczny i systemy sterowania oświetleniem oraz panele do rezerwacji sal."],"source":"","officelist_url":"https://www.officelist.pl/oferta/nimbus"},{"slug":"mat-pras-logistic-warszawa-2025","company":"Mat-Pras Logistic","city":"Warszawa","year":2025,"designer":"BIT Creative","area_m2":null,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-9.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-8.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office10.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office11.jpg"],"photographer":"Fotomohito","url":"","industry":null,"award":null,"description_paragraphs":["Biuro firmy Mat-Pras Logistic w Warszawie urządzono w stylu loftowym. Beton, szkło i metal przełamano drewnem, zielenią i czerwonymi akcentami.","Recepcja ma ladę z białego Corianu, nad którą zawieszono drewnianą instalację z motywem sześciokąta, powtarzanym też na ścianach. Czerwień pomaga w orientacji i wyróżnia ważniejsze strefy. Część socjalna ma charakter kawiarni, z barem, kuchnią i osobnym pokojem do odpoczynku.","Pracownia: <strong>BIT Creative<\/strong>."],"source":"","officelist_url":null},{"slug":"mute-warszawa-2025","company":"Mute","city":"Warszawa","year":2025,"designer":"Mute (Pawel Panek, Dominika Niewczas-Januszek)","area_m2":840,"building":"Hines-managed building","developer":null,"hero":"https://media.officesnapshots.com/wp-content/uploads/2025/09/mute-offices-warsaw-5-1200x800-compact.jpg","gallery":["https://media.officesnapshots.com/wp-content/uploads/2025/09/mute-offices-warsaw-4-700x467-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/09/mute-offices-warsaw-1-700x933.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/09/mute-offices-warsaw-3-700x467-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/09/mute-offices-warsaw-6-700x467-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/09/mute-offices-warsaw-8-700x467-compact.jpg"],"photographer":"courtesy of Mute","url":"","industry":"Design","award":null,"description_paragraphs":["Pierwsze w Europie biuro zbudowane w pelni z systemu modularnego - w dwa tygodnie, bez odpadow remontowych i emisji CO2.","Architektura: <strong>Mute (Pawel Panek, Dominika Niewczas-Januszek)<\/strong>, w budynku <strong>Hines-managed building<\/strong>.","Powierzchnia biura wynosi 840 m². Fotografia: <em>courtesy of Mute<\/em>. Branża najemcy: Design."],"source":"","officelist_url":null},{"slug":"omnires-warszawa-2025","company":"Omnires","city":"Warszawa","year":2025,"designer":"Loskiewicz.Studio","area_m2":300,"building":null,"developer":null,"hero":"https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-15-1200x800-compact.jpg","gallery":["https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-15-1200x800-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-6-1200x800-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-1-1200x800-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-1200x800-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-11-800x1200-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-4-1200x800-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-7-1200x800-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-2-800x1200-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-8-1200x800-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-13-800x1200-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-5-1200x800-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-9-1200x800-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-12-1200x800-compact.jpg","https://media.officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-14-800x1200-compact.jpg"],"photographer":"zasoby studio","url":"","industry":null,"award":null,"description_paragraphs":["Biuro Omnires, producenta armatury łazienkowej i kuchennej, mieści się w kompleksie The Park w Warszawie. Loskiewicz.Studio oparło projekt na motywie płynącej wody.","Otwarta przestrzeń sąsiaduje z wydzielonymi pokojami działu sprzedaży i zarządu, a łuki łagodzą architekturę wnętrza. Przy ograniczonym dostępie do światła dziennego projektanci użyli zaokrąglonych luksferów, które doświetlają kuchnię. We wnętrzu pokazano prace Jacka Kołodziejskiego, w tym rzeźby z serii Gradient Sculptures.","Pracownia: <strong>Loskiewicz.Studio<\/strong>. Powierzchnia: 300 m²."],"source":"","officelist_url":null},{"slug":"rock-capital-warszawa-2025","company":"Rock Capital","city":"Warszawa","year":2025,"designer":"BIT Creative","area_m2":460,"building":"Metropolitan, plac Piłsudskiego","developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-2.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-11.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-13-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-14.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-15.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-16.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-17.jpg"],"photographer":"Fotomohito","url":"","industry":"Real estate","award":null,"description_paragraphs":["Rock Capital przeniósł siedzibę do budynku Metropolitan przy placu Piłsudskiego. Projekt BIT Creative łączy stonowane wnętrza z wyrazistymi obrazami Łukasza Stokowskiego, namalowanymi dla tego biura.","Zamiast lady recepcyjnej przy wejściu stanęła konstrukcja wokół słupa z lustrzanym sufitem, a obok strefa spotkań połączona z kuchnią przesuwnymi drzwiami. Łuki budynku powtórzono w zabudowach i przeszkleniach, a w kuchni zawieszono rzeźbę RONDO Oskara Zięty. Sale spotkań noszą nazwiska artystów.","Pracownia: <strong>BIT Creative<\/strong>. Budynek: <strong>Metropolitan<\/strong>. Powierzchnia: 460 m². Branża: nieruchomości."],"source":"","officelist_url":"https://www.officelist.pl/oferta/metropolitan"},{"slug":"sap-polska-warszawa-2025","company":"SAP Polska","city":"Warszawa","year":2025,"designer":"Massive Design","area_m2":null,"building":"Varso Tower","developer":"HB Reavis","hero":"https://massivedesign.pl/wp-content/uploads/2024/04/SAP-2023-proj-Massive-Design-fot-Szymon-Polanski-1492.jpg","gallery":["https://massivedesign.pl/wp-content/uploads/2024/04/SAP-2023-proj-Massive-Design-fot-Szymon-Polanski-1561.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/SAP-2023-proj-Massive-Design-fot-Szymon-Polanski-6693.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/SAP-2023-proj-Massive-Design-fot-Szymon-Polanski-1295.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/SAP-2023-proj-Massive-Design-fot-Szymon-Polanski-2435.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/SAP-2023-proj-Massive-Design-fot-Szymon-Polanski-2483.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/SAP-2023-proj-Massive-Design-fot-Szymon-Polanski-2649.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/SAP-2023-proj-Massive-Design-fot-Szymon-Polanski-6313.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/SAP-2023-proj-Massive-Design-fot-Szymon-Polanski-6394.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/SAP-2023-proj-Massive-Design-fot-Szymon-Polanski-6348.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/SAP-2023-proj-Massive-Design-fot-Szymon-Polanski-6580.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/SAP-2023-proj-Massive-Design-fot-Szymon-Polanski-1336.jpg","https://massivedesign.pl/wp-content/uploads/2024/04/SAP-2023-proj-Massive-Design-fot-Szymon-Polanski-6751.jpg"],"photographer":"Szymon Polański","url":"","industry":"Enterprise software","award":null,"description_paragraphs":["Po 20 latach SAP przeniósł się do Varso. Strefa reprezentacyjna + strefa do pracy hybrydowej, sala klubowa, pokój dziennej opieki nad dzieckiem.","<strong>Massive Design<\/strong> ma w portfolio ponad 30 lat doświadczenia w projektowaniu biur high-end w Warszawie, w budynku <strong>Varso Tower<\/strong>. Deweloper budynku: HB Reavis.","Fotografia: <em>Szymon Polański<\/em>. Branża najemcy: Enterprise software."],"source":"","officelist_url":"https://www.officelist.pl/oferta/varso-tower"},{"slug":"wyborowa-pernod-ricard-warszawa-2025","company":"Wyborowa Pernod Ricard","city":"Warszawa","year":2025,"designer":"mode:lina","area_m2":2400,"building":"Lumen (11. piętro)","developer":null,"hero":"https://modelina-architekci.com/wp-content/uploads/2025/07/MA444_WPR_02_01.jpg","gallery":["https://modelina-architekci.com/wp-content/uploads/2025/07/MA444_WPR_01_01-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/07/MA444_WPR_01_08-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/07/MA444_WPR_02_03-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/07/MA444_WPR_02_02-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/07/MA444_WPR_04_19-1920x1280.jpg","https://modelina-architekci.com/wp-content/uploads/2025/07/MA444_WPR_06_02-1920x1280.jpg","https://modelina-architekci.com/wp-content/uploads/2025/07/MA444_WPR_06_07-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/07/MA444_WPR_04_01-1920x1282.jpg"],"photographer":"Patryk Lewiński","url":"","industry":"Alkohole / FMCG","award":null,"description_paragraphs":["Spektakularna modernizacja biura Wyborowa Pernod Ricard w warszawskim Lumen - szklane cegły, falująca miedziana blacha i marmurowy bar 4m inspirowany kadziami destylacyjnymi. Wnętrze łączące elegancję, naturalne materiały i hybrydowy model pracy.","Pracownia: <strong>mode:lina<\/strong>. Lokalizacja: <strong>Lumen (11. piętro)<\/strong>. Powierzchnia: 2 400 m². Fotografia: <em>Patryk Lewiński<\/em>.","Branża najemcy: Alkohole / FMCG."],"source":"","officelist_url":"https://www.officelist.pl/oferta/lumen"},{"slug":"helio-s-a-wroclaw-2025","company":"Helio S.A.","city":"Wrocław","year":2025,"designer":"SAAN Architekci","area_m2":4088,"building":"Brochów","developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-9.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-7.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2025/07/helio-sa-office-13.jpg"],"photographer":"Tom Kurek","url":"","industry":null,"award":null,"description_paragraphs":["Siedziba producenta żywności Helio we wrocławskim Brochowie to projekt SAAN Architekci. Wnętrza łączą naturalne drewno z granatem i czernią.","W open space zastosowano miękkie przegrody, wykładziny pochłaniające dźwięk i panele sufitowe. Powtarzają się zaokrąglone formy, widoczne w niszach, łukowych obramieniach drzwi i podziałach posadzki, a kuchnia ma długą wyspę obłożoną fornirem. Projekt prowadziły Iga Sawicka i Aleksandra Niedużak.","Pracownia: <strong>SAAN Architekci<\/strong>. Powierzchnia: 4 088 m²."],"source":"","officelist_url":null},{"slug":"kruk-wroclaw-2025","company":"KRUK","city":"Wrocław","year":2025,"designer":"BIT Creative","area_m2":6000,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-4.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-3.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-4.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-5.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-6.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-7.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-8.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-9.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-10.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-11.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-13.jpg","https://www.officelovin.com/wp-content/uploads/2025/09/kruk-office-wroclaw-14.jpg"],"photographer":"Fotomohito","url":"","industry":"Finanse","award":null,"description_paragraphs":["Wrocławska siedziba KRUK łączy cegłę, drewno, zieleń i czerwień. Każde piętro ma inny temat, od natury przez zjawiska pogodowe po sam Wrocław.","Na piętrze poświęconym miastu są grafiki studia Kolektyf z Kameleonem, Pergolą, Halą Stulecia i krasnalami, a w jednej ze stref wspólnych mozaika z panoramą Wrocławia. W recepcji umieszczono płaskorzeźbę Oskara Zięty. Biuro ma też strefę ćwiczeń, pokój z konsolą i pomieszczenia dostosowane do potrzeb osób neuroatypowych.","Pracownia: <strong>BIT Creative<\/strong>. Powierzchnia: 6 000 m². Branża: finanse."],"source":"","officelist_url":null},{"slug":"l-abo-by-l-uni-wroclaw-2025","company":"L'abo (by L'UNI)","city":"Wrocław","year":2025,"designer":"CUDO Studio","area_m2":null,"building":"Dawny Wydział Farmacji","developer":null,"hero":"https://pliki.propertydesign.pl/i/21/29/98/212998_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/21/29/83/212983_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/84/212984_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/87/212987_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/85/212985_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/86/212986_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/88/212988_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/89/212989_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/90/212990_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/91/212991_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/92/212992_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/93/212993_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/94/212994_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/95/212995_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/96/212996_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/97/212997_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/98/212998_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/29/99/212999_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/30/00/213000_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/30/01/213001_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/30/02/213002_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/30/03/213003_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/30/04/213004_r0_1140.jpg"],"photographer":"Migdał Studio","url":"","industry":"Coworking","award":null,"description_paragraphs":["W zabytkowym budynku dawnego Wydziału Farmacji we Wrocławiu powstała przestrzeń L'abo. To projekt wnętrz autorstwa pracowni CUDO, w którym elegancja, rzemiosło i lokalny kontekst spotykają się w harmonijnej kompozycji.","L'abo to wyjątkowa przestrzeń biurowa zlokalizowana w budynku dawnego Wydziału Farmacji w bliskim sąsiedztwie wrocławskiej starówki oraz Odry. Za projekt wnętrz odpowiada wrocławska pracownia CUDO.","## Coworking z duszą w sercu Wrocławia","Wnętrza są utrzymane w spokojnych, stonowanych i ciepłych kolorach, od złamanej bieli przez kolory piaskowe aż po kolor ugru, który pojawia się na elewacji budynku. W samym sercu przestrzeni biurowej zaprojektowano dominantę w postaci strefy coworkingowej, która sprzyja spotkaniom i wymianie pomysłów.","## Szklana instalacja jako interpretacja Odry","Centralnym elementem przestrzeni jest instalacja ze szkła farmaceutycznego, wykonana przez Villa Glass. Falująca tekstura szkła odzwierciedla formy pobliskiej Odry. Pod instalacjami znajdują się dwa stoły typu „common\", zaprojektowane do pracy indywidualnej, sesji burzy mózgów oraz wspólnych lunchów.","## Połączenie nowego ze starym","Aranżacja łączy nowoczesne materiały (stalowe regały, duże przeszklenia, designerskie meble) z klasycyzującą przestrzenią. Architekci uzupełnili wnętrza biur o autorsko opracowane kasetony, które dbają o akustykę i ukrywają technologię wentylacji."],"source":"","officelist_url":null},{"slug":"qair-wroclaw-2025","company":"Qair","city":"Wrocław","year":2025,"designer":"FOURTH","area_m2":1600,"building":null,"developer":null,"hero":"foto/qair-wroclaw-2025/01.jpg","gallery":["foto/qair-wroclaw-2025/01.jpg","foto/qair-wroclaw-2025/02.jpg","foto/qair-wroclaw-2025/03.jpg","foto/qair-wroclaw-2025/04.jpg","foto/qair-wroclaw-2025/05.jpg","foto/qair-wroclaw-2025/06.jpg","foto/qair-wroclaw-2025/07.jpg","foto/qair-wroclaw-2025/08.jpg"],"photographer":"Adam Grzesik","url":"","industry":"Energia odnawialna","award":null,"description_paragraphs":["Nowa wrocławska siedziba Qair zebrała w jednym miejscu zespoły, które wcześniej pracowały osobno. FOURTH przełożył na wnętrze wodę i wiatr, z którymi firma pracuje na co dzień.","Recepcję zdobi ściana wodna, sufit przecinają linie świetlne, a ruchoma instalacja oddaje rytm wiatru. Dużą kuchnię można połączyć z salą warsztatową. Przy projektowaniu uwzględniono neuroróżnorodność, stąd różne typy miejsc pracy, zielone ściany i filcowe panele akustyczne poruszające się z ruchem powietrza.","Pracownia: <strong>FOURTH<\/strong>. Powierzchnia: 1 600 m². Branża: energia odnawialna."],"source":"","officelist_url":null},{"slug":"bayer-gdansk-2024","company":"Bayer","city":"Gdańsk","year":2024,"designer":"Design Anatomy","area_m2":null,"building":"Olivia Centre","developer":"Olivia Centre","hero":"https://pliki.propertydesign.pl/i/17/82/88/178288_1140.jpg","gallery":null,"photographer":"Tom Kurek","url":"","industry":"Pharma / Agro","award":null,"description_paragraphs":["Biuro jednego z najstarszych rezydentów Olivia Centre w Gdańsku przeszło niedawno metamorfozę. Dostosowane do najnowszych trendów biuro grupy Bayer powstało w duchu less waste, a opiera się na nowej strategii przestrzeni pracy, obowiązującej w całej grupie.","Za projekt odpowiada pracownia Design Anatomy, której portfolio obejmuje ponad 200 tys. m.kw. zaprojektowanych i wykończonych powierzchni biurowych.","Przestrzenie zyskały zupełnie nową stylistykę. Tematem przewodnim projektu są nawiązania do Oliwy, historycznej gdańskiej dzielnicy, w której położone jest Olivia Centre. Gama ciepłych rudości i zieleni nawiązuje do otaczającego krajobrazu. Oliwa to dzielnica, w której nie brak zieleni (na czele z Parkiem Oliwskim), a rudą kolorystykę w panoramę miejską wprowadzają dachy okolicznych budynków, elewacje biurowca Wave spod kreski Medusa Group i, przede wszystkim, Stocznia Gdańska."],"source":"","officelist_url":"https://www.officelist.pl/park-biurowy/olivia-centre"},{"slug":"dnv-gdynia-2024","company":"DNV","city":"Gdynia","year":2024,"designer":"Forbis Group","area_m2":null,"building":"Łużycka Office Park","developer":null,"hero":"https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3679-HDR-scaled.jpg","gallery":["https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3520-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3485-HDR-scaled-e1732281322677.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3497-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3530-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3631-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3574-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3590-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3670-HDR-scaled.jpg","https://backend.forbisgroup.pl/wp-content/uploads/2024/11/DSC_3725-HDR-scaled.jpg"],"photographer":null,"url":"","industry":"doradztwo / certyfikacja","award":null,"description_paragraphs":["Biuro DNV, firmy zajmującej się klasyfikacją i certyfikacją, mieści się w gdyńskim Łużycka Office Park. Projekt przygotowała pracownia Forbis Group.","Pracownia: <strong>Forbis Group<\/strong>. Budynek: <strong>Łużycka Office Park<\/strong>. Branża: klasyfikacja i certyfikacja."],"source":"","officelist_url":"https://www.officelist.pl/oferta/luzycka-office-park"},{"slug":"copernic-krakow-2024","company":"Copernic","city":"Kraków","year":2024,"designer":"Superpozycja Architekci (Dominika Trzcińska)","area_m2":750,"building":"Pascal (Korona Office Complex)","developer":null,"hero":"https://pliki.propertydesign.pl/i/19/60/80/196080_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/19/60/84/196084_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/60/82/196082_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/60/81/196081_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/60/83/196083_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/60/80/196080_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/60/85/196085_r0_1140.jpg"],"photographer":"mat. prasowe","url":"","industry":"Tech / Science","award":null,"description_paragraphs":["Siedziba Copernic w Krakowie zlokalizowana jest w prestiżowym budynku Pascal, będącym częścią Korona Office Complex. Biuro o powierzchni 750 mkw. to połączenie elegancji, funkcjonalności i ekologicznych rozwiązań.","Zaprojektowana przez Dominikę Trzcińską z pracowni Superpozycja Architekci przestrzeń nawiązuje do świata nauki, a inspiracją do jej aranżacji stała się postać Mikołaja Kopernika, patrona firmy. Elementy nawiązujące do astronomii, odkryć naukowych i nowoczesnej technologii są obecne w całym biurze.","Jednym z najciekawszych elementów jest rzeźba Mikołaja Kopernika, wydrukowana z biodegradowalnego PLA pochodzącego z recyklingu. To nie tylko symbol patrona, ale także manifest zaangażowania firmy w ekologiczną produkcję. Ważnym punktem biura są także stoły konferencyjne wykonane z paneli fotowoltaicznych, które symbolizują dążenie firmy do wykorzystywania energii odnawialnej w codziennej pracy.","Za realizację biura odpowiedzialny był Neo Świat."],"source":"","officelist_url":"https://www.officelist.pl/oferta/pascal"},{"slug":"jll-and-t-tris-krakow-2024","company":"JLL & Tétris","city":"Kraków","year":2024,"designer":"Tétris (in-house)","area_m2":200,"building":"Unity Centre","developer":null,"hero":"https://pliki.propertydesign.pl/i/19/55/81/195581_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/19/55/87/195587_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/55/83/195583_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/55/79/195579_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/55/78/195578_r0_1140.jpg","https://pliki.propertydesign.pl/i/19/55/81/195581_r0_1140.jpg"],"photographer":"Szymon Polański","url":"","industry":"Real estate consulting","award":null,"description_paragraphs":["Projekt biura JLL i Tétris w krakowskim Unity Center obejmował adaptację 200 mkw, czyli jednego piętra, z podziałem na dwie strefy. Wprowadzono neutralną i szlachetną paletę kolorystyczną. Projekt charakteryzuje się dużą ilością zieleni, okładzinami ściennymi i szklanymi przegrodami.","Nowe biuro łączy udogodnienia z zakresu nowoczesnych technologii, z naturalną kolorystyką i przytulną atmosferą, sprzyjającą kreatywności i współpracy.","Zastosowano panele akustyczne i otwarte sufity. Grafiki nawiązujące do lokalnej architektury i motywów botanicznych podkreślają lokalny charakter biura. Wnętrze jest przytulne i nowoczesne, z wykorzystaniem filcu, drewna i zasłon akustycznych. Przestrzeń obejmuje strefę poczekalni, dużą kuchnię, salki konferencyjne i open space."],"source":"","officelist_url":"https://www.officelist.pl/oferta/unity-centre"},{"slug":"gambit-systems-polska-2024","company":"Gambit Systems","city":"Gliwice","year":2024,"designer":"Robert Konieczny + KWK Promes","area_m2":1285,"building":"Gambit Office (biuro + magazyn)","developer":null,"hero":"https://images.adsttc.com/media/images/6807/cba4/5bb0/0401/8564/7db6/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_17.jpg","gallery":["https://images.adsttc.com/media/images/6807/cba4/5bb0/0401/8564/7db6/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_17.jpg","https://images.adsttc.com/media/images/6807/cba4/9713/bf01/888b/e993/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_1.jpg","https://images.adsttc.com/media/images/6807/cba7/5bb0/0401/8564/7db9/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_6.jpg","https://images.adsttc.com/media/images/6807/cbad/9713/bf01/888b/e998/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_15.jpg","https://images.adsttc.com/media/images/6807/cba8/9713/bf01/888b/e994/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_13.jpg","https://images.adsttc.com/media/images/6807/cba9/9713/bf01/888b/e996/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_4.jpg","https://images.adsttc.com/media/images/6807/cbae/9713/bf01/888b/e99a/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_18.jpg","https://images.adsttc.com/media/images/6807/cba4/5bb0/0401/8564/7db7/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_2.jpg","https://images.adsttc.com/media/images/6807/cbad/5bb0/0401/8564/7dbf/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_5.jpg","https://images.adsttc.com/media/images/6807/cbad/9713/bf01/888b/e999/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_14.jpg","https://images.adsttc.com/media/images/6807/cbad/5bb0/0401/8564/7dbe/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_16.jpg","https://images.adsttc.com/media/images/6807/cbaa/5bb0/0401/8564/7dbb/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_8.jpg","https://images.adsttc.com/media/images/6807/cbaa/5bb0/0401/8564/7dbc/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_10.jpg","https://images.adsttc.com/media/images/6807/cba8/9713/bf01/888b/e995/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_9.jpg","https://images.adsttc.com/media/images/6807/cba9/5bb0/0401/8564/7dba/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_7.jpg","https://images.adsttc.com/media/images/6807/cbb0/9713/bf01/888b/e99b/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_11.jpg","https://images.adsttc.com/media/images/6807/cbab/5bb0/0401/8564/7dbd/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_12.jpg","https://images.adsttc.com/media/images/6807/cba5/5bb0/0401/8564/7db8/large_jpg/gambit-office-robert-konieczny-plus-kwk-promes_3.jpg"],"photographer":"Juliusz Sokołowski","url":"","industry":"Industrial / B2B Distribution","award":"World Building of the Week (World-Architects)","description_paragraphs":["Gambit, firma dystrybuująca specjalistyczne rury, zleciła zaprojektowanie budynku biurowo-magazynowego, który miał być jej unikalną wizytówką - przy najniższych możliwych kosztach. Wpadliśmy na pomysł użycia materiału, którym sama firma handluje i który mogła pozyskać po cenie kosztów. Jednocześnie chcieliśmy, by część biurowa i magazynowa tworzyły spójną całość. W rezultacie zaprojektowaliśmy budynek wyglądający jak stos rur - natychmiast komunikujący, czym zajmuje się firma. Na tej działce stała wcześniej prostokątna hala produkcyjna, ale najbliższe sąsiedztwo to domy mieszkalne ze stromymi dachami, często z długimi, kubicznymi zabudowaniami gospodarczymi - to zainspirowało ostateczną formę budynku."],"source":"","officelist_url":null},{"slug":"cms-poland-poznan-2024","company":"CMS Poland","city":"Poznań","year":2024,"designer":"Projektika.Interior","area_m2":420,"building":null,"developer":null,"hero":"https://pliki.propertydesign.pl/i/17/84/42/178442_1140.jpg","gallery":null,"photographer":"fotomohito","url":"","industry":"Legal","award":null,"description_paragraphs":["Siedziba CMS Poland w Poznaniu przeszła metamorfozę spod kreski pracowni Projektika.Interior. Powierzchnia ok. 420 mkw. przeszła kompleksową metamorfozę. Nadrzędnym celem było stworzenie miejsca, które zachęca do spędzania w nim czasu, sprzyjając integracji w zespole i budowaniu relacji z klientami.","Przestrzeń przepełniona jest lokalnymi akcentami - od fotografii poznańskiej architektury po mural z symbolami miasta. Znajdziemy na nim takie symbole Poznania, jak Bamberka, Koziołek, elementy gwary wielkopolskiej, schody z Okrąglaka, a także namalowany przez samego Noriakiego, Pan Peryskop.","Mural wykonali Dominik Dziedzina i Dorota Piechocińska z Grupy MUR.ALL oraz Noriaki, który domalował stworzoną przez siebie kultową już w Poznaniu postać."],"source":"","officelist_url":null},{"slug":"demiurg-poznan-2024","company":"Demiurg","city":"Poznań","year":2024,"designer":"mode:lina","area_m2":400,"building":"Siedziba własna Demiurg","developer":null,"hero":"https://modelina-architekci.com/wp-content/uploads/2023/03/MA312_DEMIURG_press-25-e1682506040103.jpg","gallery":["https://modelina-architekci.com/wp-content/uploads/2023/03/MA312_DEMIURG_press-01-1-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA312_DEMIURG_press-02-1-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA312_DEMIURG_press-15-1-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA312_DEMIURG_press-04-1-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA312_DEMIURG_press-17-1-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA312_DEMIURG_press-18-1-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA312_DEMIURG_press-19-1-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA312_DEMIURG_press-20-1-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA312_DEMIURG_press-26-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA312_DEMIURG_press-29-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA312_DEMIURG_press-10-1-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA312_DEMIURG_press-08-1-1920x1282.jpg"],"photographer":"Patryk Lewiński","url":"","industry":"Architecture","award":null,"description_paragraphs":["Poznańska siedziba firmy budowlanej Demiurg, z wnętrzami pracowni mode:lina, eksponuje surową konstrukcję budynku. Tuż obok stoi przedwojenny bunkier, odkryty podczas wykopów pod fundamenty.","Przez wszystkie kondygnacje biegną otwarte stalowe schody zakończone świetlikiem. Betonowe posadzki i stropy zestawiono ze sklejką o kolorowych krawędziach, z której wykonano półki, blaty i zabudowę kuchni. Są też budowlane detale, jak dwuteownik nad kuchnią, kaski nad recepcją czy taczki z roślinami.","Pracownia: <strong>mode:lina<\/strong>. Powierzchnia: 400 m². Branża: budownictwo."],"source":"","officelist_url":null},{"slug":"kws-polska-poznan-2024","company":"KWS Polska","city":"Poznań","year":2024,"designer":"Ktura Architekci (Katarzyna Buczkowska-Grobecka)","area_m2":470,"building":"Giant Office","developer":null,"hero":"https://pliki.propertydesign.pl/i/17/36/25/173625_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/17/36/17/173617_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/36/28/173628_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/36/27/173627_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/36/23/173623_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/36/21/173621_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/36/25/173625_r0_1140.jpg"],"photographer":"FOTOGRAFy","url":"","industry":"Agriculture","award":null,"description_paragraphs":["Firma z sektora rolniczego KWS Polska zajmuje biuro o powierzchni 470 mkw. w poznańskim biurowcu Giant Office. Za projektem wnętrz nowego biura stoi architekt Katarzyna Buczkowska-Grobecka z pracowni Ktura Architekci.","Jak podkreśla autorka projektu, priorytetem przy projektowaniu była możliwie maksymalna ergonomia. Architekt udało się ją osiągnąć poprzez czytelne strefowanie przestrzeni oraz wyposażenie, które zachęca do większego ruchu i mniej siedzącego trybu pracy.","Do dyspozycji pracowników jest przestrzeń do pracy w średnim i wysokim skupieniu, a także pomieszczenia sprzyjające zarówno wyciszeniu, jak i spotkaniom w większym gronie. Istotnym elementem aranżacji wnętrz jest kolor, w tym bogato zastosowana zieleń."],"source":"","officelist_url":"https://www.officelist.pl/oferta/giant-office"},{"slug":"mckinsey-poznan-2024","company":"McKinsey","city":"Poznań","year":2024,"designer":"Trzop Architekci","area_m2":8600,"building":"Nowy Rynek","developer":null,"hero":"http  <strong>mode:lina<\/strong>. Budynek: <strong>Andersia Tower<\/strong>. Powierzchnia: 3 900 m². Branża: sprzęt audio."],"source":"","officelist_url":"https://www.officelist.pl/oferta/andersia-tower"},{"slug":"volkswagen-poznan-2024","company":"Volkswagen","city":"Poznań","year":2018,"designer":"mode:lina","area_m2":500,"building":null,"developer":null,"hero":"https://modelina-architekci.com/wp-content/uploads/2023/03/MA264_Volkswagen_press-3-1920x1282.jpg","gallery":["https://modelina-architekci.com/wp-content/uploads/2023/03/MA264_Volkswagen_press-3-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA264_Volkswagen_press-11-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA264_Volkswagen_press-14-1920x1273.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA264_Volkswagen_press-16-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA264_Volkswagen_press-17-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA264_Volkswagen_press-15-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA264_Volkswagen_press-21-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA264_Volkswagen_press-12-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA264_Volkswagen_press-19-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA264_Volkswagen_press-20-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2023/03/MA264_Volkswagen_press-22-1920x1280.jpg"],"photographer":"Patryk Lewiński","url":"https://modelina-architekci.com/projekty/przestrzenie-biurowe/biuro-volkswagen/","industry":"Transportation","award":null,"description_paragraphs":["Pracownia mode:lina zaprojektowała poznańskie biuro Volkswagena jako ciąg mniejszych „domów” o elewacjach przypominających współczesne budynki modernistyczne.","Pracownicy nie chcieli wracać do dużego open space, ale nie chcieli też zamykać się w zespołach, więc wnętrze zachowało otwarty charakter. W „elewacjach” domów ukryto dużo schowków, a materiały nawiązują do salonu Volkswagen Home w Warszawie.","Pracownia: <strong>mode:lina<\/strong>. Powierzchnia: 500 m². Branża: motoryzacja."],"source":"","officelist_url":null},{"slug":"amadeus-warszawa-2024","company":"AMADEUS","city":"Warszawa","year":2024,"designer":"HUKK.studio","area_m2":null,"building":null,"developer":null,"hero":null,"gallery":null,"photographer":null,"url":"","industry":"IT / travel-tech","award":null,"description_paragraphs":["Biuro polskiego oddziału Amadeus IT Group - globalnego dostawcy technologii dla turystyki.","Pracownia: <strong>HUKK.studio<\/strong>.","Branża najemcy: IT / travel-tech."],"source":"","officelist_url":null},{"slug":"bat-dbs-poland-wow-hub-warszawa-2024","company":"BAT DBS Poland (WOW!Hub)","city":"Warszawa","year":2024,"designer":"The Design Group","area_m2":4000,"building":"P180 (Górny Mokotów)","developer":"Skanska","hero":"https://thedesigngroup.pl/wp-content/uploads/2026/06/10_BAT-43.jpg","gallery":["https://thedesigngroup.pl/wp-content/uploads/2026/06/10_BAT-43.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/14_BAT-38.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/15_BAT-36.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/16_BAT-37.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/17_BAT-35.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/22_BAT-29.jpg"],"photographer":null,"url":"","industry":"FMCG / Tobacco","award":null,"description_paragraphs":["WOW!Hub to biuro BAT DBS w P180 na Górnym Mokotowie, 4000 m² bez przypisanych biurek. Do wyboru są ciche stanowiska, biblioteka, focus roomy, budki telefoniczne i sale konferencyjne. Pracownicy firmy brali udział w projektowaniu.","Wnętrze łączy klasykę z nowoczesnością: ciemne drewno, skóra, granat i chrom, a do tego neonowe hasła i kolory BAT. Przy wejściu są okrągłe siedziska w zieleni, a obok jungle room, pełen roślin i bez elektroniki.","Pracownia: <strong>The Design Group<\/strong>. Budynek: <strong>P180 (Górny Mokotów)<\/strong>. Powierzchnia: 4 000 m²."],"source":"tdg-zgoda-2026-11-05","officelist_url":"https://www.officelist.pl/oferta/p180"},{"slug":"bouygues-immobilier-polska-warszawa-2024","company":"Bouygues Immobilier Polska","city":"Warszawa","year":2024,"designer":"Bit Creative","area_m2":1300,"building":"Rondo 1, Rondo ONZ, Warszawa (24 piętro)","developer":null,"hero":"https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-6.jpg","gallery":["https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-6.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-23.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-22.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-19.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-18.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-17.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-16.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-13.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-11.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-10.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-7.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-3.jpg","https://www.nowymagazyn.pl/wp-content/uploads/2025/01/BIT-CREATIVE_BIP_fot.-Fotomohito-1.jpg"],"photographer":"Fotomohito","url":"","industry":"deweloper","award":null,"description_paragraphs":["W sercu Warszawy, w prestiżowym biurowcu Rondo 1 przy Rondzie ONZ, znajduje się siedziba Bouygues Immobilier Polska - lidera francuskiego rynku nieruchomości. Biuro o powierzchni ponad 1300 m² to nie tylko nowoczesne miejsce pracy, ale także manifest podejścia, w którym ekologia i zrównoważony rozwój odgrywają kluczową rolę. Za koncepcję odpowiadają architekci BIT CREATIVE pod kierownictwem Barnaby Grzeleckiego, którzy połączyli wartości marki w ergonomiczną przestrzeń. Projekt został dopasowany do identyfikacji wizualnej - flagowe odcienie niebieskiego i szarości wpleciono w wystrój. W całej przestrzeni zastosowano zrównoważone materiały z recyklingu o minimalnym śladzie węglowym oraz meble z upcyklingu. Wszechobecne rośliny doniczkowe i żywe ściany zieleni poprawiają jakość powietrza i samopoczucie. Wnętrze podzielono na strefy: reprezentacyjną recepcję, przestrzenie do pracy indywidualnej i zespołowej, sale konferencyjne z multimediami, kameralne salki spotkań oraz strefę socjalną z komfortową kuchnią i strefą relaksu. Zastosowano oświetlenie LED i systemy inteligentnego zarządzania budynkiem."],"source":"","officelist_url":"https://www.officelist.pl/oferta/rondo-1"},{"slug":"business-link-warszawa-2024","company":"Business Link","city":"Warszawa","year":2024,"designer":"Trzop Architekci","area_m2":null,"building":"Studio B","developer":null,"hero":"https://www.trzoparchitekci.pl/storage/2025/01/Fot.-9-1.jpg","gallery":["https://www.trzoparchitekci.pl/storage/2025/01/Fot.-8-1.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-7-1.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-6-1.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-5-1.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-4-1.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-3-1.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-2-1.jpg","https://www.trzoparchitekci.pl/storage/2025/01/Fot.-1-1.jpg"],"photographer":"Stanisław Zajączkowski","url":"","industry":"coworking","award":null,"description_paragra llery":["foto/coface-warszawa-2024/01.jpg","foto/coface-warszawa-2024/02.jpg","foto/coface-warszawa-2024/03.jpg","foto/coface-warszawa-2024/04.jpg","foto/coface-warszawa-2024/05.jpg","foto/coface-warszawa-2024/06.jpg","foto/coface-warszawa-2024/07.jpg","foto/coface-warszawa-2024/08.jpg","foto/coface-warszawa-2024/09.jpg","foto/coface-warszawa-2024/10.jpg","foto/coface-warszawa-2024/11.jpg","foto/coface-warszawa-2024/12.jpg"],"photographer":null,"url":"https://www.brookfield.pl/realizacje/coface","industry":"Finanse","award":null,"description_paragraphs":["Coface, ubezpieczyciel należności obecny na 200 rynkach, sprawdzał przeprowadzkę, ale po warsztatach z menedżerami i ankietach wśród pracowników został w West Station. Biuro zmniejszono do 1 377 m² i przestawiono na pracę hybrydową.","Przy wejściu leży owalny dywan w odcieniach mchu, a na białej ścianie wisi okrągłe logo w zieleni i pomarańczu. Kuchnię wykończono miętowymi frontami i drewnianymi lamelami, przy długiej ławie w kolorze rdzy stoją żółte pufy, a na ścianach rosną panele z mchu. W salach spotkań są fotele w kolorze karmelu i oliwki.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>West Station<\/strong>. Powierzchnia: 1 377 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."],"source":"bp-sharepoint-2026-11-06","officelist_url":null},{"slug":"decerto-warszawa-2024","company":"Decerto","city":"Warszawa","year":2024,"designer":"BIT CREATIVE","area_m2":2137,"building":"Złote Tarasy (widok na kopułę)","developer":"Globalworth Poland","hero":"https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-7.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-14.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-16.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-17.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-21.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-23.jpg","https://www.officelovin.com/wp-content/uploads/2024/05/decerto-office-24.jpg"],"photographer":"Fotomohito","url":"","industry":"Finance / Insurance","award":null,"description_paragraphs":["Biuro Decerto w Warszawie, z widokiem na kopułę Złotych Tarasów, zaprojektowało BIT Creative. Głównym motywem jest miedź zestawiona z szarym betonem.","Lada recepcji ma formę rzeźby ze stali corten i stalowej siatki, a ściany poczekalni pokrywa zieleń. Biuro ma dwie sale konferencyjne na 22 i 10 osób, sześć gabinetów zarządu i pięć pokoi do pracy zespołowej. Pokój socjalny o powierzchni 120 m² urządzono w klubowym stylu, z dużym stołem z litego drewna, bilardem i automatem do gier.","Pracownia: <strong>BIT Creative<\/strong>. Powierzchnia: 2 137 m². Branża: ubezpieczenia."],"source":"","officelist_url":"https://www.officelist.pl/oferta/lumen"},{"slug":"ewl-warszawa-2024","company":"EWL","city":"Warszawa","year":2024,"designer":"Brookfield Partners","area_m2":835,"building":"Miasteczko Orange","developer":null,"hero":"foto/ewl-warszawa-2024/01.jpg","gallery":["foto/ewl-warszawa-2024/01.jpg","foto/ewl-warszawa-2024/02.jpg","foto/ewl-warszawa-2024/03.jpg","foto/ewl-warszawa-2024/04.jpg","foto/ewl-warszawa-2024/05.jpg","foto/ewl-warszawa-2024/06.jpg","foto/ewl-warszawa-2024/07.jpg","foto/ewl-warszawa-2024/08.jpg","foto/ewl-warszawa-2024/09.jpg","foto/ewl-warszawa-2024/10.jpg","foto/ewl-warszawa-2024/11.jpg","foto/ewl-warszawa-2024/12.jpg"],"photographer":null,"url":"","industry":"HR","award":null,"description_paragraphs":["EWL, agencja zatrudnienia, która od lat sprowadza do Polski pracowników z zagranicy, szukała 700 do 800 m² blisko Dworca Zachodniego. Z West Station przeniosła się na trzecie piętro Miasteczka Orange przy Alejach Jerozolimskich 160, na 835 m².","Recepcja to czarna, zaokrąglona lada pod liniowymi lampami, obok jasna sofa. W kuchni nad długim drewnianym stołem z pomarańczowymi krzesłami wiszą rośliny, a na ścianie świeci neon with EWLove. Sala konferencyjna nazywa się po prostu Warszawa, inną oddzielają od korytarza musztardowe zasłony. Podłogi są w jasnym beżu, sufity czarne.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>Miasteczko Orange<\/strong>. Powierzchnia: 835 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."],"source":"bp-sharepoint-2026-11-06","officelist_url":null},{"slug":"fujifilm-warszawa-2024","company":"Fujifilm","city":"Warszawa","year":2024,"designer":"The Design Group","area_m2":1000,"building":"The Park Warsaw","developer":"White Star Real Estate","hero":"https://thedesigngroup.pl/wp-content/uploads/2026/03/01_Fuji-28.jpg","gallery":["https://thedesigngroup.pl/wp-content/uploads/2026/03/01_Fuji-28.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/03/10_Fuji-43.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/03/11_Fuji-44.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/03/12_Fuji-45.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/03/14_Fuji-21.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/03/15_Fuji-50.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/03/17_Fuji-23.jpg"],"photographer":null,"url":"","industry":"Imaging / Tech","award":null,"description_paragraphs":["Biuro Fujifilm w budynku 7 kompleksu The Park Warsaw ma blisko 1000 m² i jest urządzone w stylu japandi. Ze względu na bliskość lotniska trzeba było spełnić ostre przepisy przeciwpożarowe, nie rezygnując z estetyki.","Otwartą przestrzeń dzielą przegrody akustyczne i rośliny. Jest strefa chillout, kuchnia, sale konferencyjne i showroomy z najnowszym sprzętem fotograficznym i medycznym firmy.","Pracownia: <strong>The Design Group<\/strong>. Budynek: <strong>The Park Warsaw<\/strong>. Powierzchnia: 1 000 m²."],"source":"tdg-zgoda-2026-11-05","officelist_url":"https://www.officelist.pl/park-biurowy/the-park-warsaw"},{"slug":"good-morning-studio-dzien-dobry-tvn-warszawa-2024","company":"Good Morning Studio (Dzień Dobry TVN)","city":"Warszawa","year":2024,"designer":"Sikora Interiors","area_m2":350,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-8.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2024/07/sikora-warner-warsaw-office-10.jpg"],"photographer":"Tom Kurek","url":"","industry":"Film / TV","award":null,"description_paragraphs":["Studio programu Dzień Dobry TVN w Warszawie przeszło pełną przebudowę według projektu Sikora Interiors. Powstało jasne, loftowe wnętrze z nowym układem funkcjonalnym.","Studio podzielono na strefy, m.in. kącik informacyjny, kuchnię z zaokrągloną wyspą, część rozmów z dwiema łukowymi sofami, scenę dla artystów i oddzieloną akustycznie charakteryzatornię. Prawie wszystko jest mobilne, łącznie ze sceną i żółtym stołem z regulacją wysokości, więc wnętrze można przearanżować w dziesięć minut.","Pracownia: <strong>Sikora Interiors<\/strong>. Powierzchnia: 350 m². Branża: telewizja."],"source":"","officelist_url":null},{"slug":"hilti-polska-warszawa-2024","company":"Hilti Polska","city":"Warszawa","year":2024,"designer":"AKA Studio","area_m2":null,"building":"Royal Wilanów","developer":"Capital Park","hero":"https://pliki.propertydesign.pl/i/17/85/02/178502_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/17/85/04/178504_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/85/03/178503_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/85/01/178501_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/84/98/178498_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/85/02/178502_r0_1140.jpg"],"photographer":"Celestyna Król","url":"","industry":"Construction tech","award":null,"description_paragraphs":["Nowe biuro Hilti Polska zostało zaprojektowane jako otwarta przestrzeń, w której zastosowano ciekawy zabieg aranżacyjny, symbolicznie dzielący ją na dwie równoległe części. Efekt ten uzyskano dzięki przeniesieniu nieregularnego kształtu budynku na część sufitu i podłogi.","Sufit wraz z instalacjami, w otwartej jego części pomalowano w odcieniu antracytowym, zaczerpniętym z brandbooka. Natomiast biały sufit pełny, okala budynek od strony elewacji. Aby zaakcentować części wspólne np. strefę kawiarni czy recepcję, przełamano ten układ wprowadzając inne materiały na sufitach i podłogach.","Za projektem stoi pracownia AKA Studio. Wspólne przestrzenie do pracy zostały przedzielone miejscami na szybkie spotkania, gdzie znajdziemy m.in. siedzisko w kształcie okręgu. Tapicerowane na żółto, z dobranym kolorystycznie dywanem i stolikiem, stanowi kontrapunkt dla spokojnych szarości. Prywatność akustyczną zapewniają salki spotkań."],"source":"","officelist_url":"https://www.officelist.pl/oferta/royal-wilanow"},{"slug":"hoogwegt-warszawa-2024","company":"Hoogwegt","city":"Warszawa","year":2024,"designer":"BIT Creative","area_m2":767,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-8.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-10.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-13.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-16.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-18.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-19-scaled.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-21.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-22.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-27.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-30.jpg","https://www.officelovin.com/wp-content/uploads/2024/12/hoogwegt-office-31.jpg"],"photographer":null,"url":"","industry":null,"award":null,"description_paragraphs":["Biuro dostawcy produktów mleczarskich Hoogwegt w Warszawie zaprojektowało BIT Creative. Wnętrza spaja granat i litera H z identyfikacji wizualnej firmy.","W wejściu i jednej z sal zawieszono akustyczny sufit z modułów PET z wycięciami, m.in. w kształcie litery H, a w pozostałych częściach wyspy z niebieskiej siatki cięto-ciągnionej i paneli PET. Trzy z czterech sal spotkań można połączyć w jedną salę dla 20 osób.","Pracownia: <strong>BIT Creative<\/strong>. Powierzchnia: 767 m²."],"source":"","officelist_url":null},{"slug":"huuuge-games-warszawa-2024","company":"Huuuge Games","city":"Warszawa","year":2024,"designer":"BIT Creative","area_m2":4500,"building":"The Warsaw HUB","developer":null,"hero": )","area_m2":1700,"building":"Central Point","developer":"Immofinanz","hero":"foto/just-join-it-warszawa-2024/01.jpg","gallery":["foto/just-join-it-warszawa-2024/01.jpg","foto/just-join-it-warszawa-2024/02.jpg","foto/just-join-it-warszawa-2024/03.jpg","foto/just-join-it-warszawa-2024/04.jpg","foto/just-join-it-warszawa-2024/05.jpg","foto/just-join-it-warszawa-2024/06.jpg","foto/just-join-it-warszawa-2024/07.jpg","foto/just-join-it-warszawa-2024/08.jpg","foto/just-join-it-warszawa-2024/09.jpg","foto/just-join-it-warszawa-2024/10.jpg","foto/just-join-it-warszawa-2024/11.jpg","foto/just-join-it-warszawa-2024/12.jpg"],"photographer":"Fotomohito","url":"","industry":"IT recruitment","award":null,"description_paragraphs":["Just Join IT, serwis z ofertami pracy dla branży IT, zajmuje piętra 15 i 16 biurowca Central Point w centrum Warszawy, razem 1 700 m². Biuro zaprojektowało MXCF Architekci, budowa trwała od 2023 do 2024 roku.","Szklane ściany sal mają ramy w kolorze Peach Fuzz, który Pantone w trakcie budowy ogłosił kolorem roku 2024. Do tego stonowana zieleń tapicerowanych paneli akustycznych, drewno w zabudowach, sufity z jasnej wełny drzewnej i surowy żelbet konstrukcji, którego nie zakryto.","Na 16. piętrze połowę przestrzeni oddano na spotkania i szkolenia: sofy, pufy i duży ekran, a obok bar i stół bilardowy. Piętro 15. służy pracy w skupieniu, z salami spotkań i pokojami do pracy w pojedynkę. Przy oknach stoją wysokie lady z widokiem na miasto.","Pracownia: <strong>MXCF Architekci<\/strong> (Marta Chrzanowska, Marcin Ferenc). Inwestor: <strong>Just Join IT<\/strong>. Budynek: <strong>Central Point<\/strong>, piętra 15 i 16. Powierzchnia: 1 700 m². Generalny wykonawca: DM Building. Zdjęcia: Fotomohito."],"source":"mxcf-2026-11-06","officelist_url":"https://www.officelist.pl/oferta/central-point"},{"slug":"keyloop-warszawa-2024","company":"Keyloop","city":"Warszawa","year":2024,"designer":"Massive Design","area_m2":null,"building":null,"developer":null,"hero":"http
