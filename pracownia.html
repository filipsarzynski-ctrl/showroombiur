rookfield.pl/realizacje/energix-polska","industry":"Energia odnawialna","award":null,"source":"bp-sharepoint-2026-11-06","officelist_url":null,"description_paragraphs":["Energix Polska, firma budująca farmy wiatrowe i fotowoltaiczne, chciała biura, które będzie przypominać siedzibę grupy w Izraelu. Znalazła je w Elektrowni Powiśle, w ceglanych murach dawnej elektrowni miejskiej, na 478 m².","Historii nie przykryto. Czerwona cegła została na wierzchu, z recepcji przez okno w czarnej, gęsto dzielonej ramie widać dziedziniec, a stalowe schody prowadzą wzdłuż starego muru. Sale oddzielają ściany ze szkła elektrochromowego, które po wciśnięciu przełącznika zmienia się z przezroczystego w mleczne. Przy dębowym stole w sali zarządu stoją granatowe welurowe krzesła, w kuchni czerwone.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>Elektrownia Powiśle<\/strong>. Powierzchnia: 478 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."]},{"slug":"sni-warszawa-2023","company":"SNI","city":"Warszawa","year":2023,"designer":"Brookfield Partners","area_m2":720,"building":"Gdański Business Center","developer":null,"hero":"foto/sni-warszawa-2023/01.jpg","gallery":["foto/sni-warszawa-2023/01.jpg","foto/sni-warszawa-2023/02.jpg","foto/sni-warszawa-2023/03.jpg","foto/sni-warszawa-2023/04.jpg","foto/sni-warszawa-2023/05.jpg","foto/sni-warszawa-2023/06.jpg","foto/sni-warszawa-2023/07.jpg","foto/sni-warszawa-2023/08.jpg","foto/sni-warszawa-2023/09.jpg","foto/sni-warszawa-2023/10.jpg","foto/sni-warszawa-2023/11.jpg","foto/sni-warszawa-2023/12.jpg"],"photographer":null,"url":"https://www.brookfield.pl/realizacje/sni","industry":"Tech / IT","award":null,"source":"bp-sharepoint-2026-11-06","officelist_url":null,"description_paragraphs":["SNI, dostawca outsourcingu IT, przeniósł się do Gdańskiego Business Center, bo budynek miał najwięcej udogodnień i najlepszy dojazd. Biuro ma 720 m², sale konferencyjne i pokoje do pracy w skupieniu, a jego układ klient rysował razem z architektami.","Sale i pokoje do cichej pracy zamknięto w czarnych stalowych ramach ze szkłem. Po podłodze biegną pasy morskiej wykładziny, które wyznaczają drogę przez biuro. Jest regał z białych prętów obstawiony roślinami, fioletowe sofy w strefie wypoczynku i grafitowe zasłony, którymi można odciąć salę od korytarza.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>Gdański Business Center<\/strong>. Powierzchnia: 720 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."]},{"slug":"tpa-poland-warszawa-2026","company":"TPA Poland","city":"Warszawa","year":2026,"designer":"Brookfield Partners","area_m2":2079,"building":"Wola Center","developer":null,"hero":"foto/tpa-poland-warszawa-2026/01.jpg","gallery":["foto/tpa-poland-warszawa-2026/01.jpg","foto/tpa-poland-warszawa-2026/02.jpg","foto/tpa-poland-warszawa-2026/03.jpg","foto/tpa-poland-warszawa-2026/04.jpg","foto/tpa-poland-warszawa-2026/05.jpg","foto/tpa-poland-warszawa-2026/06.jpg","foto/tpa-poland-warszawa-2026/07.jpg","foto/tpa-poland-warszawa-2026/08.jpg","foto/tpa-poland-warszawa-2026/09.jpg","foto/tpa-poland-warszawa-2026/10.jpg","foto/tpa-poland-warszawa-2026/11.jpg"],"photographer":null,"url":"https://www.brookfield.pl/realizacje/tpa-warszawa","industry":"Konsulting","award":null,"source":"bp-sharepoint-2026-11-06","officelist_url":null,"description_paragraphs":["TPA Poland, firma audytorska i doradcza z sieci Baker Tilly, przez kilka miesięcy porównywała Wola Center z The Form i The Bridge. Ostatecznie została w Wola Center, renegocjowała umowę i przebudowała 2 079 m² tak, żeby dobrze się w nich pracowało i przyjmowało klientów.","Recepcję prowadzi łuk: jasna, falista krawędź sufitu nad drewnianą ladą z lamelami i okrągłe lampy. W dębowej podłodze wycięto pas turkusowej wykładziny, który biegnie w głąb biura. Kuchnia ma szafki z forniru i ciemnozielone kubki na półkach, a w poczekalni stoi zaokrąglona kanapa w kolorze morskiej wody.","Pracownia: <strong>Brookfield Partners<\/strong>. Budynek: <strong>Wola Center<\/strong>. Powierzchnia: 2 079 m². Projekt wnętrz: Jakub Berenson, Magdalena Kozak."]},{"slug":"the-park-krakow-krakow-2022","company":"The Park Kraków","city":"Kraków","year":2022,"designer":"APA Wojciechowski Architekci","area_m2":null,"building":"The Park Kraków","developer":"White Star Real Estate","hero":"foto/the-park-krakow-krakow-2022/01.jpg","gallery":["foto/the-park-krakow-krakow-2022/01.jpg","foto/the-park-krakow-krakow-2022/02.jpg","foto/the-park-krakow-krakow-2022/03.jpg","foto/the-park-krakow-krakow-2022/04.jpg","foto/the-park-krakow-krakow-2022/05.jpg","foto/the-park-krakow-krakow-2022/06.jpg","foto/the-park-krakow-krakow-2022/07.jpg","foto/the-park-krakow-krakow-2022/08.jpg","foto/the-park-krakow-krakow-2022/09.jpg","foto/the-park-krakow-krakow-2022/10.jpg","foto/the-park-krakow-krakow-2022/11.jpg","foto/the-park-krakow-krakow-2022/12.jpg"],"photographer":"mat. APA Wojciechowski","url":"","industry":"Real estate / developer (White Star)","award":null,"source":"apa-zgoda-2026-11-06","officelist_url":null,"description_paragraphs":["The Park Kraków powstaje w Podgórzu, przy ulicach Kuklińskiego i Saskiej, obok stacji Kraków Płaszów i zalewu Bagry. Na pięciu hektarach White Star Real Estate i Cain International planują osiem biurowców, a ponad trzy hektary mają zostać bez samochodów.","Pierwszy budynek, B1, ma fasadę z ciepłej, brązowej cegły i rytm wąskich okien. W lobby na dwie kondygnacje jest ściana z cegły, drewniana podłoga, skórzane fotele i długa, podświetlana ściana z zielenią przy recepcji. Wokół budynków posadzono gęstą zieleń z ławkami, a na parterach mają działać restauracje, sklepy, klub fitness i przedszkole.","Pracownia: <strong>APA Wojciechowski Architekci<\/strong>. Deweloper: <strong>White Star Real Estate<\/strong>, inwestor: Cain International. Zdjęcia: materiały APA Wojciechowski."]}]</script>

<script>
const params = new URLSearchParams(location.search);
const slug = params.get('slug') || params.get('id');

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function getProjectsForStudio(studio, allProjects) {
  // Return full project objects (with description, gallery, etc.)
  const slugs = new Set((studio.projects || []).map(p => p.slug));
  return allProjects.filter(p => slugs.has(p.slug));
}

function renderStudio(studio, allProjects) {
  // Get full projects for richer cards
  const projsBySlug = new Map(allProjects.map(p => [p.slug, p]));
  const studioProjects = (studio.projects || []).map(p => projsBySlug.get(p.slug) || p);

  // Find hero project
  const heroSlug = studio.projects && studio.projects[0] ? studio.projects[0].slug : null;
  const heroP = projsBySlug.get(heroSlug) || studioProjects[0] || {};
  const heroImage = studio.hero || heroP.hero;

  // City breakdown
  const cityCounts = {};
  studioProjects.forEach(p => {
    if (p.city) cityCounts[p.city] = (cityCounts[p.city] || 0) + 1;
  });
  const citiesSorted = Object.entries(cityCounts).sort((a,b) => b[1]-a[1]);

  // Unique buildings
  const buildings = [];
  const seenBld = new Set();
  studioProjects.forEach(p => {
    if (p.building && !seenBld.has(p.building)) {
      seenBld.add(p.building);
      buildings.push({ name: p.building, project: p.company, city: p.city });
    }
  });

  // Sort projects: with hero first, then by year desc
  studioProjects.sort((a, b) => {
    const heroA = a.hero ? 0 : 1, heroB = b.hero ? 0 : 1;

  const buildings = studio.buildings ? studio.buildings.length : 0;
  const industries = studio.industries ? studio.industries.length : 0;
  
  const items = [
    {label:'Realizacje', value: count, sub: 'w bazie magazynu'},
    {label:'Miasta', value: cities.length, sub: cities.slice(0,3).join(' · ')},
    {label:'Lata aktywności', value: years, sub: studio.years ? `${studio.years[1] - studio.years[0]} lat` : ''},

  return `

      <div class="studio-stats-head">Pracownia w liczbach · stan na dziś</div>
      <div class="studio-stats-grid">

}

function pickRelatedStudios(studio, allStudios) {
  if (!allStudios || !studio) return [];
  const others = allStudios.filter(s => s.slug !== studio.slug);
  const studioCities = (studio.cities || (studio.city ? [studio.city] : [])).map(c => (c||'').toLowerCase());
  const studioCount = studio.count || (studio.projects && studio.projects.length) || 0;
  const scored = others.map(s => {
    let score = 0;
    let reason = '';
    const sCities = (s.cities || (s.city ? [s.city] : [])).map(c => (c||'').toLowerCase());
    const cityMatch = sCities.find(c => studioCities.includes(c));
    if (cityMatch) { score += 10; reason = `Miasto · ${cityMatch.charAt(0).toUpperCase()+cityMatch.slice(1)}`; }
    const sCount = s.count || (s.projects && s.projects.length) || 0;
    if (studioCount > 0 && sCount > 0) {
      const ratio = Math.min(sCount/studioCount, studioCount/sCount);
      if (ratio >= 0.5) { score += 5; if (!reason) reason = `Podobna skala · ${sCount} realizacji`; }
    }
    if (sCount >= 10) score += 2;
    return {s, score, reason: reason || (sCities[0] ? `Pracownia · ${sCities[0]}` : 'Pracownia')};
  });
  scored.sort((a,b) => b.score - a.score);
  return scored.slice(0, 4).filter(r => r.score > 0);
}

function renderRelatedStudios(studio, allStudios) {
  const related = pickRelatedStudios(studio, allStudios);
  if (!related.length) return '';
  return `
    <section class="related-studios">
      <div class="rs-wrap">
        <div class="rs-head">
          <div>
            <div class="rs-eyebrow">Inne pracownie</div>

function projCard(p, i) {
  const n = String(i+1).padStart(3, '0');
  const size = (i === 0 ? 'featured' : (i % 5 === 3 ? 'featured' : ''));
  const titleParts = p.company.split(' ');
  let title;
  if (titleParts.length > 1) {
    title = `${esc(titleParts[0])} <em>${esc(titleParts.slice(1).join(' '))}</em>`;
  } else {
    title = esc(p.company);
  }
  const img = p.hero ?
    `<img src="${esc(p.hero)}" loading="${i < 6 ? 'eager' : 'lazy'}" decoding="async" alt="${esc(p.company)} ${esc(p.city)}">` : '';
  const noHero = !p.hero ? ' no-hero' : '';
  const dataAttrs = !p.hero ? ` data-city="${esc(p.city)}" data-year="${p.year || ''}"` : '';

  return `<a class="proj ${size}${noHero}" href="projekt.html?id=${esc(p.slug)}">
    <div class="proj-img"${dataAttrs}>
      ${p.hero ? `<span class="proj-tag">Nr ${n}</span>${img}` : ''}
    </div>
    <div class="proj-num">Nr ${n} / ${p.year || '-'} / ${esc(p.city)}</div>
    <h3 class="proj-title">${title}</h3>
    <div class="proj-meta">
      ${p.industry ? esc(p.industry) : '-'}${p.area_m2 ? ` · ${p.area_m2.toLocaleString('pl-PL').replace(/,/g, ' ')} m²` : ''}
      ${p.building ? `<span class="building">${esc(p.building)}</span>` : ''}
    </div>
  </a>`;
}

function init() {
  let studios = [], projects = [];
  try {
    studios = JSON.parse(document.getElementById('studios-db').textContent || '[]');
    projects = JSON.parse(document.getElementById('projects-db').textContent || '[]');
  } catch (e) {}

  if (!studios.length || !projects.length) {
    Promise.all([
      fetch('_studios_embed.json').then(r => r.json()),
      fetch('_embed_db.json').then(r => r.json())
    ]).then(([s, p]) => mount(s, p)).catch(() => {
      document.getElementById('root').innerHTML = notFound();
    });
  } else {
    mount(studios, projects);
  }
}

function mount(studios, projects) {
  window.__allStudios = studios || [];
  window.__allProjects = projects || [];
  const studio = studios.find(s => s.slug === slug);
  const root = document.getElementById('root');
  if (!studio) { root.innerHTML = notFound(); return; }
  document.title = `${studio.name} - Pracownia - Showroom Biur`;
  // Dynamic OG/meta update
  try {
    const setMeta = (sel, attr, val) => {
      let m = document.querySelector(sel);
      if (!m && val) {
        m = document.createElement('meta');
        const parts = sel.match(/\[([^=]+)="([^"]+)"\]/);
        if (parts) m.setAttribute(parts[1], parts[2]);
        document.head.appendChild(m);
      }
      if (m && val) m.setAttribute(attr, val);
    };
    const heroImg = (studio.projects && studio.projects[0] && studio.projects[0].hero) || 'og-default.jpg';
    const desc = (studio.tagline || studio.description ||
                  `${studio.name} - pracownia projektowa. ${studio.count || studio.projects?.length || 0} realizacji w bazie Showroom Biur.`).substring(0,200);
    setMeta('meta[property="og:title"]', 'content', `${studio.name} - pracownia projektowa`);
    setMeta('meta[property="og:description"]', 'content', desc);
    setMeta('meta[property="og:image"]', 'content', heroImg);
    setMeta('meta[property="og:url"]', 'content', `https://showroombiur.pl/pracownia.html?slug=${studio.slug}`);
    setMeta('meta[property="og:type"]', 'content', 'profile');
    setMeta('meta[name="twitter:title"]', 'content', `${studio.name} - pracownia`);
    setMeta('meta[name="twitter:description"]', 'content', desc);
    setMeta('meta[name="twitter:image"]', 'content', heroImg);
    setMeta('meta[name="description"]', 'content', desc);
    setMeta('link[rel="canonical"]', 'href', `https://showroombiur.pl/pracownia.html?slug=${studio.slug}`);

    const oldLd = document.getElementById('studio-jsonld');
    if (oldLd) oldLd.remove();
    const ld = document.createElement('script');
    ld.type = 'application/ld+json';
    ld.id = 'studio-jsonld';
    ld.textContent = JSON.stringify({
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": studio.name,
      "description": desc,
      "image": heroImg,
      "url": `https://showroombiur.pl/pracownia.html?slug=${studio.slug}`,
      "address": undefined
    });
    document.head.appendChild(ld);
  } catch (e) { console.warn('OG update failed', e); }
  root.innerHTML = renderStudio(studio, projects);

  // === Dynamic SEO/AEO ===
  updateSEO(studio, projects);
}

function updateSEO(studio, allProjects) {
  const BASE = 'https://showroombiur.pl';
  const url = `${BASE}/pracownia.html?id=${studio.slug}`;
  const title = `${studio.name} - polska pracownia workplace design. ${studio.count} realizacji w bazie`;
  const cities = (studio.cities || []).join(', ');
  const yr = studio.years ? `${studio.years[0]}-${studio.years[1]}` : '';
  const description = `${studio.name} - polska pracownia projektowa specjalizująca się w workplace design. ${studio.count} udokumentowanych realizacji biurowych${cities ? ' w ' + cities : ''}${yr ? ' z lat ' + yr : ''}. Pełne portfolio na Showroom Biur.`;
  const image = studio.hero || `${BASE}/og-default.jpg`;

  const setMeta = (id, val) => { const el = document.getElementById(id); if (el) el.setAttribute('content', val); };
  document.getElementById('seoCanonical').setAttribute('href', url);
  setMeta('ogTitle', title); setMeta('ogDescription', description);
  setMeta('ogUrl', url); setMeta('ogImage', image);
  setMeta('twTitle', title); setMeta('twDescription', description); setMeta('twImage', image);

  const descMeta = document.querySelector('meta[name="description"]');
  if (descMeta) descMeta.setAttribute('content', description);

  // Keywords
  let kwMeta = document.querySelector('meta[name="keywords"]');
  if (!kwMeta) {
    kwMeta = document.createElement('meta');
    kwMeta.setAttribute('name', 'keywords');
    document.head.appendChild(kwMeta);
  }
  const tenants = (studio.projects || []).slice(0, 5).map(p => p.company).filter(Boolean);
  const kws = [
    studio.name,
    `pracownia ${studio.name}`,
    `${studio.name} portfolio`,
    `${studio.name} realizacje`,
    ...(studio.cities || []).map(c => `${studio.name} ${c}`),
    ...tenants.map(t => `${studio.name} ${t}`),
    'polska pracownia workplace',
    'projektowanie biur Polska'
  ].filter(Boolean).join(', ');
  kwMeta.setAttribute('content', kws);

  // JSON-LD
  const ORG_PUBLISHER = {"@type":"Organization","@id":`${BASE}/#organization`,"name":"Showroom Biur","url":BASE};
  const PERSON = {"@type":"Person","@id":`${BASE}/#filip-sarzynski`,"name":"Filip Sarzyński","jobTitle":"Wydawca, Redaktor naczelny Showroom Biur"};

  // Studio as Organization
  const studioOrg = {
    "@type":"Organization",
    "@id":`${url}#org`,
    "name":studio.name,
    "url":url,
    "description":description,
    "areaServed":(studio.cities || []).map(c => ({"@type":"City","name":c})),
    "knowsAbout":[
      "Workplace design","Office interior design","Polski rynek biurowy",
      ...(studio.industries || [])
    ],
    "address":false ? {} : undefined,
    "logo": studio.hero ? {"@type":"ImageObject","url":studio.hero} : undefined,
    "image": studio.hero ? [studio.hero] : undefined
  };

  // ItemList of studio's projects
  const itemsList = {
    "@type":"ItemList",
    "@id":`${url}#projects`,
    "name":`${studio.name} - portfolio realizacji`,
    "description":`${studio.count} udokumentowanych realizacji biurowych pracowni ${studio.name}.`,
    "numberOfItems":studio.count,
    "itemListElement": (studio.projects || []).slice(0, 50).map((p, i) => ({
      "@type":"ListItem","position":i+1,
      "url":`${BASE}/projekt.html?id=${p.slug}`,
      "name":`${p.company} - ${p.city}${p.year ? ', ' + p.year : ''}`,
      "image": p.hero || undefined
    }))
  };

  // ProfilePage / CollectionPage
  const profilePage = {
    "@type":"ProfilePage",
    "@id":url,"url":url,
    "name":title,"description":description,
    "isPartOf":{"@id":`${BASE}/#website`},
    "inLanguage":"pl-PL",
    "primaryImageOfPage": studio.hero ? {"@type":"ImageObject","url":studio.hero} : undefined,
    "mainEntity":{"@id":`${url}#org`},
    "breadcrumb":{"@id":`${url}#breadcrumb`}
  };

  // Breadcrumb
  const bc = {
    "@type":"BreadcrumbList","@id":`${url}#breadcrumb`,
    "itemListElement":[
      {"@type":"ListItem","position":1,"name":"Strona główna","item":`${BASE}/biurofilia.html`},
      {"@type":"ListItem","position":2,"name":"Pracownie","item":`${BASE}/biurofilia.html#studios`},
      {"@type":"ListItem","position":3,"name":studio.name,"item":url}
    ]
  };

  const graph = [ORG_PUBLISHER, PERSON, profilePage, studioOrg, itemsList, bc];
  const ldEl = document.getElementById('schemaOrgJsonLd');
  if (ldEl) {
    ldEl.textContent = JSON.stringify({"@context":"https://schema.org","@graph":graph}, null, 2);
  }
}

  document.getElementById('nav').classList.toggle('scrolled', window.scrollY > 20);
});

init();
