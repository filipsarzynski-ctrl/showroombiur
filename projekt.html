<style>
:root {
  --bg: #EFEAE2;
  --bg-deep: #E5DFD3;
  --bone: #F3EFE6;
  --ink: #0F0F0E;
  --ink-soft: #2A2A28;
  --muted: #8B7E6A;
  --muted-soft: #B6AC99;
  --accent: #5E1A26;
  --accent-deep: #7A2433;
  --line: #D9D2C2;
  --paper: #FBF8F2;
  --black: #050505;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); scroll-behavior: smooth; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: 'Inter', -apple-system, sans-serif;
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--accent); color: var(--paper); }

/* --- Top nav --- */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 32px;
  background: rgba(239, 234, 226, 0.85);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid transparent;
  transition: border-color .3s ease;
}
.nav.scrolled { border-bottom-color: var(--line); }
.nav-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px;
  font-weight: 500;
  letter-spacing: -0.01em;
}
.nav-brand em { font-style: italic; color:var(--accent-text,#5E1A26); font-weight: 300; }
.nav-back {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--ink-soft);
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  transition: all .2s ease;
}
.nav-back:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* --- Hero --- */
.hero {
  min-height: 80vh;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0;
  margin-top: 64px;
  background: var(--bg);
}
.hero-image {
  background: linear-gradient(135deg, #2A2A28 0%, #4A4540 50%, #6B5D4A 100%);
  background-size: cover;
  background-position: center;
  min-height: 80vh;
  position: relative;
}
.hero-image::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 60%, rgba(15,15,14,0.4) 100%);
}
.hero-placeholder {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: linear-gradient(135deg, var(--bg-deep) 0%, var(--bg) 50%, var(--bone) 100%);
  text-align: center;
  color: var(--ink-soft);
  padding: 40px;
}
.hero-placeholder .ph-no {
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px; letter-spacing: 0.4em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 32px;
}
.hero-placeholder .ph-city {
  font-family: 'Cormorant Garamond', serif;
  font-size: 64px; line-height: 1; font-weight:500; font-style: italic;
  color: var(--ink); margin-bottom: 20px;
}
.hero-placeholder .ph-year {
  font-family: 'JetBrains Mono', monospace;
  font-size: 14px; color:var(--accent-text,#5E1A26); letter-spacing: 0.25em;
}

.hero-content {
  padding: 80px 60px 60px;
  display: flex; flex-direction: column; justify-content: space-between;
  min-height: 80vh;
  position: relative;
}
.hero-content::before {
  content: '';
  position: absolute; top: 80px; left: 60px;
  width: 60px; height: 1px; background: var(--accent);
}
.hero-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--muted); margin-top: 24px;
}
.hero-eyebrow .accent { color:var(--accent-text,#5E1A26); }
.hero-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(48px, 6vw, 88px);
  line-height: 0.95; font-weight:500;
  margin: 32px 0;
  letter-spacing: -0.02em;
}
.hero-title em { font-style: italic; font-weight: 300; color:var(--accent-text,#5E1A26); }
.hero-tagline {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; line-height: 1.35; font-weight:500; font-style: italic;
  color: var(--ink-soft); max-width: 480px;
  margin-bottom: 32px;
}
.hero-meta {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 8px 24px;
  font-size: 13px;
  margin-top: auto;
  padding-top: 32px;
  border-top: 1px solid var(--line);
}
.hero-meta dt {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--muted); padding-top: 3px;
}
.hero-meta dd { color: var(--ink); font-weight: 500; }

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; }
  .hero-image { min-height: 60vh; }
  .hero-content { padding: 60px 28px 40px; min-height: auto; }
  .hero-placeholder .ph-city { font-size: 44px; }
}

/* --- Body --- */
.body {
  max-width: 880px;
  margin: 0 auto;
  padding: 120px 32px 80px;
}
.body-chapter {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.35em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 32px;
}
.body-h {
  font-family: 'Cormorant Garamond', serif;
  font-size: 36px; font-weight:500; line-height: 1.15;
  margin-bottom: 48px; max-width: 700px;
  letter-spacing: -0.01em;
}
.body-h em { font-style: italic; color:var(--accent-text,#5E1A26); font-weight: 300; }
.body p {
  font-family: 'Cormorant Garamond', serif;
  font-size: 19px; line-height: 1.65;
  color: var(--ink-soft);
  margin-bottom: 28px;
  max-width: 680px;
}
.body p strong { color: var(--ink); font-weight: 500; }
.body p em { color:var(--accent-text,#5E1A26); font-style: italic; }

/* --- Gallery --- */
.gallery-section {
  background: var(--bone);
  padding: 100px 32px;
}
.gallery-head {
  max-width: 1200px; margin: 0 auto 50px;
  display: flex; justify-content: space-between; align-items: end;
  flex-wrap: wrap; gap: 24px;
}
.gallery-head h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 56px; font-weight:500; line-height: 1;
  letter-spacing: -0.02em;
}
.gallery-head h2 em { font-style: italic; color:var(--accent-text,#5E1A26); font-weight: 300; }
.gallery-head .meta {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--muted);
}
.gallery-grid {
  max-width: 1200px; margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 16px;
}
.gallery-item {
  background: var(--bg-deep);
  overflow: hidden;
  min-height: 240px;
}
.gallery-item:nth-child(1) { grid-column: span 4; min-height: 400px; }
.gallery-item:nth-child(2) { grid-column: span 2; min-height: 400px; }
.gallery-item:nth-child(3) { grid-column: span 2; }
.gallery-item:nth-child(4) { grid-column: span 2; }
.gallery-item:nth-child(5) { grid-column: span 2; }
.gallery-item:nth-child(n+6) { grid-column: span 3; }
.gallery-item img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform .8s cubic-bezier(0.2, 0, 0.2, 1);
}
.gallery-item:hover img { transform: scale(1.04); }

@media (max-width: 900px) {
  .gallery-grid { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .gallery-item, .gallery-item:nth-child(n) { grid-column: span 1; min-height: 220px; }
  .gallery-head h2 { font-size: 36px; }
}

/* --- Sidebar info section --- */
.info-section {
  padding: 100px 32px;
  border-top: 1px solid var(--line);
}
.info-wrap {
  max-width: 1200px; margin: 0 auto;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
}
.info-block h3 {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--muted); margin-bottom: 16px;
}
.info-block p {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; line-height: 1.35; font-weight:500;
  color: var(--ink);
}
.info-block p em { font-style: italic; color:var(--accent-text,#5E1A26); }
.info-block .small {
  font-family: 'Inter', sans-serif;
  font-size: 14px; color: var(--muted);
  margin-top: 8px;
}
/* Cross-link to Officelist building page */
.officelist-link {
  display: inline-flex;
  align-items: baseline;
  gap: 10px;
  margin-top: 24px;
  padding: 12px 20px 12px 18px;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink);
  text-decoration: none;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  transition: border-color .25s, color .25s, background .25s, transform .25s;
}
.officelist-link .ol-arrow {
  color:var(--accent-text,#5E1A26);
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px;
  font-style: italic;
  letter-spacing: 0;
  text-transform: none;
  line-height: 1;
  transform: translateY(1px);
  transition: transform .25s;
}
.officelist-link .ol-text em {
  font-family: 'Cormorant Garamond', serif;
  font-style: italic;
  font-size: 13px;
  letter-spacing: 0;
  text-transform: none;
  color:var(--accent-text,#5E1A26);
  font-weight:500;
  margin-left: 2px;
}
.officelist-link:hover {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--paper);
}
.officelist-link:hover .ol-arrow {
  transform: translate(4px, 1px);
  color:var(--accent-text,#5E1A26);
}
.officelist-link:hover .ol-text em {
  color:var(--accent-text,#5E1A26);
}
@media (max-width: 700px) {
  .info-wrap { grid-template-columns: 1fr; gap: 36px; }
  .officelist-link { padding: 10px 16px; font-size: 9px; }
}

/* --- Source + footer --- */
.source-bar {
  background: var(--ink);
  color: var(--paper);
  padding: 60px 32px;
  text-align: center;
}
.source-bar p {
  font-family: 'Inter', sans-serif;
  font-size: 13px; color: var(--muted-soft);
  letter-spacing: 0.05em;
  margin-bottom: 12px;
}
.source-bar a {
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px; font-weight:500; font-style: italic;
  color:var(--accent-text,#5E1A26);
  border-bottom: 1px solid transparent;
  transition: border-color .2s ease;
}
.source-bar a:hover { border-bottom-color: var(--accent); }

.footer-nav {
  padding: 50px 32px;
  display: flex; justify-content: space-between;
  border-top: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted);
}
.footer-nav a { color: var(--ink); }
.footer-nav a:hover { color:var(--accent-text,#5E1A26); }

/* --- Gallery hover indicator --- */
.gallery-item { cursor: zoom-in; position: relative; }
.gallery-item::after {
  content: '+';
  position: absolute; top: 16px; right: 16px;
  width: 32px; height: 32px;
  background: rgba(15,15,14,0.6);
  color: var(--paper);
  font-size: 18px; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  border-radius: 999px;
  opacity: 0;
  transition: opacity .3s ease;
  z-index: 2;
}
.gallery-item:hover::after { opacity: 1; }

/* --- Inline gallery: "see all" toggle --- */
.gallery-toggle {
  display: block;
  margin: 30px auto 0;
  padding: 14px 32px;
  background: var(--ink); color: var(--paper);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
  border-radius: 999px;
  border: 0; cursor: pointer;
  transition: background .2s ease;
}
.gallery-toggle:hover { background: var(--accent); }
.gallery-item.hidden { display: none; }

/* --- LIGHTBOX / CAROUSEL --- */
.lightbox {
  position: fixed; inset: 0;
  background: rgba(5, 5, 5, 0.96);
  z-index: 9999;
  display: none;
  align-items: center; justify-content: center;
  padding: 24px;
}
.lightbox.open { display: flex; }
.lb-stage {
  position: relative;
  width: 100%; height: 100%;
  display: flex; align-items: center; justify-content: center;
}
.lb-img {
  max-width: 92vw; max-height: 86vh;
  width: auto; height: auto;
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
  box-shadow: 0 30px 100px rgba(0,0,0,0.5);
  animation: lbZoom 0.35s cubic-bezier(0.2, 0, 0.2, 1);
}
@keyframes lbZoom {
  from { opacity: 0; transform: scale(0.96); }
  to { opacity: 1; transform: scale(1); }
}
.lb-loading {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  font-family: 'JetBrains Mono', monospace; font-size: 11px;
  color: var(--muted-soft); letter-spacing: 0.3em; text-transform: uppercase;
  pointer-events: none;
  opacity: 0; transition: opacity .15s ease;
}
.lb-loading.show { opacity: 1; }

.lb-close {
  position: fixed; top: 24px; right: 24px;
  width: 48px; height: 48px;
  border-radius: 999px;
  background: rgba(255,255,255,0.08);
  color: var(--paper);
  border: 1px solid rgba(255,255,255,0.15);
  font-size: 22px; line-height: 1; font-weight: 300;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all .2s ease;
  z-index: 10001;
}
.lb-close:hover { background: var(--accent); border-color: var(--accent); transform: rotate(90deg); }

.lb-nav {
  position: fixed; top: 50%; transform: translateY(-50%);
  width: 56px; height: 56px;
  border-radius: 999px;
  background: rgba(255,255,255,0.05);
  color: var(--paper);
  border: 1px solid rgba(255,255,255,0.15);
  font-family: 'Cormorant Garamond', serif;
  font-size: 28px; font-weight:500;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  transition: all .2s ease;
  z-index: 10001;
}
.lb-nav:hover { background: var(--accent); border-color: var(--accent); }
.lb-prev { left: 24px; }
.lb-next { right: 24px; }

.lb-meta {
  position: fixed; bottom: 0; left: 0; right: 0;
  padding: 24px 32px;
  background: linear-gradient(180deg, transparent 0%, rgba(0,0,0,0.6) 100%);
  color: var(--paper);
  display: flex; justify-content: space-between; align-items: end;
  pointer-events: none;
  z-index: 10000;
}
.lb-counter {
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; letter-spacing: 0.3em;
  color: var(--paper);
}
.lb-counter .total { color: var(--muted-soft); margin-left: 6px; }
.lb-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-style: italic; font-weight:500;
  color: var(--paper);
  text-align: right; max-width: 50%;
}
.lb-title .small {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-style: normal;
  font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--muted-soft);
  margin-top: 4px;
}

/* Thumbnail strip */
.lb-thumbs {
  position: fixed; bottom: 0; left: 0; right: 0;
  display: flex; gap: 6px;
  padding: 16px 24px;
  overflow-x: auto;
  background: rgba(5,5,5,0.7);
  backdrop-filter: blur(8px);
  z-index: 10002;
  transform: translateY(100%);
  transition: transform .3s ease;
}
.lightbox.open .lb-thumbs.show { transform: translateY(0); }
.lb-thumb {
  flex: 0 0 80px; height: 56px;
  background: var(--ink-soft);
  overflow: hidden;
  cursor: pointer;
  border: 2px solid transparent;
  transition: border-color .2s ease;
  position: relative;
}
.lb-thumb img {
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0.5;
  transition: opacity .2s ease;
}
.lb-thumb.active { border-color: var(--accent); }
.lb-thumb.active img { opacity: 1; }
.lb-thumb:hover img { opacity: 0.85; }

.lb-thumbs-toggle {
  position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
  padding: 8px 16px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--muted-soft);
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 999px;
  cursor: pointer;
  z-index: 10001;
}
.lb-thumbs-toggle:hover { color: var(--paper); }

.lightbox.open.thumbs-on .lb-meta { padding-bottom: 100px; }
.lightbox.open.thumbs-on .lb-thumbs-toggle { display: none; }

@media (max-width: 700px) {
  .lb-nav { width: 44px; height: 44px; font-size: 22px; }
  .lb-prev { left: 12px; }
  .lb-next { right: 12px; }
  .lb-close { top: 12px; right: 12px; width: 40px; height: 40px; }
  .lb-meta { padding: 16px 18px; flex-direction: column; gap: 8px; align-items: stretch; }
  .lb-title { text-align: left; max-width: none; font-size: 16px; }
}

/* Body lock when lightbox open */
body.lb-open { overflow: hidden; }

/* --- Not-found state --- */
.notfound {
  min-height: 80vh;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  text-align: center;
  padding: 40px;
}
.notfound h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 72px; font-style: italic; font-weight:500;
  margin-bottom: 20px;
}
.notfound p { color: var(--muted); margin-bottom: 32px; }

.related-section{padding:80px 32px 100px;background:var(--bg-deep, #E5DFD3);border-top:1px solid var(--line, #D9D2C2);}
.related-wrap{max-width:1280px;margin:0 auto;}
.related-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:48px;gap:40px;}
.related-head h2{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:clamp(40px,4.5vw,64px);line-height:0.98;letter-spacing:-0.02em;margin:0;}
.related-head h2 em{font-style:italic;color:var(--accent-text,#5E1A26);font-weight:300;}
.related-eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent-text,#5E1A26);margin-bottom:14px;}

/* ============ A11Y + PERFORMANCE LAYER ============ */
/* Reduced motion respect */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .marquee-track { animation: none !important; }
  .h1-split .word { transform: none !important; opacity: 1 !important; }
  .reveal, .reveal-stagger > *, .reveal-stagger { opacity: 1 !important; transform: none !important; }
  .anim-stroke { stroke-dashoffset: 0 !important; }
  .pulse-dot { animation: none !important; }
  .aurora-drift, .orb-drift { animation: none !important; }
}

/* Focus-visible accent ring */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent, #5E1A26) !important;
  outline-offset: 3px !important;
  border-radius: 2px;
}
.contact-btn:focus-visible,
.cta:focus-visible,
.so-search-trigger:focus-visible,
.back-top:focus-visible {
  outline-offset: 4px !important;
}

/* Skip-to-content link */
.skip-link {
  position: absolute;
  top: -100px;
  left: 16px;
  background: var(--ink, #0F0F0E);
  color: var(--paper, #FBF8F2);
  padding: 12px 20px;
  z-index: 9999;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border: 2px solid var(--accent, #5E1A26);
  transition: top 0.2s;
}
.skip-link:focus,
.skip-link:focus-visible {
  top: 16px;
  outline-offset: 0 !important;
}

/* sr-only utility for screen-reader-only text */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

escription_paragraphs":["Warszawskie biuro Michelin nawiązuje do marki obłymi formami przypominającymi opony, a elementy rodem z domu łagodzą jego biurowy charakter.","W otwartej przestrzeni stoją trójkątne biurka, każde z własnym oświetleniem. Między stanowiskami zawieszono huśtawki, a strefa coworkingowa łączy się z kuchnią. Granatowe akcenty w barwach firmy pojawiają się na meblach i ścianach, a panele akustyczne w salach konferencyjnych przypominają ślady bieżnika.","Pracownia: <strong>Colliers Define<\/strong>. Powierzchnia: 1 800 m²."],"source":"","officelist_url":null},{"slug":"mo-t-hennessy-poland-warszawa-2026","company":"Moët Hennessy Poland","city":"Warszawa","year":2026,"designer":"Colliers Define","area_m2":450,"building":null,"developer":null,"hero":"https://officesnapshots.com/wp-content/uploads/2026/02/moet-hennessy-poland-offices-warsaw-10-1200x675.jpg","gallery":["https://officesnapshots.com/wp-content/uploads/2026/02/moet-hennessy-poland-offices-warsaw-10-1200x675.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/moet-hennessy-poland-offices-warsaw-12-1200x800.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/moet-hennessy-poland-offices-warsaw-5-1200x800.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/moet-hennessy-poland-offices-warsaw-11-1200x800.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/moet-hennessy-poland-offices-warsaw-9-800x1200.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/moet-hennessy-poland-offices-warsaw-8-1200x800.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/moet-hennessy-poland-offices-warsaw-6-1200x800.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/moet-hennessy-poland-offices-warsaw-7-800x1200.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/moet-hennessy-poland-offices-warsaw-1-800x1200.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/moet-hennessy-poland-offices-warsaw-1200x800.jpg","https://officesnapshots. iu kolorów i faktur, z myślą o wygodzie użytkowników.","Bazą są biele, kremy i maślane żółcie, uzupełnione granatem, ceglastą czerwienią, bordo i turkusem. Pojawiają się miękkie dywany, tkaniny bouclé, skóra z odzysku i kamień na ścianach. Spora część wolnostojących mebli pochodzi z drugiej ręki.","Pracownia: <strong>HUKK.studio<\/strong>. Powierzchnia: 1 600 m². Branża: usługi żywieniowe."],"source":"","officelist_url":null},{"slug":"tate-and-lyle-lodz-2026","company":"Tate & Lyle","city":"Łódź","year":2026,"designer":"Colliers Define","area_m2":2000,"building":null,"developer":null,"hero":"https://officesnapshots.com/wp-content/uploads/2026/02/tatelyle-offices-lodz-1200x800-compact.jpg","gallery":["https://officesnapshots.com/wp-content/uploads/2026/02/tatelyle-offices-lodz-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/tatelyle-offices-lodz-5-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/tatelyle-offices-lodz-4-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/tatelyle-offices-lodz-9-800x1200-compact.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/tatelyle-offices-lodz-8-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/tatelyle-offices-lodz-6-800x1200-compact.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/tatelyle-offices-lodz-7-960x1200-compact.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/tatelyle-offices-lodz-2-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/tatelyle-offices-lodz-3-1200x900-compact.jpg","https://officesnapshots.com/wp-content/uploads/2026/02/tatelyle-offices-lodz-1-801x1200-compact.jpg"],"photographer":"Adam Grzesik","url":"","industry":null,"award":null,"description_paragraphs":["Łódzkie biuro Tate & Lyle odwołuje się do produktów firmy i do roślinności. Recepcję utrzymano w miękkich, neutralnych barwach, spójnych z oszczędnym stylem otwartych stref.","Sale spotkań mają kolaże ścienne w kolorach i fakturach czekolady, jogurtu i zbóż. Zieleń pojawia się na przegrodach między biurkami, w kuchni i na ścianach roślinnych. Środek biura zajmuje agora z ruchomymi ścianami, w której odbywają się m.in. spotkania kwartalne.","Pracownia: <strong>Colliers Define<\/strong>. Powierzchnia: 2 000 m²."],"source":"","officelist_url":null},{"slug":"atc-cargo-gdynia-2025","company":"ATC CARGO","city":"Gdynia","year":2025,"designer":"HUKK.studio","area_m2":1800,"building":null,"developer":null,"hero":"https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/6985fc93b278ec8af138b55f_Biuro_ATC_HUKK%203.avif","gallery":["https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/6985fd058eb6072fa428232f_Biuro_ATC_HUKK%206.avif","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/6985fd0ec27220bd95081b24_Biuro_ATC_HUKK%207.avif","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/6985fd1505fc7b5b4770966e_Biuro_ATC_HUKK%206-1.avif","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/6985fd1cbc69933d19e61611_Biuro_ATC_HUKK%208.avif","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/6985fd2b2721eb3fab067745_Biuro_ATC_HUKK%209.avif","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/6985fd30b754617975c81bf0_Biuro_ATC_HUKK%2010.avif","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/6985fd348b0e7a9e2a926812_Biuro_ATC_HUKK%2011.avif","https://cdn.prod.website-files.com/6901e7f0b4d1996f2f8d5e84/6985fd7292e2d6a64841629b_Biuro_ATC_HUKK%205.avif"],"photographer":null,"url":"","industry":"logistyka / transport morski","award":null,"description_paragraphs":["Biuro firmy logistycznej w Gdyni o powierzchni 1800 m2. Projekt obejmował warsztaty workplace, test-fit, koncepcję, projekt wykonawczy oraz wayfinding i spacebranding.","Pracownia: <strong>HUKK.studio<\/strong>. Powierzchnia: 1 800 m².","Branża najemcy: logistyka / transport morski."],"source":"","officelist_url":null},{"slug":"msc-poland-mediterranean-shipping-co-gdynia-2025","company":"MSC Poland (Mediterranean Shipping Co.)","city":"Gdynia","year":2025,"designer":"HUKK.studio","area_m2":null,"building":null,"developer":null,"hero":null,"gallery":null,"photographer":null,"url":"","industry":"transport morski / armator","award":null,"description_paragraphs":["Nowa siedziba MSC w Gdyni - projekt biura globalnego armatora kontenerowego.","Pracownia: <strong>HUKK.studio<\/strong>.","Branża najemcy: transport morski / armator."],"source":"","officelist_url":null},{"slug":"medlog-poland-gdynia-2025","company":"Medlog Poland","city":"Gdynia","year":2025,"designer":"HUKK.studio","area_m2":null,"building":null,"developer":null,"hero":null,"gallery":null,"photographer":null,"url":"","industry":"logistyka","award":null,"description_paragraphs":["Biuro spółki logistycznej z grupy MSC w Gdyni.","Pracownia: <strong>HUKK.studio<\/strong>.","Branża najemcy: logistyka."],"source":"","officelist_url":null},{"slug":"ot-logistics-krakow-2025","company":"OT Logistics","city":"Kraków","year":2025,"designer":"Joanna Kłusak (pracownia architektoniczna)","area_m2":null,"building":"Zabytkowy budynek przy Galerii Kazimierz","developer":null,"hero":"https://pliki.propertydesign.pl/i/20/80/71/208071_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/20/80/57/208057_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/55/208055_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/56/208056_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/59/208059_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/60/208060_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/58/208058_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/61/208061_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/62/208062_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/64/208064_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/63/208063_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/66/208066_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/67/208067_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/71/208071_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/74/208074_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/75/208075_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/76/208076_r0_1140.jpg"],"photographer":"Tomasz Prokop","url":"","industry":"Logistics / Ports","award":null,"description_paragraphs":["W zaledwie trzy miesiące architektka Joanna Kłusak przekształciła surową przestrzeń zabytkowego budynku przy Galerii Kazimierz w funkcjonalne, nastrojowe biuro OT Logistics. Projekt harmonijnie łączy portowe DNA firmy z charakterem miejsca, tworząc przestrzeń wspierającą codzienną pracę zespołu.","W centrum krakowskiego Kazimierza, w historycznym budynku objętym ochroną konserwatorską, powstała nowa siedziba firmy OT Logistics. Za projekt odpowiada architektka Joanna Kłusak, która w zaledwie trzy miesiące przekształciła surową przestrzeń w przemyślane, funkcjonalne i nastrojowe biuro.","## Biuro, które pracuje razem z zespołem","Zabytkowy obiekt przy Galerii Kazimierz - jego ceglane elewacje, zachowane historyczne okna, balustrady i surowe, betonowe stropy - stał się największą inspiracją dla architektki. Recepcja prowadzi do sali konferencyjnej, gabinetu prezesa oraz gabinetu zarządu, a także dalej do stref pracowniczych: open space'u, pokoi biurowych i pomieszczeń wspólnych.","## Styl z portowym DNA","Wnętrza subtelnie nawiązują do działalności firmy, która operuje portami w Świnoujściu i Gdyni. W gabinetach pojawiły się grafiki i fototapety z planami portów. Styl loftowy, zmiękczony tekstyliami i ciepłym drewnem, dopełnia wnętrza.","Nieoczywistym akcentem jest zieleń. Żywe rośliny pojawiają się w całym biurze, a dwie zielone ściany - w recepcji i gabinecie prezesa. Część strefy open space została wizualnie oddzielona stalową konstrukcją z roślinami, uzupełnioną o huśtawkę i ławeczkę.","## Światło wspierające funkcję i estetykę"],"source":"","officelist_url":null},{"slug":"vercom-s-a-and-cyber-folks-krakow-2025","company":"Vercom S.A. & cyber_Folks","city":"Kraków","year":2025,"designer":"Flamaster (Agata Plackowska)","area_m2":477,"building":"Quattro Business Park","developer":null,"hero":"https://pliki.propertydesign.pl/i/22/39/54/223954_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/22/39/56/223956_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/39/55/223955_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/39/59/223959_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/39/58/223958_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/39/57/223957_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/39/61/223961_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/39/91/223991_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/40/00/224000_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/40/03/224003_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/40/12/224012_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/40/13/224013_r0_1140.jpg"],"photographer":"Marta Behling (Pion Poziom Fotografia)","url":"","industry":"IT / SaaS","award":null,"description_paragraphs":["Krakowska siedziba Vercom S.A. i cyber_Folks została zaprojektowana tak, by wspierać pracę głęboką i ograniczać przebodźcowanie. Zamiast klasycznego open space'u postawiono na kameralne strefy, akustykę i biophilic design.","W krakowskiej siedzibie Vercom S.A. i cyber_Folks o powierzchni 477 mkw., nadrzędnym celem było stworzenie środowiska wspierającego pracę głęboką i redukującego przebodźcowanie, co jest kluczowym wyzwaniem w branży IT.","## Funkcja przed estetyką: biuro bez open space'u","W projekcie świadomie zrezygnowano z klasycznego open space'u na rzecz mniejszych, bardziej kameralnych stref, co pozwoliło ograniczyć zarówno hałas, jak i wizualny chaos. Postawiono na biophilic design - naturalne drewno, łagodną paletę barw i rozbudowaną roślinność.","## Re-use i racjonalny budżet","W realizacji zastosowano zasadę re‑use, wykorzystując istniejące, wysokiej klasy szklane ścianki działowe pozostałe po wcześniejszej aranżacji oddziału banku. Oszczędności przekierowano na customowe elementy stolarskie oraz zaawansowane rozwiązania akustyczne.","## Neuroinkluzywność i praca hybrydowa","W projekcie stworzono zestaw przemyślanych „magnesów\", które mają przyciągać zespół do biura. Jednym z nich jest wielofunkcyjna sala do jogi i regeneracji, która dzięki mobilnym meblom pełni rolę sali konferencyjnej. Centralnym punktem biura stał się Social Hub - kuchnia jako centrum networkingu."],"source":"","officelist_url":"https://www.officelist.pl/oferta/quattro-business-park"},{"slug":"auchan-polska-piaseczno-2025","company":"Auchan Polska","city":"Piaseczno","year":2025,"designer":"Tétris Poland (Sylwia Drążkiewicz-Kuczyńska, Aleksandra Wyczółkowska-Gajowniczek)","area_m2":770,"building":"Centrum logistyczne / siedziba","developer":null,"hero":"https://pliki.propertydesign.pl/i/22/16/17/221617_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/22/15/84/221584_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/86/221586_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/82/221582_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/80/221580_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/81/221581_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/83/221583_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/85/221585_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/87/221587_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/88/221588_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/16/17/221617_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/16/18/221618_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/16/19/221619_r0_1140.jpg"],"photographer":"Szymon Polański","url":"","industry":"Retail","award":null,"description_paragraphs":["Biura w obiektach logistycznych mogą być nowoczesne i komfortowe. Przykładem jest nowa siedziba Auchan powstała przy niedawno otwartym centrum dystrybucyjnym Auchan w Wilczej Górze.","Eksperci Tétris Poland, spółki z grupy JLL, oddają nowe biuro o powierzchni niemal 800 m kw. zrealizowane dla firmy Auchan. Biuro powstało w ramach kompleksowej realizacji projektu Build-to-Suit (BTS).","## Nowy standard biur przy obiektach magazynowych","Biuro Auchan ma około 770 m kw. powierzchni biurowej na dwóch poziomach. Zaplanowano tu blisko 40 stanowisk pracy oraz pięć sal spotkań. Na poziomie 0 stworzono strefę recepcyjną oraz kantynę. Poziom 2 obejmuje gabinety, biura wieloosobowe, strefę dyrektorską oraz coffee point ze strefą chillout.","## Komfort pracy","Projektanci zastosowali wykładzinę dywanową, szklane ścianki o wysokich parametrach akustycznych oraz dedykowane filcowe elementy akustyczne. Punktem wyjścia była identyfikacja wizualna marki Auchan - czerwień i zieleń, zestawione z odcieniami beżu, bordo oraz jasnym drewnem.","Szczególną rolę odgrywa kantyna, zaprojektowana jako serce obiektu z płytkami ściennymi w niebanalnych układach i okrągłymi wyspami sufitowymi.","W przestrzeniach biurowych zastosowano wykładzinę dywanową o niskim śladzie węglowym, z ponad 53-procentowym udziałem materiałów z recyklingu, oraz energooszczędne oświetlenie LED."],"source":"","officelist_url":null},{"slug":"mjg-poznan-2025","company":"MJG","city":"Poznań","year":2025,"designer":"mode:lina","area_m2":620,"building":"ul. Wujka 9, Poznań","developer":null,"hero":"https://d5mag.com/wp-content/uploads/2025/11/MA449_W9_press-12.jpg","gallery":["https://d5mag.com/wp-content/uploads/2025/11/MA449_W9_press-12-1600x1067.jpg"],"photographer":"Patryk Lewiński","url":"","industry":null,"award":null,"description_paragraphs":["Biuro współdzielone trzech spółek: MJG, INDEX FOOD i VININOVA. Lipiec 2025. ul. Wujka 9, Poznań, 620 m².","Włoska atmosfera w poznańskim biurowcu - łuki, wino na półkach, blaty z marmuru.","Za projektem stoi <strong>mode:lina<\/strong> - poznańska pracownia znana z tematycznych, narracyjnych biur dla firm technologicznych i agencji."],"source":"","officelist_url":null},{"slug":"ace-of-space-globalworth-warszawa-2025","company":"Ace of Space (Globalworth)","city":"Warszawa","year":2025,"designer":"Globalworth in-house","area_m2":null,"building":"Portfel Globalworth (~580 tys. mkw.)","developer":"Globalworth","hero":"https://pliki.propertydesign.pl/i/19/90/40/199040_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/19/90/40/199040_r0_1140.jpg"],"photographer":null,"url":"","industry":"Coworking / Flex","award":null,"description_paragraphs":["Rynek elastycznych powierzchni biurowych wciąż dynamicznie się rozwija. Elastyczne powierzchnie biurowe stały się integralną częścią rynku biurowego.","## Dynamiczny rozwój rynku elastycznych przestrzeni biurowych w Warszawie","Rok 2024 był wyjątkowo dynamiczny dla warszawskiego rynku elastycznych przestrzeni biurowych. Operatorzy w Warszawie wynajęli 28 600 m kw. w 16 lokalizacjach. Najbardziej aktywnym graczem był The Shire - Beyond Coworking. Na koniec roku stolica oferowała blisko 205 000 m kw. powierzchni coworkingowej w 85 lokalizacjach.","## Ace of Space - nowy operator Globalworth","Ace of Space - operator należący do Globalworth - wnosi do rynku unikalne know-how wynikające z synergii między operatorem a właścicielem nieruchomości. Globalworth zarządza portfelem obiektów w największych polskich miastach oferując prawie 580 tys. m kw. powierzchni najmu. Operator dysponuje doświadczeniem w projektowaniu i dostarczaniu nowoczesnych powierzchni biurowych.","## Korporacje polubiły biura serwisowane","Biura serwisowane stanowią atrakcyjną opcję dla małych, średnich i dużych przedsiębiorstw. Coraz bogatsza oferta przyciąga firmy z różnych sektorów: IT, finansów, mediów, logistyki czy cyberbezpieczeństwa."],"source":"","officelist_url":null},{"slug":"axpo-polska-warszawa-2025","company":"Axpo Polska","city":"Warszawa","year":2025,"designer":"BIT Creative","area_m2":1484,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-1.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-4.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-5.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-6.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-8.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-9.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-10.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-11.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-12.jpg"],"photographer":"Fotomohito","url":"","industry":null,"award":null,"description_paragraphs":["Biuro Axpo Polska na 25. piętrze warszawskiego wieżowca zaprojektowało BIT Creative. Wnętrze nawiązuje do energii i zrównoważonego rozwoju, z naturalnym drewnem, mchem i dużą ilością zieleni.","Siedem sal konferencyjnych poświęcono różnym źródłom energii: w sali Solar stół wykonano z paneli fotowoltaicznych, w Hydro z drewna i niebieskiej żywicy, a w salach Small Wind i Big Wind pod falistymi sufitami wiszą lampy w kształcie łopat turbin. W biurze jest też sześć pokoi do cichej pracy, kuchnia z jadalnią i kącik do ćwiczeń.","Pracownia: <strong>BIT Creative<\/strong>. Powierzchnia: 1 484 m²."],"source":"","officelist_url":null},{"slug":"bat-dbs-poland-faza-ii-wow-hub-warszawa-2025","company":"BAT DBS Poland - faza II (WOW!Hub)","city":"Warszawa","year":2025,"designer":"The Design Group","area_m2":4000,"building":"P180, ul. Puławska 180","developer":null,"hero":"https://pliki.propertydesign.pl/i/17/49/69/174969_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/17/49/67/174967_1140.jpg","https://pliki.propertydesign.pl/i/17/49/73/174973_1140.jpg","https://pliki.propertydesign.pl/i/17/49/64/174964_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/49/51/174951_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/49/66/174966_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/49/53/174953_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/49/45/174945_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/49/46/174946_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/49/52/174952_r0_1140.jpg","https://pliki.propertydesign.pl/i/17/49/55/174955_r0_1140.jpg"],"photographer":"mat. prasowe (press materials)","url":"","industry":"FMCG / tobacco services","award":null,"description_paragraphs":["Druga faza biura WOW!Hub - reprezentacyjna recepcja, elastyczna przestrzeń eventowo-szkoleniowa, kuchnia i strefy wspólne wspierające dialog i kulturę firmy.","Pracownia: <strong>The Design Group<\/strong>. Lokalizacja: <strong>P180, ul. Puławska 180<\/strong>. Powierzchnia: 4 000 m².","Branża najemcy: FMCG / tobacco services."],"source":"","officelist_url":"https://www.officelist.pl/oferta/p180"},{"slug":"beiersdorf-polska-nivea-warszawa-2025","company":"Beiersdorf Polska (Nivea)","city":"Warszawa","year":2025,"designer":"Trzop Architekci","area_m2":340,"building":"Varso Tower (37. piętro)","developer":"HB Reavis","hero":"https://pliki.propertydesign.pl/i/20/82/30/208230_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/20/82/35/208235_1140.jpg"],"photographer":"Tétris Poland (mat. prasowe)","url":"","industry":"Cosmetics / FMCG","award":null,"description_paragraphs":["Beiersdorf Polska ma nową przestrzeń biurową w najwyższym budynku UE. Zaglądamy do siedziby producenta kosmetyków Nivea.","Firma Tétris Poland zakończyła realizację przestrzeni biurowej dla Beiersdorf Polska na 37. piętrze wieżowca Varso Tower w Warszawie. Ta przestrzeń o powierzchni 340 m² łączy funkcjonalność z eleganckim designem inspirowanym charakterem działalności tego producenta kosmetyków, m.in. marki NIVEA.","Projekt koncepcyjny został przygotowany przez pracownię Trzop Architekci. Realizacja odbyła się na zlecenie HB Reavis, zarządcy budynku Varso, pod nadzorem JLL.","W projekcie uwzględniono 21 stanowisk pracy oraz trzy sale konferencyjne mogące pomieścić łącznie 26 osób. Dwie sąsiadujące sale można łączyć w jedną większą przestrzeń spotkań.","Biuro charakteryzuje się innowacyjnym podejściem do przestrzeni wspólnych - zamiast tradycyjnej recepcji zastosowano przestrzeń z komfortowymi kanapami i stanowiskami hot desk. Pracownicy mają do dyspozycji focus room, budkę telefoniczną, kuchnię oraz copy point.","Najbardziej reprezentatywną częścią projektu jest strefa wejściowa z podświetlaną gablotą eksponującą produkty brandowe oraz podświetlanym logo. Wyjątkowe rozwiązania obejmują niszę wejściową w formie łuku z podświetlanymi kanapami oraz oryginalne płytki w kształcie gorsecików nad blatem kuchennym.","Biuro wyróżnia się niebieskim natryskowym malowaniem instalacji i sufitu w ciągu komunikacyjnym, nawiązującym do barw firmowych marki. Realizacja podporządkowana była wymogom certyfikacji BREEAM."],"source":"","officelist_url":"https://www.officelist.pl/oferta/varso-tower"},{"slug":"bouygues-immobilier-warszawa-2025","company":"Bouygues Immobilier","city":"Warszawa","year":2025,"designer":"BIT Creative","area_m2":null,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/01/bouygues-office-warsaw-2.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/01/bouygues-office-warsaw-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/01/bouygues-office-warsaw-5.jpg","https://www.officelovin.com/wp-content/uploads/2025/01/bouygues-office-warsaw-6.jpg","https://www.officelovin.com/wp-content/uploads/2025/01/bouygues-office-warsaw-13.jpg","https://www.officelovin.com/wp-content/uploads/2025/01/bouygues-office-warsaw-14.jpg","https://www.officelovin.com/wp-content/uploads/2025/01/bouygues-office-warsaw-15.jpg","https://www.officelovin.com/wp-content/uploads/2025/01/bouygues-office-warsaw-19.jpg","https://www.officelovin.com/wp-content/uploads/2025/01/bouygues-office-warsaw-25.jpg","https://www.officelovin.com/wp-content/uploads/2025/01/bouygues-office-warsaw-28.jpg","https://www.officelovin.com/wp-content/uploads/2025/01/bouygues-office-warsaw-30.jpg"],"photographer":"Fotomohito","url":"","industry":null,"award":null,"description_paragraphs":["Warszawskie biuro dewelopera Bouygues Immobilier urządzono w barwach firmy, z naciskiem na materiały z recyklingu i dużą ilość roślin.","Wykorzystano odnowione meble, zielone ściany i oświetlenie LED. Biuro podzielono na reprezentacyjną recepcję, strefy pracy indywidualnej i zespołowej, sale konferencyjne za szklanymi ścianami oraz część socjalną z kuchnią.","Pracownia: <strong>BIT Creative<\/strong>."],"source":"","officelist_url":null},{"slug":"cd-projekt-red-warszawa-2025","company":"CD Projekt RED","city":"Warszawa","year":2025,"designer":"MXCF Architekci (Marta Chrzanowska, Marcin Ferenc)","area_m2":4000,"building":"Nowy budynek na kampusie przy ul. Jagiellońskiej (proj. Medusa Group)","developer":"CD Projekt SA","hero":"https://pliki.propertydesign.pl/i/21/54/00/215400_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/21/53/92/215392_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/54/00/215400_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/94/215394_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/93/215393_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/96/215396_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/95/215395_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/97/215397_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/98/215398_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/99/215399_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/54/01/215401_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/54/02/215402_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/54/03/215403_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/54/04/215404_r0_1140.jpg"],"photographer":"Nate Cook Photography","url":"","industry":"Gaming / Tech","award":null,"description_paragraphs":["Tak wygląda nowe biuro CD Projekt RED w Warszawie. Wnętrza projektu MXCF Architekci to elastyczna przestrzeń z nawiązaniami do poprzemysłowej okolicy, dużo zieleni i intensywnie czerwona klatka schodowa.","W czerwcu 2025 r. CD Projekt RED, producent gier video Wiedźmin i Cyberpunk 2077, otworzył swoją nową siedzibę - powstały według projektu Medusa Group budynek zlokalizowany w kampusie firmy przy ul. Jagiellońskiej w Warszawie. Na pięciu kondygnacjach mieszczą się wnętrza biurowe spod kreski pracowni MXCF Architekci.","## W centrum uwagi biura... klatka schodowa","Projekt objął aranżację 4000 mkw. powierzchni biurowej z 320 stanowiskami pracy na piętrach 1-5. Kondygnacje biurowe zostały połączone intensywnie czerwoną stalową klatką schodową, która jest jednocześnie punktem rozpoznawczym i łącznikiem między zespołami.","## Przestrzeń przyjazna pracownikom","Modułowa aranżacja podąża za rytmem konstrukcji budynku. Kondygnacje podzielone są na biura zespołów, rozdzielone kubikami zawierającymi sale spotkań i cichej pracy. Każda kondygnacja podzielona na cztery ćwiartki - biura open space.","## Naturalne materiały i dużo zieleni","Zadbano o akustykę: sufity i panele perforowane, natrysk akustyczny z celulozy z recyklingu, ogromną ilość zieleni. Materiały wykończeniowe: sklejka, listwy drewniane, wełniane tapicerki."],"source":"","officelist_url":null},{"slug":"clyde-and-co-warszawa-2025","company":"Clyde & Co","city":"Warszawa","year":2025,"designer":"Trzop Architekci","area_m2":null,"building":"The Form","developer":null,"hero":"https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_005_90062.jpg","gallery":["https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_007_9017.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_009_9023.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_010_9025.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_011_9118.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_012_9032.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_013_9034.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_015_9061.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_017_9067.jpg"],"photographer":"fotomohito","url":"","industry":"usługi prawne","award":null,"description_paragraphs":["Biuro kancelarii Clyde & Co w The Form. Modernistyczne inspiracje warszawskimi kamienicami z lat 30. Lada recepcyjna z kamienia z poprzedniej lokalizacji, ręcznie formowane kafle z Nakomiad, fotele Egg Arne Jacobsena.","Pracownia: <strong>Trzop Architekci<\/strong>. Lokalizacja: <strong>The Form<\/strong>. Fotografia: <em>fotomohito<\/em>.","Branża najemcy: usługi prawne."],"source":"","officelist_url":"https://www.officelist.pl/oferta/the-form"},{"slug":"doraco-warszawa-2025","company":"Doraco","city":"Warszawa","year":2025,"designer":"Pik Studio","area_m2":1000,"building":"Saski Crescent (ul. Królewska)","developer":null,"hero":"https://pliki.propertydesign.pl/i/21/08/83/210883_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/21/08/72/210872_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/75/210875_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/74/210874_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/76/210876_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/71/210871_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/73/210873_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/77/210877_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/79/210879_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/81/210881_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/78/210878_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/82/210882_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/80/210880_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/83/210883_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/84/210884_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/85/210885_r0_1140.jpg"],"photographer":"Pik Studio (mat. prasowe)","url":"","industry":"Construction / GC","award":null,"description_paragraphs":["Na siódmym piętrze z widokiem na Park Saski i ul. Marszałkowską w Warszawie powstało nowe biuro firmy Doraco. Za projekt odpowiada Pik Studio, które postawiło na funkcjonalizm, naturalne materiały i futurystyczne detale.","Nowe biuro Doraco mieści się w świeżo wyremontowanym budynku Saski Crescent przy ul. Królewskiej w Warszawie. Za projekt biura odpowiada warszawska pracownia Pik Studio.","## Nowoczesne biuro Doraco z widokiem na Warszawę","Nowa przestrzeń biurowa Doraco o pow. 1 tys. mkw. zajmuje całe siódme piętro. Z okien biura widać Park Saski i ul. Marszałkowską.","„Naszą główną ideą w projekcie był funkcjonalizm. Na wejściu ustawiliśmy recepcję główną z miejscem odpoczynku dla klienta. Tutaj mamy także część konferencyjną, tak żeby klient nie musiał wchodzić do części prywatnej biura\" - opowiada Kuba Kasprzak.","W biurze postawiono na stonowaną kolorystykę i naturalne materiały. Dominującym akcentem jest drewno orzecha amerykańskiego, które nadaje wnętrzu ciepła i prestiżu.","W nowym biurze znalazła się futurystyczna lada ze stali nierdzewnej, sufit akustyczny ułożono w jodełkę, zaś słupy konstrukcyjne budynku obłożone zostały zielenią. W gabinetach prezesowskich postawiono na indywidualne projekty mebli w futurystycznych kształtach."],"source":"","officelist_url":"https://www.officelist.pl/oferta/saski-crescent"},{"slug":"dr-gerard-adam-foods-warszawa-2025","company":"Dr Gerard (Adam Foods)","city":"Warszawa","year":2025,"designer":"Abundo Space (Małgorzata Kopyt)","area_m2":null,"building":null,"developer":null,"hero":"https://pliki.propertydesign.pl/i/22/45/32/224532_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/22/45/07/224507_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/08/224508_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/09/224509_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/10/224510_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/12/224512_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/11/224511_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/14/224514_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/13/224513_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/15/224515_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/16/224516_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/18/224518_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/17/224517_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/19/224519_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/21/224521_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/22/224522_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/30/224530_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/31/224531_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/32/224532_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/35/224535_r0_1140.jpg"],"photographer":"Abundo Space","url":"","industry":"FMCG / Confectionery","award":null,"description_paragraphs":["Dr Gerard to jedna z najbardziej rozpoznawalnych marek słodyczy w Polsce, należąca do Grupy Adam Foods. Firma postanowiła odmienić biuro w Warszawie.","Pod koniec zeszłego roku pracownia Abundo Space zakończyła projekt rearanżacji przestrzeni biurowej w Warszawie dla firmy Dr Gerard.","## Rearanżacja biura: architektura, która prowadzi","Już od wejścia uwagę przyciąga dynamiczna, płynąca linia posadzki. Organiczne formy w odcieniu czerwieni - kolorze silnie związanym z identyfikacją wizualną Dr Gerard - wyznaczają naturalne ciągi komunikacyjne i porządkują przestrzeń. Kontrast czerwieni z ciepłymi szarościami i beżami buduje energetyczny, ale zrównoważony charakter wnętrza.","## Komfort akustyczny","Zastosowano kompleksowe rozwiązania: wykładziny dywanowe o wysokich parametrach pochłaniania, tapicerowane meble, panele ścienne redukujące pogłos, sufity podwieszane z elementami akustycznymi, zasłony akustyczne, panele biurkowe oraz mobilne ścianki.","## Przytulne biuro zamiast „korporacyjnego\" chłodu","Wnętrze ocieplają naturalne materiały, drewno, miękkie formy foteli, stonowana kolorystyka oraz nastrojowe oświetlenie. Subtelnie podświetlane witryny eksponują produkty marki."],"source":"","officelist_url":null},{"slug":"estetyczna-grupa-warszawa-2025","company":"Estetyczna Grupa","city":"Warszawa","year":2025,"designer":"Art'Up Interiors","area_m2":null,"building":null,"developer":null,"hero":"https://officesnapshots.com/wp-content/uploads/2025/10/estetyczna-grupa-offices-warsaw-5-1200x801-compact.jpg","gallery":["https://officesnapshots.com/wp-content/uploads/2025/10/estetyczna-grupa-offices-warsaw-5-1200x801-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/10/estetyczna-grupa-offices-warsaw-9-1200x801-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/10/estetyczna-grupa-offices-warsaw-4-1200x801-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/10/estetyczna-grupa-offices-warsaw-8-1200x801-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/10/estetyczna-grupa-offices-warsaw-857x1200-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/10/estetyczna-grupa-offices-warsaw-6-1200x801-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/10/estetyczna-grupa-offices-warsaw-1-800x1200-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/10/estetyczna-grupa-offices-warsaw-2-1200x801-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/10/estetyczna-grupa-offices-warsaw-3-1200x801-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/10/estetyczna-grupa-offices-warsaw-7-1200x801-compact.jpg"],"photographer":"Ład Studio","url":"","industry":null,"award":null,"description_paragraphs":["Siedziba Estetycznej Grupy pod Warszawą to projekt Piotra Łucyana z Art'Up Interiors. Wnętrza odwołują się do modernizmu i stylu lat 60., z fornirami, kamieniem i skórą.","Lobby wyłożono boazerią z wędzonego dębu, a niska, zaokrąglona lada recepcji nawiązuje do przedwojennego modernizmu. Na ścianie wiszą zegary Star George'a Nelsona, pokazujące czas na głównych rynkach firmy. Część dla pracowników ma jaśniejsze kolory, oszczędne meble, sztukę i rośliny, a gabinet prezesa urządzono według osobistych upodobań inwestora.","Pracownia: <strong>Art'Up Interiors<\/strong>."],"source":"","officelist_url":null},{"slug":"greenberg-traurig-warszawa-2025","company":"Greenberg Traurig","city":"Warszawa","year":2025,"designer":"BIT Creative","area_m2":4459,"building":"Varso Tower","developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-7.jpg","https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-11.jpg","https://www.officelovin.com/wp-content/uploads/2025/06/greenberg-office-13.jpg"],"photographer":"Fotomohito","url":"","industry":"Prawo","award":null,"description_paragraphs":["Kancelaria Greenberg Traurig zajmuje biuro w Varso Tower zaprojektowane przez BIT Creative. Wnętrza łączą kamień, drewno i miedź ze sztuką współczesną.","Strefa wejściowa łączy recepcję, sale konferencyjne i punkt kawowy, a dzięki mobilnemu wyposażeniu służy też do organizacji wydarzeń. Z okien widać panoramę Warszawy z iglicą Pałacu Kultury. W części biurowej przeważają zamknięte gabinety jedno- i dwuosobowe, uzupełnione miejscami do wspólnej pracy.","Pracownia: <strong>BIT Creative<\/strong>. Budynek: <strong>Varso Tower<\/strong>. Powierzchnia: 4 459 m². Branża: prawo."],"source":"","officelist_url":"https://www.officelist.pl/oferta/varso-tower"},{"slug":"kraft-heinz-warszawa-2025","company":"Kraft Heinz","city":"Warszawa","year":2025,"designer":"Workplace","area_m2":1027,"building":"Harmony Office Park","developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/05/kraft-heinz-office-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/05/kraft-heinz-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2025/05/kraft-heinz-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/05/kraft-heinz-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2025/05/kraft-heinz-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2025/05/kraft-heinz-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2025/05/kraft-heinz-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2025/05/kraft-heinz-office-7.jpg"],"photographer":"Adam Grzesik","url":"","industry":"Food & Beverage","award":null,"description_paragraphs":["Warszawskie biuro Kraft Heinz zajmuje półtora piętra w Harmony Office Park. Pracownia Workplace oparła projekt na identyfikacji marki i ponownie wykorzystała część wyposażenia z poprzedniej siedziby.","Czwarte piętro przeznaczono na stanowiska pracy, a piąte na funkcje wspólne, m.in. sale spotkań, kuchnię pokazową, studio fotograficzne i salę wydarzeń z ruchomymi ścianami. Paleta opiera się na jasnym beżu z akcentami w kolorach marki, a w recepcji ustawiono gabloty z butelkami ketchupu.","Pracownia: <strong>Workplace<\/strong>. Budynek: <strong>Harmony Office Park<\/strong>. Powierzchnia: 1 027 m². Branża: przemysł spożywczy."],"source":"","officelist_url":"https:/ "https://pliki.propertydesign.pl/i/21/46/66/214666_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/46/67/214667_r0_1140.jpg"],"photographer":"Neo Świat (mat. prasowe)","url":"","industry":"Insurance / Consulting","award":null,"description_paragraphs":["Biuro Grupy Marsh McLennan w warszawskim budynku Nimbus jest jak nowe. Projekt objął pięć kondygnacji o pow. 5,3 tys. mkw., wprowadzając nowoczesne rozwiązania funkcjonalne, poprawę akustyki i przestrzenie sprzyjające integracji.","Firma Neo Świat zakończyła kompleksową renowację biura dla spółek grupy Marsh McLennan (Marsh, Mercer, Guy Carpenter, Oliver Wyman) w budynku Nimbus przy Al. Jerozolimskich 98 w Warszawie. Prace objęły modernizację pięciu kondygnacji biurowych na poziomach 1-5, o łącznej powierzchni ok. 5 300 mkw. Inwestorem jest właściciel biurowca - CPI Property Group.","## Odmienione biuro grupy Marsh McLennan w Nimbusie","Projekt, zrealizowany w okresie od maja do września 2025 roku, obejmował kompleksową renowację powierzchni biurowych na piętrach o powierzchni około 1 060 mkw. każde. Zakres prac dotyczył wymiany okładzin ściennych i wykładzin dywanowych, a także dostosowania instalacji elektrycznych i HVAC.","Filcowe okładziny ścienne w zróżnicowanych kolorach nadały przestrzeniom nowoczesny, przyjazny ton i poprawiły komfort akustyczny.","## Strefa integracji na 5. piętrze","Największe zmiany wprowadzono na 5. piętrze, gdzie część przestrzeni open space została przekształcona w strefę wspólną z dużą kuchnią i centralną wyspą. Wydzielono nową salę konferencyjną, pomieszczenie magazynowe oraz dodatkowe budki telefoniczne.","Zakres prac obejmował również wkomponowanie nowych słupków instalacyjnych w salach konferencyjnych, na które przeniesiono osprzęt elektryczny i systemy sterowania oświetleniem oraz panele do rezerwacji sal."],"source":"","officelist_url":"https://www.officelist.pl/oferta/nimbus"},{"slug":"mat-pras-logistic-warszawa-2025","company":"Mat-Pras Logistic","city":"Warszawa","year":2025,"designer":"BIT Creative","area_m2":null,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-9.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-3.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-5.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-6.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-8.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office-9.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office10.jpg","https://www.officelovin.com/wp-content/uploads/2025/03/mat-pras-warsaw-office11.jpg"],"photographer":"Fotomohito","url":"","industry":null,"award":null,"description_paragraphs":["Biuro firmy Mat-Pras Logistic w Warszawie urządzono w stylu loftowym. Beton, szkło i metal przełamano drewnem, zielenią i czerwonymi akcentami.","Recepcja ma ladę z białego Corianu, nad którą zawieszono drewnianą instalację z motywem sześciokąta, powtarzanym też na ścianach. Czerwień pomaga w orientacji i wyróżnia ważniejsze strefy. Część socjalna ma charakter kawiarni, z barem, kuchnią i osobnym pokojem do odpoczynku.","Pracownia: <strong>BIT Creative<\/strong>."],"source":"","officelist_url":null},{"slug":"mute-warszawa-2025","company":"Mute","city":"Warszawa","year":2025,"designer":"Mute (Pawel Panek, Dominika Niewczas-Januszek)","area_m2":840,"building":"Hines-managed building","developer":null,"hero":"https://officesnapshots.com/wp-content/uploads/2025/09/mute-offices-warsaw-5-1200x800-compact.jpg","gallery":["https://officesnapshots.com/wp-content/u /omnires-offices-warsaw-2-800x1200-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-8-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-13-800x1200-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-5-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-9-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-12-1200x800-compact.jpg","https://officesnapshots.com/wp-content/uploads/2025/11/omnires-offices-warsaw-14-800x1200-compact.jpg"],"photographer":"zasoby studio","url":"","industry":null,"award":null,"description_paragraphs":["Biuro Omnires, producenta armatury łazienkowej i kuchennej, mieści się w kompleksie The Park w Warszawie. Loskiewicz.Studio oparło projekt na motywie płynącej wody.","Otwarta przestrzeń sąsiaduje z wydzielonymi pokojami działu sprzedaży i zarządu, a łuki łagodzą architekturę wnętrza. Przy ograniczonym dostępie do światła dziennego projektanci użyli zaokrąglonych luksferów, które doświetlają kuchnię. We wnętrzu pokazano prace Jacka Kołodziejskiego, w tym rzeźby z serii Gradient Sculptures.","Pracownia: <strong>Loskiewicz.Studio<\/strong>. Powierzchnia: 300 m²."],"source":"","officelist_url":null},{"slug":"rock-capital-warszawa-2025","company":"Rock Capital","city":"Warszawa","year":2025,"designer":"BIT Creative","area_m2":460,"building":"Metropolitan, plac Piłsudskiego","developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-2.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-4.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-1.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/08/rock-capital-office-3.jpg","htt
