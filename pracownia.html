<style>
:root {
  --bg: #EFEAE2; --bg-deep: #E5DFD3; --bone: #F3EFE6;
  --ink: #0F0F0E; --ink-soft: #2A2A28;
  --muted: #8B7E6A; --muted-soft: #B6AC99;
  --accent: #5E1A26; --accent-deep: #7A2433;
  --line: #D9D2C2; --paper: #FBF8F2;
  --black: #050505; --navy: #11151E;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); scroll-behavior: smooth; }
body {
  background: var(--bg); color: var(--ink);
  font-family: 'Inter', sans-serif;
  font-size: 16px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
}
img { display: block; max-width: 100%; height: auto; }
a { color: inherit; text-decoration: none; }
::selection { background: var(--accent); color: var(--paper); }

/* === Nav === */
.nav {
  position: fixed; top: 0; left: 0; right: 0; z-index: 100;
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 32px;
  background: rgba(239, 234, 226, 0.85);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid transparent;
  transition: border-color .3s;
}
.nav.scrolled { border-bottom-color: var(--line); }
.nav-brand {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-weight: 500;
  letter-spacing: -0.01em;
}
.nav-brand em { font-style: italic; color:var(--accent-text,#5E1A26); font-weight: 300; }
.nav-back {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink-soft);
  display: flex; align-items: center; gap: 8px;
  padding: 10px 18px;
  border: 1px solid var(--line);
  border-radius: 999px;
  transition: all .2s;
}
.nav-back:hover { background: var(--ink); color: var(--paper); border-color: var(--ink); }

/* === Hero === */
.hero {
  position: relative;
  min-height: 100vh;
  margin-top: 64px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  background: var(--bg);
  overflow: hidden;
}
.hero-visual {
  position: relative;
  background: var(--ink);
  min-height: 100vh;
  overflow: hidden;
}
.hero-visual img {
  width: 100%; height: 100%;
  object-fit: cover;
  opacity: 0.85;
  transition: opacity 1.2s ease, transform 14s linear;
}
.hero-visual:hover img { opacity: 1; transform: scale(1.04); }
.hero-visual::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(15,15,14,0.45) 0%, transparent 50%, rgba(15,15,14,0.3) 100%);
  pointer-events: none;
}
.hero-visual-label {
  position: absolute;
  bottom: 32px; left: 32px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase;
  color: rgba(251,248,242,0.7);
  z-index: 2;
}
.hero-content {
  padding: 100px 60px 60px;
  display: flex; flex-direction: column; justify-content: space-between;
  position: relative;
}
.hero-content::before {
  content: ''; position: absolute;
  top: 100px; left: 60px;
  width: 60px; height: 1px;
  background: var(--accent);
}
.hero-eyebrow {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--muted);
  margin-top: 28px;
}
.hero-eyebrow .accent { color:var(--accent-text,#5E1A26); }
.hero-name {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(40px, 5.5vw, 72px);
  line-height: 0.9;
  font-weight:500;
  letter-spacing: -0.03em;
  margin: 32px 0 28px;
  
}
.hero-name em { font-style: italic; font-weight: 300; color:var(--accent-text,#5E1A26); }
.hero-lede {
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; line-height: 1.45;
  font-weight:500; font-style: italic;
  color: var(--ink-soft);
  max-width: 480px;
  margin-bottom: 40px;
}

.hero-stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 24px;
  padding-top: 36px;
  border-top: 1px solid var(--line);
  margin-top: auto;
}
.stat {
  display: flex; flex-direction: column;
}
.stat-num {
  font-family: 'Cormorant Garamond', serif;
  font-size: 52px; line-height: 1;
  font-weight:500;
  
  margin-bottom: 8px;
}
.stat-num em { font-style: italic; color:var(--accent-text,#5E1A26); font-weight: 300; }
.stat-num.italic { font-style: italic; color:var(--accent-text,#5E1A26); font-weight: 300; }
.stat-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--muted);
}

@media (max-width: 900px) {
  .hero { grid-template-columns: 1fr; }
  .hero-visual { min-height: 60vh; }
  .hero-content { padding: 60px 24px; min-height: auto; }
  .hero-content::before { left: 24px; top: 60px; }
  .hero-stats { grid-template-columns: repeat(2, 1fr); gap: 20px; }
  .stat-num { font-size: 40px; }
}

/* === Marquee with cities === */
.marquee {
  padding: 28px 32px;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  background: var(--bone);
  overflow: hidden;
  white-space: nowrap;
}
.marquee-track {
  display: inline-block;
  font-family: 'Cormorant Garamond', serif;
  font-size: 22px; font-style: italic;
  letter-spacing: -0.01em;
  font-weight:500;
  color: var(--ink-soft);
  animation: marquee 28s linear infinite;
  padding-right: 32px;
}
.marquee-track .pip {
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  margin: 0 24px 4px;
  vertical-align: middle;
}
@keyframes marquee {
  from { transform: translateX(0); }
  to { transform: translateX(-50%); }
}

/* === Section heads === */
.section {
  padding: 100px 32px;
}
.section-head {
  max-width: 1280px; margin: 0 auto 60px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 60px;
  align-items: end;
}
.section-head-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 16px;
}
.section-head h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: clamp(40px, 5vw, 72px);
  line-height: 0.95;
  font-weight:500;
  letter-spacing: -0.02em;
}
.section-head h2 em { font-style: italic; color:var(--accent-text,#5E1A26); font-weight: 300; }
.section-head .right {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px; line-height: 1.5;
  color: var(--ink-soft);
  max-width: 460px;
  justify-self: end;
}

/* === Projects grid (studio's work) === */
.studio-grid {
  max-width: 1280px; margin: 0 auto;
  display: grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 60px 40px;
}
.proj {
  grid-column: span 4;
  position: relative;
  cursor: pointer;
}
.proj.featured { grid-column: span 6; }
.proj.full { grid-column: span 12; }
.proj-img {
  display: block;
  overflow: hidden;
  background: linear-gradient(135deg, #2A2A28 0%, #4A4540 50%, #6B5D4A 100%);
  position: relative;
  margin-bottom: 18px;
  min-height: 280px;
  aspect-ratio: 4 / 3;
}
.proj.featured .proj-img { min-height: 420px; aspect-ratio: 3 / 2; }
.proj.full .proj-img { min-height: 480px; aspect-ratio: 21 / 9; }
.proj-img img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 1.4s cubic-bezier(0.2, 0, 0.2, 1), filter .6s ease;
  filter: brightness(0.95);
}
.proj:hover .proj-img img { transform: scale(1.05); filter: brightness(1); }
.proj-img::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 60%, rgba(15,15,14,0.3) 100%);
  pointer-events: none;
}
.proj-tag {
  position: absolute; top: 14px; left: 14px;
  background: rgba(251,248,242,0.95);
  padding: 6px 12px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--ink);
  z-index: 2;
}
.proj-num {
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}
.proj-title {
  font-family: 'Cormorant Garamond', serif;
  font-size: 32px; line-height: 1.05;
  font-weight:500;
  letter-spacing: -0.01em;
  margin-bottom: 8px;
  
}
.proj.featured .proj-title { font-size: 42px; }
.proj-title em { font-style: italic; font-weight: 300; color:var(--accent-text,#5E1A26); }
.proj-meta {
  font-size: 12px; color: var(--muted);
  letter-spacing: 0.05em;
}
.proj-meta .building {
  display: block; margin-top: 4px;
  color: var(--ink-soft); font-size: 13px;
}

/* Placeholder for projects without hero */
.proj.no-hero .proj-img {
  background: linear-gradient(135deg, var(--bg-deep), var(--bg), var(--bone));
  display: flex; align-items: center; justify-content: center;
  flex-direction: column;
  padding: 24px; border: 1px solid var(--line);
}
.proj.no-hero .proj-img::before {
  content: attr(data-city);
  font-family: 'Cormorant Garamond', serif;
  font-size: 36px; font-style: italic; font-weight:500;
  color: var(--ink); margin-bottom: 10px;
}
.proj.no-hero .proj-img::after {
  content: attr(data-year);
  background: none;
  position: static; width: auto; height: auto;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px; color:var(--accent-text,#5E1A26); letter-spacing: 0.25em;
}

@media (max-width: 900px) {
  .studio-grid { grid-template-columns: repeat(6, 1fr); gap: 40px 24px; }
  .proj { grid-column: span 6; }
  .proj.featured, .proj.full { grid-column: span 6; }
  .proj-title { font-size: 28px; }
  .section { padding: 60px 20px; }
  .section-head { grid-template-columns: 1fr; gap: 24px; margin-bottom: 40px; }
  .section-head .right { justify-self: start; }
}

/* === Cities pill section === */
.cities-section {
  background: var(--bone);
  padding: 80px 32px;
  border-top: 1px solid var(--line);
}
.cities-wrap {
  max-width: 1280px; margin: 0 auto;
}
.cities-list {
  display: flex; flex-wrap: wrap; gap: 12px;
  margin-top: 28px;
}
.city-pill {
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px; font-style: italic; font-weight:500;
  padding: 12px 24px;
  background: var(--paper);
  border: 1px solid var(--line);
  border-radius: 999px;
  color: var(--ink);
}
.city-pill .count {
  font-family: 'JetBrains Mono', monospace;
  font-style: normal;
  font-size: 11px; letter-spacing: 0.15em;
  color:var(--accent-text,#5E1A26);
  margin-left: 8px;
}

/* === Buildings list === */
.buildings-section {
  padding: 80px 32px;
}
.buildings-list {
  max-width: 1280px; margin: 28px auto 0;
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 20px;
}
.building-card {
  padding: 24px;
  background: var(--bg-deep);
  border: 1px solid var(--line);
  font-family: 'Cormorant Garamond', serif;
  font-size: 18px; line-height: 1.3;
  color: var(--ink);
}
.building-card .small {
  display: block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px; letter-spacing: 0.25em; text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

/* === Footer nav === */
.footer-nav {
  padding: 50px 32px;
  display: flex; justify-content: space-between;
  border-top: 1px solid var(--line);
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase;
  color: var(--muted);
  gap: 16px;
  flex-wrap: wrap;
}
.footer-nav a { color: var(--ink); transition: color .2s; }
.footer-nav a:hover { color:var(--accent-text,#5E1A26); }

/* === Not-found === */
.notfound {
  min-height: 80vh;
  display: flex; flex-direction: column;
  justify-content: center; align-items: center;
  text-align: center; padding: 40px;
}
.notfound h1 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 72px; font-style: italic; font-weight:500;
  margin-bottom: 20px;
}
.notfound p { color: var(--muted); margin-bottom: 32px; }

/* ============ A11Y + PERFORMANCE LAYER ============ */
/* Reduced motion respect */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
    scroll-behavior: auto !important;
  }
  .marquee-track { animation: none !important; }
  .h1-split .word { transform: none !important; opacity: 1 !important; }
  .reveal, .reveal-stagger > *, .reveal-stagger { opacity: 1 !important; transform: none !important; }
  .anim-stroke { stroke-dashoffset: 0 !important; }
  .pulse-dot { animation: none !important; }
  .aurora-drift, .orb-drift { animation: none !important; }
}

/* Focus-visible accent ring */
:focus { outline: none; }
:focus-visible {
  outline: 2px solid var(--accent, #5E1A26) !important;
  outline-offset: 3px !important;
  border-radius: 2px;
}
.contact-btn:focus-visible,
.cta:focus-visible,
.so-search-trigger:focus-visible,
.back-top:focus-visible {
  outline-offset: 4px !important;
}

/* Skip-to-content link */
.skip-link {
  position: absolute;
  top: -100px;
  left: 16px;
  background: var(--ink, #0F0F0E);
  color: var(--paper, #FBF8F2);
  padding: 12px 20px;
  z-index: 9999;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  border: 2px solid var(--accent, #5E1A26);
  transition: top 0.2s;
}
.skip-link:focus,
.skip-link:focus-visible {
  top: 16px;
  outline-offset: 0 !important;
}

/* sr-only utility for screen-reader-only text */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}


/* ============ STUDIO SHARE + CREDITS ============ */

  display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:20px;
}
.studio-share-label{
  font-family:'JetBrains Mono', monospace;
  font-size:11px; letter-spacing:0.2em; text-transform:uppercase;
  color:var(--accent-text,#5E1A26); font-weight:600;
}
.studio-share-btns{display:flex; gap:10px; flex-wrap:wrap;}
.studio-share-btn{

  border:1px solid var(--line, #D9D2C2);
  color:var(--ink, #0F0F0E);
  font-family:'JetBrains Mono', monospace; font-size:10px; letter-spacing:0.14em; text-transform:uppercase;

}
.studio-share-btn:hover{

.studio-share-btn svg{width:14px; height:14px;}
.studio-share-btn.copy.done{background:#2A6F4D; color:#FBF8F2; border-color:#2A6F4D;}

.studio-stats-block{
  margin:60px 0;
  padding:36px 40px;
  background:var(--paper, #FBF8F2);
  border:1px solid var(--line, #D9D2C2);
}
.studio-stats-head{
  font-family:'JetBrains Mono', monospace;
  font-size:10px; letter-spacing:0.2em; text-transform:uppercase;
  color:var(--accent-text,#5E1A26); margin-bottom:28px;
}
.studio-stats-grid{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:24px;
}
.studio-stat-cell{
  padding:0 12px 0 0;
}
.studio-stat-cell .label{
  font-family:'JetBrains Mono', monospace;
  font-size:9px; letter-spacing:0.18em; text-transform:uppercase;
  color:var(--muted, #8B7E6A); margin-bottom:8px;

e":"","officelist_url":null},{"slug":"ot-logistics-krakow-2025","company":"OT Logistics","city":"Kraków","year":2025,"designer":"Joanna Kłusak (pracownia architektoniczna)","area_m2":null,"building":"Zabytkowy budynek przy Galerii Kazimierz","developer":null,"hero":"https://pliki.propertydesign.pl/i/20/80/71/208071_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/20/80/57/208057_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/55/208055_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/56/208056_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/59/208059_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/60/208060_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/58/208058_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/61/208061_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/62/208062_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/64/208064_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/63/208063_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/66/208066_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/67/208067_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/71/208071_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/74/208074_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/75/208075_r0_1140.jpg","https://pliki.propertydesign.pl/i/20/80/76/208076_r0_1140.jpg"],"photographer":"Tomasz Prokop","url":"","industry":"Logistics / Ports","award":null,"description_paragraphs":["W zaledwie trzy miesiące architektka Joanna Kłusak przekształciła surową przestrzeń zabytkowego budynku przy Galerii Kazimierz w funkcjonalne, nastrojowe biuro OT Logistics. Projekt harmonijnie łączy portowe DNA firmy z charakterem miejsca, tworząc przestrzeń wspierającą codzienną pracę zespołu.","W centrum krakowskiego Kazimierza, w historycznym budynku objętym ochroną konserwatorską, powstała nowa siedziba firmy OT Logistics. Za projekt odpowiada architektka Joanna Kłusak, która w zaledwie trzy miesiące przekształciła surową przestrzeń w przemyślane, funkcjonalne i nastrojowe biuro.","## Biuro, które pracuje razem z zespołem","Zabytkowy obiekt przy Galerii Kazimierz - jego ceglane elewacje, zachowane historyczne okna, balustrady i surowe, betonowe stropy - stał się największą inspiracją dla architektki. Recepcja prowadzi do sali konferencyjnej, gabinetu prezesa oraz gabinetu zarządu, a także dalej do stref pracowniczych: open space'u, pokoi biurowych i pomieszczeń wspólnych.","## Styl z portowym DNA","Wnętrza subtelnie nawiązują do działalności firmy, która operuje portami w Świnoujściu i Gdyni. W gabinetach pojawiły się grafiki i fototapety z planami portów. Styl loftowy, zmiękczony tekstyliami i ciepłym drewnem, dopełnia wnętrza.","Nieoczywistym akcentem jest zieleń. Żywe rośliny pojawiają się w całym biurze, a dwie zielone ściany - w recepcji i gabinecie prezesa. Część strefy open space została wizualnie oddzielona stalową konstrukcją z roślinami, uzupełnioną o huśtawkę i ławeczkę.","## Światło wspierające funkcję i estetykę"],"source":"","officelist_url":null},{"slug":"vercom-s-a-and-cyber-folks-krakow-2025","company":"Vercom S.A. & cyber_Folks","city":"Kraków","year":2025,"designer":"Flamaster (Agata Plackowska)","area_m2":477,"building":"Quattro Business Park","developer":null,"hero":"https://pliki.propertydesign.pl/i/22/39/54/223954_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/22/39/56/223956_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/39/55/223955_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/39/59/223959_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/39/58/223958_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/39/57/223957_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/39/61/223961_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/39/91/223991_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/40/00/224000_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/40/03/224003_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/40/12/224012_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/40/13/224013_r0_1140.jpg"],"photographer":"Marta Behling (Pion Poziom Fotografia)","url":"","industry":"IT / SaaS","award":null,"description_paragraphs":["Krakowska siedziba Vercom S.A. i cyber_Folks została zaprojektowana tak, by wspierać pracę głęboką i ograniczać przebodźcowanie. Zamiast klasycznego open space'u postawiono na kameralne strefy, akustykę i biophilic design.","W krakowskiej siedzibie Vercom S.A. i cyber_Folks o powierzchni 477 mkw., nadrzędnym celem było stworzenie środowiska wspierającego pracę głęboką i redukującego przebodźcowanie, co jest kluczowym wyzwaniem w branży IT.","## Funkcja przed estetyką: biuro bez open space'u","W projekcie świadomie zrezygnowano z klasycznego open space'u na rzecz mniejszych, bardziej kameralnych stref, co pozwoliło ograniczyć zarówno hałas, jak i wizualny chaos. Postawiono na biophilic design - naturalne drewno, łagodną paletę barw i rozbudowaną roślinność.","## Re-use i racjonalny budżet","W realizacji zastosowano zasadę re‑use, wykorzystując istniejące, wysokiej klasy szklane ścianki działowe pozostałe po wcześniejszej aranżacji oddziału banku. Oszczędności przekierowano na customowe elementy stolarskie oraz zaawansowane rozwiązania akustyczne.","## Neuroinkluzywność i praca hybrydowa","W projekcie stworzono zestaw przemyślanych „magnesów\", które mają przyciągać zespół do biura. Jednym z nich jest wielofunkcyjna sala do jogi i regeneracji, która dzięki mobilnym meblom pełni rolę sali konferencyjnej. Centralnym punktem biura stał się Social Hub - kuchnia jako centrum networkingu."],"source":"","officelist_url":"https://www.officelist.pl/oferta/quattro-business-park"},{"slug":"auchan-polska-piaseczno-2025","company":"Auchan Polska","city":"Piaseczno","year":2025,"designer":"Tétris Poland (Sylwia Drążkiewicz-Kuczyńska, Aleksandra Wyczółkowska-Gajowniczek)","area_m2":770,"building":"Centrum logistyczne / siedziba","developer":null,"hero":"https://pliki.propertydesign.pl/i/22/16/17/221617_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/22/15/84/221584_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/86/221586_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/82/221582_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/80/221580_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/81/221581_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/83/221583_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/85/221585_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/87/221587_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/15/88/221588_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/16/17/221617_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/16/18/221618_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/16/19/221619_r0_1140.jpg"],"photographer":"Szymon Polański","url":"","industry":"Retail","award":null,"description_paragraphs":["Biura w obiektach logistycznych mogą być nowoczesne i komfortowe. Przykładem jest nowa siedziba Auchan powstała przy niedawno otwartym centrum dystrybucyjnym Auchan w Wilczej Górze.","Eksperci Tétris Poland, spółki z grupy JLL, oddają nowe biuro o powierzchni niemal 800 m kw. zrealizowane dla firmy Auchan. Biuro powstało w ramach kompleksowej realizacji projektu Build-to-Suit (BTS).","## Nowy standard biur przy obiektach magazynowych","Biuro Auchan ma około 770 m kw. powierzchni biurowej na dwóch poziomach. Zaplanowano tu blisko 40 stanowisk pracy oraz pięć sal spotkań. Na poziomie 0 stworzono strefę recepcyjną oraz kantynę. Poziom 2 obejmuje gabinety, biura wieloosobowe, strefę dyrektorską oraz coffee point ze strefą chillout.","## Komfort pracy","Projektanci zastosowali wykładzinę dywanową, szklane ścianki o wysokich parametrach akustycznych oraz dedykowane filcowe elementy akustyczne. Punktem wyjścia była identyfikacja wizualna marki Auchan - czerwień i zieleń, zestawione z odcieniami beżu, bordo oraz jasnym drewnem.","Szczególną rolę odgrywa kantyna, zaprojektowana jako serce obiektu z płytkami ściennymi w niebanalnych układach i okrągłymi wyspami sufitowymi.","W przestrzeniach biurowych zastosowano wykładzinę dywanową o niskim śladzie węglowym, z ponad 53-procentowym udziałem materiałów z recyklingu, oraz energooszczędne oświetlenie LED."],"source":"","officelist_url":null},{"slug":"mjg-poznan-2025","company":"MJG","city":"Poznań","year":2025,"designer":"mode:lina","area_m2":620,"building":"ul. Wujka 9, Poznań","developer":null,"hero":"https://modelina-architekci.com/wp-content/uploads/2025/10/MA449_W9_press-16.jpg","gallery":["https://modelina-architekci.com/wp-content/uploads/2025/10/MA449_W9_press-22-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/10/MA449_W9_press-02-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/10/MA449_W9_press-32-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/10/MA449_W9_press-60-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/10/MA449_W9_press-27-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/10/MA449_W9_press-12-1920x1280.jpg","https://modelina-architekci.com/wp-content/uploads/2025/10/MA449_W9_press-47-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/10/MA449_W9_press-10-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/10/MA449_W9_press-24-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/10/MA449_W9_press-29-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/10/MA449_W9_press-58-1920x1282.jpg","https://modelina-architekci.com/wp-content/uploads/2025/10/MA449_W9_press-08-1920x1282.jpg"],"photographer":"Patryk Lewiński","url":"","industry":null,"award":null,"description_paragraphs":["Biuro współdzielone trzech spółek: MJG, INDEX FOOD i VININOVA. Lipiec 2025. ul. Wujka 9, Poznań, 620 m².","Włoska atmosfera w poznańskim biurowcu - łuki, wino na półkach, blaty z marmuru.","Za projektem stoi <strong>mode:lina<\/strong> - poznańska pracownia znana z tematycznych, narracyjnych biur dla firm technologicznych i agencji."],"source":"","officelist_url":null},{"slug":"ace-of-space-globalworth-warszawa-2025","company":"Ace of Space (Globalworth)","city":"Warszawa","year":2025,"designer":"Globalworth in-house","area_m2":null,"building":"Portfel Globalworth (~580 tys. mkw.)","developer":"Globalworth","hero":"https://pliki.propertydesign.pl/i/19/90/40/199040_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/19/90/40/199040_r0_1140.jpg"],"photographer":null,"url":"","industry":"Coworking / Flex","award":null,"description_paragraphs":["Rynek elastycznych powierzchni biurowych wciąż dynamicznie się rozwija. Elastyczne powierzchnie biurowe stały się integralną częścią rynku biurowego.","## Dynamiczny rozwój rynku elastycznych przestrzeni biurowych w Warszawie","Rok 2024 był wyjątkowo dynamiczny dla warszawskiego rynku elastycznych przestrzeni biurowych. Operatorzy w Warszawie wynajęli 28 600 m kw. w 16 lokalizacjach. Najbardziej aktywnym graczem był The Shire - Beyond Coworking. Na koniec roku stolica oferowała blisko 205 000 m kw. powierzchni coworkingowej w 85 lokalizacjach.","## Ace of Space - nowy operator Globalworth","Ace of Space - operator należący do Globalworth - wnosi do rynku unikalne know-how wynikające z synergii między operatorem a właścicielem nieruchomości. Globalworth zarządza portfelem obiektów w największych polskich miastach oferując prawie 580 tys. m kw. powierzchni najmu. Operator dysponuje doświadczeniem w projektowaniu i dostarczaniu nowoczesnych powierzchni biurowych.","## Korporacje polubiły biura serwisowane","Biura serwisowane stanowią atrakcyjną opcję dla małych, średnich i dużych przedsiębiorstw. Coraz bogatsza oferta przyciąga firmy z różnych sektorów: IT, finansów, mediów, logistyki czy cyberbezpieczeństwa."],"source":"","officelist_url":null},{"slug":"axpo-polska-warszawa-2025","company":"Axpo Polska","city":"Warszawa","year":2025,"designer":"BIT Creative","area_m2":1484,"building":null,"developer":null,"hero":"https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-1.jpg","gallery":["https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-1.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-2.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-4.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-5.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-6.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-8.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-9.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-10.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-11.jpg","https://www.officelovin.com/wp-content/uploads/2025/02/axpo-office-warsaw-12.jpg"],"photographer":"Fotomohito","url":"","industry":null,"award":null,"description_paragraphs":["Biuro Axpo Polska na 25. piętrze warszawskiego wieżowca zaprojektowało BIT Creative. Wnętrze nawiązuje do energii i zrównoważonego rozwoju, z naturalnym drewnem, mchem i dużą ilością zieleni.","Siedem sal konferencyjnych poświęcono różnym źródłom energii: w sali Solar stół wykonano z paneli fotowoltaicznych, w Hydro z drewna i niebieskiej żywicy, a w salach Small Wind i Big Wind pod falistymi sufitami wiszą lampy w kształcie łopat turbin. W biurze jest też sześć pokoi do cichej pracy, kuchnia z jadalnią i kącik do ćwiczeń.","Pracownia: <strong>BIT Creative<\/strong>. Powierzchnia: 1 484 m²."],"source":"","officelist_url":null},{"slug":"bat-dbs-poland-faza-ii-wow-hub-warszawa-2025","company":"BAT DBS Poland - faza II (WOW!Hub)","city":"Warszawa","year":2025,"designer":"The Design Group","area_m2":4000,"building":"P180, ul. Puławska 180","developer":null,"hero":"https://thedesigngroup.pl/wp-content/uploads/2026/06/15_BAT-3.jpg","gallery":["https://thedesigngroup.pl/wp-content/uploads/2026/06/15_BAT-3.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/18_BAT-7.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/03_BAT-17.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/06_BAT-14.jpg","https://thedesigngroup.pl/wp-content/uploads/2026/06/07_BAT-15.jpg"],"photographer":null,"url":"","industry":"FMCG / tobacco services","award":null,"description_paragraphs":["Druga faza WOW!Hub dla BAT DBS powstała na innym piętrze P180 przy Puławskiej 180, rok po pierwszej. Wygląda podobnie, ale dokłada funkcje, których brakowało.","Ten etap to głównie części wspólne: reprezentacyjna recepcja, sala na wydarzenia i szkolenia, kuchnia i miejsca do codziennych spotkań. Projekt prowadzili Konrad Krusiewicz, Marta Konarska-Smykiewicz, Martyna Bosek i Natallia Wasilewska.","Pracownia: <strong>The Design Group<\/strong>. Budynek: <strong>P180, ul. Puławska 180<\/strong>. Powierzchnia: 4 000 m²."],"source":"tdg-zgoda-2026-11-05","officelist_url":"https://www.officelist.pl/oferta/p180"},{"slug":"beiersdorf-polska-nivea-warszawa-2025","company":"Beiersdorf Polska (Nivea)","city":"Warszawa","year":2025,"designer":"Trzop Architekci","area_m2":340,"building":"Varso Tower (37. piętro)","developer":"HB Reavis","hero":"https://www.trzoparchitekci.pl/storage/2025/09/2025-06-27-nivea_DSC00715_done.jpg","gallery":["https://www.trzoparchitekci.pl/storage/2025/09/2025-06-27-nivea_DSC00718_done_monitor_orginal.jpg","https://www.trzoparchitekci.pl/storage/2025/09/2025-06-27-nivea_DSC00724_done.jpg","https://www.trzoparchitekci.pl/storage/2025/09/2025-06-27-nivea_DSC00760_done.jpg","https://www.trzoparchitekci.pl/storage/2025/09/2025-06-27-nivea_DSC00775_done.jpg","https://www.trzoparchitekci.pl/storage/2025/09/2025-06-27-nivea_DSC00790_done.jpg","https://www.trzoparchitekci.pl/storage/2025/09/2025-06-27-nivea_DSC00880_done.jpg","https://www.trzoparchitekci.pl/storage/2025/09/2025-06-27-nivea_DSC00901_done.jpg","https://www.trzoparchitekci.pl/storage/2025/09/2025-06-27-nivea_DSC00967-done.jpg","https://www.trzoparchitekci.pl/storage/2025/09/2025-06-27-nivea_DSC01012_done.jpg","https://www.trzoparchitekci.pl/storage/2025/09/2025-06-27-nivea_DSC01048_done.jpg","https://www.trzoparchitekci.pl/storage/2025/09/2025-06-27-nivea_DSC01095_done.jpg"],"photographer":"Tétris Poland (mat. prasowe)","url":"","industry":"Cosmetics / FMCG","award":null,"description_paragraphs":["Beiersdorf Polska ma nową przestrzeń biurową w najwyższym budynku UE. Zaglądamy do siedziby producenta kosmetyków Nivea.","Firma Tétris Poland zakończyła realizację przestrzeni biurowej dla Beiersdorf Polska na 37. piętrze wieżowca Varso Tower w Warszawie. Ta przestrzeń o powierzchni 340 m² łączy funkcjonalność z eleganckim designem inspirowanym charakterem działalności tego producenta kosmetyków, m.in. marki NIVEA.","Projekt koncepcyjny został przygotowany przez pracownię Trzop Architekci. Realizacja odbyła się na zlecenie HB Reavis, zarządcy budynku Varso, pod nadzorem JLL.","W projekcie uwzględniono 21 stanowisk pracy oraz trzy sale konferencyjne mogące pomieścić łącznie 26 osób. Dwie sąsiadujące sale można łączyć w jedną większą przestrzeń spotkań.","Biuro charakteryzuje się innowacyjnym podejściem do przestrzeni wspólnych - zamiast tradycyjnej recepcji zastosowano przestrzeń z komfortowymi kanapami i stanowiskami hot desk. Pracownicy mają do dyspozycji focus room, budkę telefoniczną, kuchnię oraz copy point.","Najbardziej reprezentatywną częścią projektu jest strefa wejściowa z podświetlaną gablotą eksponującą produkty brandowe oraz podświetlanym logo. Wyjątkowe rozwiązania obejmują niszę wejściową w formie łuku z podświetlanymi kanapami oraz oryginalne płytki w kształcie gorsecików nad blatem kuchennym.","Biuro wyróżnia się niebieskim natryskowym malowaniem instalacji i sufitu w ciągu komunikacyjnym, nawiązującym do barw firmowych marki. Realizacja podporządkowana była wymogom certyfikacji BREEAM."],"source":"","officelist_url":"https://www.officelist.pl/oferta/varso-tower"},{"slug":"cd-projekt-red-warszawa-2025","company":"CD PROJEKT RED","city":"Warszawa","year":2025,"designer":"MXCF Architekci (Marta Chrzanowska, Marcin Ferenc)","area_m2":4000,"building":"Nowy budynek na kampusie przy ul. Jagiellońskiej (proj. Medusa Group)","developer":"CD PROJEKT S.A.","hero":"https://pliki.propertydesign.pl/i/21/54/00/215400_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/21/53/92/215392_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/54/00/215400_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/94/215394_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/93/215393_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/96/215396_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/95/215395_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/97/215397_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/98/215398_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/53/99/215399_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/54/01/215401_r0_1140.jpg"],"photographer":"Nate Cook Photography","url":"","industry":"Gaming / Tech","award":null,"description_paragraphs":["Tak wygląda nowe biuro CD PROJEKT RED w Warszawie. Wnętrza projektu MXCF Architekci to elastyczna przestrzeń z nawiązaniami do poprzemysłowej okolicy, dużo zieleni i intensywnie czerwona klatka schodowa.","W czerwcu 2025 r. CD PROJEKT RED, producent gier video Wiedźmin i Cyberpunk 2077, otworzył swoją nową siedzibę - powstały według projektu Medusa Group budynek zlokalizowany w kampusie firmy przy ul. Jagiellońskiej w Warszawie. Na pięciu kondygnacjach mieszczą się wnętrza biurowe spod kreski pracowni MXCF Architekci.","## W centrum uwagi biura... klatka schodowa","Projekt objął aranżację 4000 mkw. powierzchni biurowej z 320 stanowiskami pracy na piętrach 1-5. Kondygnacje biurowe zostały połączone intensywnie czerwoną stalową klatką schodową, która jest jednocześnie punktem rozpoznawczym i łącznikiem między zespołami.","## Przestrzeń przyjazna pracownikom","Modułowa aranżacja podąża za rytmem konstrukcji budynku. Kondygnacje podzielone są na biura zespołów, rozdzielone kubikami zawierającymi sale spotkań i cichej pracy. Każda kondygnacja podzielona na cztery ćwiartki - biura open space.","## Naturalne materiały i dużo zieleni","Zadbano o akustykę: sufity i panele perforowane, natrysk akustyczny z celulozy z recyklingu, ogromną ilość zieleni. Materiały wykończeniowe: sklejka, listwy drewniane, wełniane tapicerki.","Pracownia: <strong>MXCF Architekci<\/strong> (Marta Chrzanowska, Marcin Ferenc). Inwestor: <strong>CD PROJEKT S.A.<\/strong>. Zdjęcia: Nate Cook Photography."],"source":"","officelist_url":null},{"slug":"clyde-and-co-warszawa-2025","company":"Clyde & Co","city":"Warszawa","year":2025,"designer":"Trzop Architekci","area_m2":null,"building":"The Form","developer":null,"hero":"https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_005_90062.jpg","gallery":["https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_007_9017.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_009_9023.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_010_9025.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_011_9118.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_012_9032.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_013_9034.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_015_9061.jpg","https://www.trzoparchitekci.pl/storage/2025/09/fotomohito_trzop_clyde_017_9067.jpg"],"photographer":"fotomohito","url":"","industry":"usługi prawne","award":null,"description_paragraphs":["Biuro kancelarii Clyde & Co w The Form. Modernistyczne inspiracje warszawskimi kamienicami z lat 30. Lada recepcyjna z kamienia z poprzedniej lokalizacji, ręcznie formowane kafle z Nakomiad, fotele Egg Arne Jacobsena.","Pracownia: <strong>Trzop Architekci<\/strong>. Lokalizacja: <strong>The Form<\/strong>. Fotografia: <em>fotomohito<\/em>.","Branża najemcy: usługi prawne."],"source":"","officelist_url":"https://www.officelist.pl/oferta/the-form"},{"slug":"doraco-warszawa-2025","company":"Doraco","city":"Warszawa","year":2025,"designer":"Pik Studio","area_m2":1000,"building":"Saski Crescent (ul. Królewska)","developer":null,"hero":"https://pliki.propertydesign.pl/i/21/08/83/210883_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/21/08/72/210872_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/75/210875_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/74/210874_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/76/210876_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/71/210871_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/73/210873_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/77/210877_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/79/210879_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/81/210881_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/78/210878_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/82/210882_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/80/210880_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/83/210883_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/84/210884_r0_1140.jpg","https://pliki.propertydesign.pl/i/21/08/85/210885_r0_1140.jpg"],"photographer":"Pik Studio (mat. prasowe)","url":"","industry":"Construction / GC","award":null,"description_paragraphs":["Na siódmym piętrze z widokiem na Park Saski i ul. Marszałkowską w Warszawie powstało nowe biuro firmy Doraco. Za projekt odpowiada Pik Studio, które postawiło na funkcjonalizm, naturalne materiały i futurystyczne detale.","Nowe biuro Doraco mieści się w świeżo wyremontowanym budynku Saski Crescent przy ul. Królewskiej w Warszawie. Za projekt biura odpowiada warszawska pracownia Pik Studio.","## Nowoczesne biuro Doraco z widokiem na Warszawę","Nowa przestrzeń biurowa Doraco o pow. 1 tys. mkw. zajmuje całe siódme piętro. Z okien biura widać Park Saski i ul. Marszałkowską.","„Naszą główną ideą w projekcie był funkcjonalizm. Na wejściu ustawiliśmy recepcję główną z miejscem odpoczynku dla klienta. Tutaj mamy także część konferencyjną, tak żeby klient nie musiał wchodzić do części prywatnej biura\" - opowiada Kuba Kasprzak.","W biurze postawiono na stonowaną kolorystykę i naturalne materiały. Dominującym akcentem jest drewno orzecha amerykańskiego, które nadaje wnętrzu ciepła i prestiżu.","W nowym biurze znalazła się futurystyczna lada ze stali nierdzewnej, sufit akustyczny ułożono w jodełkę, zaś słupy konstrukcyjne budynku obłożone zostały zielenią. W gabinetach prezesowskich postawiono na indywidualne projekty mebli w futurystycznych kształtach."],"source":"","officelist_url":"https://www.officelist.pl/oferta/saski-crescent"},{"slug":"dr-gerard-adam-foods-warszawa-2025","company":"Dr Gerard (Adam Foods)","city":"Warszawa","year":2025,"designer":"Abundo Space (Małgorzata Kopyt)","area_m2":null,"building":null,"developer":null,"hero":"https://pliki.propertydesign.pl/i/22/45/32/224532_r0_1140.jpg","gallery":["https://pliki.propertydesign.pl/i/22/45/07/224507_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/08/224508_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/09/224509_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/10/224510_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/12/224512_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/11/224511_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/14/224514_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/13/224513_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/15/224515_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/16/224516_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/18/224518_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/17/224517_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/19/224519_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/21/224521_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/22/224522_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/30/224530_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/31/224531_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/32/224532_r0_1140.jpg","https://pliki.propertydesign.pl/i/22/45/35/224535_r0_1140.jpg"],"photographer":"Abundo Space","url":"","industry":"FMCG / Confectionery","award":null,"description_paragraphs":["Dr Gerard to jedna z najbardziej rozpoznawalnych marek słodyczy w Polsce, należąca do Grupy Adam Foods. Firma postanowiła odmienić biuro w Warszawie.","Pod koniec zeszłego roku pracownia Abundo Space zakończyła projekt rearanżacji przestrzeni biurowej w Warszawie dla firmy Dr Gerard.","## Rearanżacja biura: architektura, która prowadzi","Już od wejścia uwagę przyciąga dynamiczna, płynąca linia posadzki. Organiczne formy w odcieniu czerwieni - kolorze silnie związanym z identyfikacją wizualną Dr Gerard - wyznaczają naturalne ciągi komunikacyjne i porządkują przestrzeń. Kontrast czerwieni z ciepłymi szarościami i beżami buduje energetyczny, ale zrównoważony charakter wnętrza.","## Komfort akustyczny","Zastosowano kompleksowe rozwiązania: wykładziny dywanowe o wysokich parametrach pochłaniania, tapicerowane meble, panele ścienne redukujące pogłos, sufity podwieszane z elementami akustycznymi, zasłony akustyczne, panele biurkowe oraz mobilne ścianki.","## Przytulne biuro zamiast „korporacyjnego\" chłodu","Wnętrze ocieplają naturalne materiały, drewno, miękkie formy foteli, stonowana kolorystyka oraz nastrojowe oświetlenie. Subtelnie podświetlane witryny eksponują produkty marki."],"source":"","officelist_url":null},{"slug":"estetyczna-grupa-warszawa-2025","company":"HDRÈY Group","city":"Warszawa","year":2025,"designer":"Art'Up Interiors","area_m2":null,"building":null,"developer":null,"hero
